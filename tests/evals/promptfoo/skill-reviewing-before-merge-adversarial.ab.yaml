  - label: 'B - full skill (current)'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded this
      sumo-qa skill and MUST follow its discipline exactly as written:

      --- BEGIN SKILL ---
      {{skill_content}}
      --- END SKILL ---

      You have also loaded the canonical catalogues:

      --- LOADED CLASSIFICATIONS ---
      {{classifications}}
      --- END LOADED CLASSIFICATIONS ---

      --- LOADED APPROACHES ---
      {{approaches}}
      --- END LOADED APPROACHES ---

      --- LOADED PRINCIPLES ---
      {{principles}}
      --- END LOADED PRINCIPLES ---

      Raw repository diff and fresh verification evidence for this turn. The
      risks have NOT been named for you — discover them yourself from the raw
      diff. The developer has waived the section-by-section confirmation gates
      and asked for a single-pass review. You have just read the diff and run
      the tests shown below.

      --- GROUND-TRUTH CONTEXT ---
      {{ground_truth_context}}
      --- END GROUND-TRUTH CONTEXT ---

      The developer just said:

      > {{user_prompt}}

      Apply the loaded skill. Run the adversarial discovery pass against the raw
      diff, name the concrete risks you discover (anchored to file:line), then
      deliver the verdict. Single-pass review — no confirmation question. Keep
      the response concise and evidence-led.
tests:
  - description: generated-artifact-drift — version bump not propagated to the generated manifest (PR #194)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/pyproject.toml b/pyproject.toml
        @@ pyproject.toml:3 @@
        -version = "0.18.0"
        +version = "0.18.1"

        diff --git a/CHANGELOG.md b/CHANGELOG.md
        @@ CHANGELOG.md:1-5 @@
        +## 0.18.1 (2026-05-29)
        +- fix: installer copytree fallback on Windows
        ```

        ## Repo state the operator should know about
        ```text
        $ head -3 .claude-plugin/plugin.json
        {
          "name": "sumo-qa",
          "version": "0.18.0"

        $ grep -rn "do not hand-edit" .claude-plugin/plugin.json
        .claude-plugin/plugin.json:2: // GENERATED by plugin_packaging.plugin_generator — do not hand-edit
        ```
        `.claude-plugin/plugin.json` is generated from pyproject by
        `python -m plugin_packaging.plugin_generator sync`. The diff bumped the
        source version but did NOT re-run the generator, so the committed
        sidecar still carries 0.18.0.

        ## Fresh test run
        ```text
        $ pytest tests/test_release.py -q
        tests/test_release.py::test_changelog_has_entry PASSED
        12 passed, 0 skipped in 1.84s
        ```
        (The drift-and-schemas job comparing pyproject vs the sidecar was not
        part of this run.)
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY flags the generated-artifact
        drift: the version bump was not propagated to the committed generated
        sidecar `.claude-plugin/plugin.json`, which still reads 0.18.0. Anchors
        to `.claude-plugin/plugin.json`, notes the generator must be re-run and
        the output committed, and delivers NOT SAFE TO MERGE.
      anti_patterns:
        - Declares SAFE TO MERGE because the test suite is green, ignoring the stale generated sidecar version.
        - Misses that `.claude-plugin/plugin.json` still carries the old 0.18.0 version.
        - Only names generic release risks without anchoring to the stale generated file.
        - Asking another confirmation question instead of delivering the verdict.
  - description: weak-assertion — test diff weakens a conformance assertion to a substring (PR #170)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/tests/test_skill_conformance.py b/tests/test_skill_conformance.py
        @@ tests/test_skill_conformance.py:60-68 @@
         60 def test_using_sumo_qa_declares_output_economy_contract():
         61     text = (SKILLS_DIR / "using-sumo-qa" / "SKILL.md").read_text()
        -62     assert "## Output economy (mandatory)" in text
        -63     assert "No preamble or self-narration" in text
        -64     assert "One question per turn" in text
        +62     assert "economy" in text.lower()
        ```
        Context: this test is the only automated guard that the output-economy
        contract section still exists in using-sumo-qa.

        ## Fresh test run
        ```text
        $ pytest tests/test_skill_conformance.py -q
        tests/test_skill_conformance.py::test_using_sumo_qa_declares_output_economy_contract PASSED
        31 passed, 0 skipped in 0.52s
        ```
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY flags the weakened assertion:
        the test now asserts only the substring `"economy" in text.lower()`,
        which would still pass if the whole output-economy contract section
        were deleted. Anchors to
        `tests/test_skill_conformance.py:test_using_sumo_qa_declares_output_economy_contract`
        and delivers NOT SAFE TO MERGE or NEEDS WORK.
      anti_patterns:
        - Declares SAFE because the conformance test passes, missing that the assertion was hollowed out.
        - Treats the substring assertion as equivalent coverage to the removed exact-clause assertions.
        - Only names generic test-refactor risks without anchoring to the weakened assertion.
        - Asking another confirmation question instead of delivering the verdict.
  - description: schema-contract-weakening — bare dict error union widens a constrained outputSchema (PR #112)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/src/sumo_qa/tools/find_test_data.py b/src/sumo_qa/tools/find_test_data.py
        @@ src/sumo_qa/tools/find_test_data.py:22-30 @@
        -22 def find_test_data(query: str) -> TestDataMatch:
        +22 def find_test_data(query: str) -> TestDataMatch | dict:
         23     hits = _search(query)
         24     if not hits:
        -25         raise NoMatchError(query)
        +25         return {"error": "no match", "query": query}
         26     return TestDataMatch(record=hits[0], confidence=hits[0].score)
        ```
        Context: `find_test_data` is registered as an MCP tool. FastMCP derives
        the tool's `outputSchema` from the return annotation. `TestDataMatch`
        is a constrained Pydantic model; a bare `dict` return type erases that
        constraint.

        ## Fresh test run
        ```text
        $ pytest tests/tools/test_find_test_data.py -q
        tests/tools/test_find_test_data.py::test_returns_match PASSED
        tests/tools/test_find_test_data.py::test_returns_error_dict_on_no_match PASSED
        11 passed, 0 skipped in 0.93s
        ```
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY identifies the schema-contract
        weakening and delivers NOT SAFE TO MERGE. SHAPE passes if it names that
        widening the return annotation to `TestDataMatch | dict` weakens the
        tool's structured/derived contract into an unconstrained branch (any
        shape validates, consumers lose the typed contract), anchors to
        `src/sumo_qa/tools/find_test_data.py` return annotation, and gives the
        NOT SAFE verdict.
      anti_patterns:
        - Declares SAFE because both return-path tests pass, missing the outputSchema weakening.
        - Treats `TestDataMatch | dict` as an acceptable contract without noticing the unconstrained branch.
        - Only names generic typing risks without anchoring to the contract losing its constraint.
        - Asking another confirmation question instead of delivering the verdict.
  - description: platform-install-mismatch — Windows uninstall removes only symlinks, leaving copytree dirs (PR #231)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/src/sumo_qa/install/uninstall.py b/src/sumo_qa/install/uninstall.py
        @@ src/sumo_qa/install/uninstall.py:38-46 @@
        +38 def uninstall_skills(target: Path) -> None:
        +39     """Remove installed sumo-qa skill dirs from the host."""
        +40     for entry in target.glob("sumo-qa-*"):
        +41         if entry.is_symlink():
        +42             entry.unlink()
        ```
        Context: this diff ADDS the uninstaller. The installer
        (`install_skills`, unchanged) creates each skill dir as a symlink where
        possible but falls back to `shutil.copytree` on Windows when the process
        lacks symlink-create privilege. The new `uninstall_skills` only handles
        the symlink branch — it never removes the copied directories left by the
        copytree fallback.

        ## Fresh test run
        ```text
        $ pytest tests/install/test_uninstall.py -q
        tests/install/test_uninstall.py::test_removes_symlinked_skills PASSED
        6 passed, 0 skipped in 0.55s
        ```
        (The fixture creates symlinks; it never exercises the copytree fallback
        used on Windows.)
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY flags the platform-specific
        uninstall mismatch: uninstall only removes the symlink branch, so on
        Windows (where install falls back to `copytree`) the copied skill
        directories are left behind. Anchors to
        `src/sumo_qa/install/uninstall.py:uninstall_skills` and delivers NOT
        SAFE TO MERGE or NEEDS WORK.
      anti_patterns:
        - Declares SAFE because the uninstall test passes, missing the Windows copytree-leftover case.
        - Treats symlink removal as covering the copied-directory fallback path.
        - Only names generic uninstall risks without anchoring to the platform-branch asymmetry.
        - Asking another confirmation question instead of delivering the verdict.
  - description: path-root-cwd-bypass — protected-path guard anchored to cwd not repo root (PR #100)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/hooks/block_generated_paths.py b/hooks/block_generated_paths.py
        @@ hooks/block_generated_paths.py:18-30 @@
         18 def is_protected(target: str) -> bool:
        -19     repo_root = _find_repo_root(Path(target))
        -20     protected = repo_root / "docs" / "generated"
        +19     protected = Path.cwd() / "docs" / "generated"
         21     try:
         22         return Path(target).resolve().is_relative_to(protected.resolve())
         23     except ValueError:
         24         return False
        ```
        Context: this hook blocks edits to generated files; it runs for every
        edit and the agent's cwd can be any subdirectory of the repo.

        ## Fresh test run
        ```text
        $ pytest tests/hooks/test_block_generated_paths.py -q
        tests/hooks/test_block_generated_paths.py::test_blocks_edit_under_docs_generated PASSED
        tests/hooks/test_block_generated_paths.py::test_allows_edit_to_source PASSED
        7 passed, 0 skipped in 0.40s
        ```
        (The tests run with cwd set to the repo root.)
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY flags the path-root/cwd bypass:
        the guard anchors the protected directory to `Path.cwd()` instead of
        the resolved repo root, so when cwd is a subdirectory the `protected`
        path is wrong and a generated file can be edited without being blocked.
        Anchors to `hooks/block_generated_paths.py:is_protected` and delivers
        NOT SAFE TO MERGE.
      anti_patterns:
        - Declares SAFE because the hook tests pass, missing the subdirectory cwd bypass.
        - Treats cwd-relative and repo-root-relative anchoring as equivalent.
        - Only names generic path-handling risks without anchoring to the cwd-vs-repo-root regression.
        - Asking another confirmation question instead of delivering the verdict.
  - description: contract-vs-signature — docstring "Never raises" envelope contract contradicted by required args (issue #294 / PR #285)
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/src/sumo_qa/skill_manifest.py b/src/sumo_qa/skill_manifest.py
        @@ src/sumo_qa/skill_manifest.py:286-305 @@
        +286 def load_skill_context(
        +287     skill_name: str,
        +288     mode: str,
        +289     section: str | None = None,
        +290     module: str | None = None,
        +291 ) -> dict[str, Any]:
        +292     """Load a slice of one skill's context.
        +293
        +300     Never raises: every invalid input returns an error envelope that
        +301     lists the valid choices."""
        +302     records = _skill_records()
        +303     if skill_name not in records:
        +304         return _error(f"Unknown skill_name {skill_name!r}.", ...)
        +305     ...
        ```
        Context: this diff ADDS `load_skill_context`, registered as an MCP tool.
        FastMCP derives the tool's input schema from the signature, so `skill_name`
        and `mode` are REQUIRED params with no default. The docstring at :300
        declares the contract "Never raises: every invalid input returns an error
        envelope". The body only reaches its `_error(...)` branches once it runs.

        ## Fresh test run
        ```text
        $ pytest tests/test_skill_manifest.py -q
        tests/test_skill_manifest.py::test_unknown_skill_returns_error_envelope PASSED
        tests/test_skill_manifest.py::test_full_mode_returns_body PASSED
        9 passed, 0 skipped in 0.61s
        ```
        (Every test calls `load_skill_context` WITH both args supplied; none
        omits a required arg or asserts the never-raises contract under a missing
        arg.)
      expected_shape: >-
        Evidence-led verdict that INDEPENDENTLY flags the declared-contract /
        signature contradiction: the docstring promises "Never raises — every
        invalid input returns an error envelope", but `skill_name` and `mode`
        are REQUIRED args with no default, so omitting one is invalid input
        rejected at the schema/signature layer (a raise) BEFORE the body's
        `_error` branches can run. Anchors to
        `src/sumo_qa/skill_manifest.py:286-301` (required params vs the docstring
        invariant), notes the fix is Optional args with explicit `None -> _error`
        branches (or dropping the never-raises claim), and delivers NOT SAFE TO
        MERGE or NEEDS WORK.
      anti_patterns:
        - Declares SAFE because the manifest tests are green, missing that the never-raises contract is unenforceable at a required-arg signature.
        - Treats the docstring "Never raises" claim as satisfied by the in-body `_error` branches, ignoring that a missing required arg raises before the body runs.
        - Only names generic typing/docstring risks without anchoring to the contract-vs-signature contradiction.
        - Asking another confirmation question instead of delivering the verdict.
  - description: NEGATIVE CONTROL docs-only typo — B must stay lightweight, no invented runtime risk
    vars:
      user_prompt: >-
        Is this safe to merge?
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/docs/INSTALL.md b/docs/INSTALL.md
        @@ docs/INSTALL.md:14 @@
        -Run the install commmand before restarting the host.
        +Run the install command before restarting the host.
        ```
        Context: a single typo fix in prose. No documented count, inventory,
        public-surface name, schema field, or command changed.

        ## Fresh test run
        ```text
        $ markdownlint docs/INSTALL.md && pytest -q
        docs/INSTALL.md: OK
        128 passed, 0 skipped in 11.0s
        ```
      expected_shape: >-
        Concise docs-only verdict. Recognises a prose typo fix with no runtime
        behaviour change, cites markdownlint OK plus 128 passed, 0 skipped, and
        delivers SAFE TO MERGE WITHOUT inventing auth, data, schema, rollback,
        CI, or other runtime risks.
      anti_patterns:
        - Invents runtime risk (auth, data loss, schema, CI, rollback, concurrency) for a one-word typo fix.
        - Declares NOT SAFE / NEEDS WORK for a pure prose typo with green build and lint.
        - Applies the full runtime risk-ledger walk to a trivial docs-only change.
        - Asking another confirmation question instead of delivering the verdict.
