name: testpypi-publish

# Pre-release test publish to TestPyPI (a non-production index) so a candidate
# build can be pip-installed and smoke-tested with the *exact* artifact shape
# users consume, before the production `release.yml` tag pipeline runs.
#
# SAFETY MODEL — why this can never leak publish credentials to fork PRs:
#   * Trigger is `workflow_dispatch` ONLY. There is deliberately no
#     `pull_request` / `pull_request_target` / `push` trigger, so untrusted
#     fork-PR code can never start this workflow, and the checked-out ref is
#     always one a maintainer (write access required to dispatch) selected.
#   * The publish job runs in the `testpypi` GitHub Environment, whose
#     deployment protection rules (required reviewers / allowed branches) the
#     maintainer configures in repo settings. No long-lived token is used at
#     all: publishing is via OIDC trusted publishing (`id-token: write`),
#     scoped to TestPyPI for this repo.
#   * The publish target is hard-pinned to `https://test.pypi.org/legacy/`.
#     It is impossible for this workflow to upload to production PyPI.
#
# CI trigger hygiene matches the repo convention (no `push: ["**"]`, no
# double-firing) — this one is intentionally manual-only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build and test-publish (defaults to the dispatch ref)."
        required: false
        type: string

# Minimum default token scope. The build job only checks out and builds; the
# publish job overrides below with the id-token write OIDC trusted publishing
# needs. Satisfies CodeQL's "workflow does not contain permissions" lint.
permissions:
  contents: read

concurrency:
  group: testpypi-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev-versioned wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.devversion.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty string falls back to the dispatch ref (checkout's default).
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Compute a unique dev version
        id: devversion
        env:
          # `github.run_number` is GitHub-computed (monotonic per workflow),
          # never attacker-supplied — safe to interpolate, and guarantees a
          # PEP 440 dev release segment unique enough to avoid TestPyPI
          # version-reuse collisions (TestPyPI permanently burns a filename
          # even after deletion). No PEP 440 local segment (`+...`) — those
          # are rejected on upload.
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          DEV="${BASE}.dev${RUN_NUMBER}"
          echo "Base version: ${BASE}  ->  dev version: ${DEV}"
          # Rewrite the static project version in place so the built artifact
          # carries the unique dev version. hatchling reads it from [project].
          python - "$DEV" <<'PY'
          import pathlib, re, sys
          dev = sys.argv[1]
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          new, n = re.subn(
              r'(?m)^(version\s*=\s*)"[^"]+"',
              lambda m: f'{m.group(1)}"{dev}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"expected exactly one version line, replaced {n}")
          p.write_text(new)
          PY
          echo "version=${DEV}" >> "$GITHUB_OUTPUT"

      - name: Install build backend
        run: python -m pip install build

      - name: Build
        run: python -m build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-dist
          path: dist/

  publish:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    # Deployment protection (required reviewers / allowed branches) is enforced
    # by this Environment — configured in repo settings, NOT in this file.
    environment:
      name: testpypi
      url: https://test.pypi.org/project/sumo-qa/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write  # OIDC trusted publishing — no stored token
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: testpypi-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

      - name: Summary — package, version, install command
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "## TestPyPI publish"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`sumo-qa\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Index | TestPyPI (https://test.pypi.org/) |"
            echo "| Project page | https://test.pypi.org/project/sumo-qa/${VERSION}/ |"
            echo ""
            echo "### Install the test artifact"
            echo ""
            echo '```bash'
            echo "pip install --index-url https://test.pypi.org/simple/ \\"
            echo "  --extra-index-url https://pypi.org/simple/ \\"
            echo "  sumo-qa==${VERSION}"
            echo '```'
            echo ""
            echo "The \`--extra-index-url\` lets dependencies (mcp, pydantic, PyYAML) resolve from production PyPI while sumo-qa itself comes from TestPyPI."
          } >> "$GITHUB_STEP_SUMMARY"
