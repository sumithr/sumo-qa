      expected_finding: '`install.sh` (and `install.ps1`) forward `--host` to the installer step but run
        the doctor as the bare `sumo-qa-doctor` console script with no host filter, so a host-scoped install
        is verified against every host (a missing `.vscode/mcp.json` fails a successful claude-code install)
        and the bare script is command-not-found when pip''s scripts dir is not on PATH even though the
        resolved interpreter just ran pip and the installer.'
      also_acceptable: 'The doctor step is a hard-required step: any diagnostic FAIL from the post-install
        `sumo-qa- doctor` makes `run_cmd` exit non-zero, so an advisory verification failure revokes an
        install that succeeded.'
      expected_shape: 'Evidence-led verdict that INDEPENDENTLY flags that the doctor step in `install.sh`
        is composed inconsistently with the primary steps: it is invoked as the bare `sumo-qa-doctor` console
        script instead of through the resolved interpreter (`$PYTHON -m sumo_qa.doctor`), and it does not
        receive the selected `--host` that the installer step receives, so host-scoped installs get unrelated-host
        failures. Anchors to `install.sh` (the `add_cmd sumo-qa-doctor` lines in the install/update/doctor
        cases). Notes the green run only asserts the doctor string appears in the print-plan output and
        never checks host forwarding or interpreter resolution for that step. Delivers NOT SAFE TO MERGE
        or NEEDS WORK. Ends without a confirmation question.'
