name: mutation

# Nightly mutation-testing guard — strict 100% kill-rate gate.
#
# Two independent failure conditions (both must pass):
#   1. Regression catch: fails if any module's killed count drops below the
#      committed baseline in mutmut-baseline.json.
#   2. Strict-100% gate: fails if any module has surviving (non-killed,
#      non-skipped) mutants, i.e. survived > 0.
#
# "Skipped" mutants (mutmut's own exclusions for unreachable code, etc.) do NOT
# count against the gate — they are tooling-level non-tests, not weak assertions.
# Survivals of exit_code == 0 are the only values that trigger a SURVIVED verdict.

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # nightly failures file a mutation-gate issue (see below)

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # mutmut on this codebase ran in ~60s locally; generous CI budget.
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,vertex]"

      - name: Run mutmut
        id: mutate
        # Don't fail the step on non-zero exit; mutmut exits non-zero when
        # survivors exist.  We do our own comparison in the next step.
        #
        # MUST invoke via the `mutmut` console-script wrapper (not `python -m
        # mutmut`). The wrapper's shim does `from mutmut.__main__ import cli`,
        # putting `mutmut.__main__` into sys.modules under that key. `python -m
        # mutmut` loads it as `__main__` only — and mutmut's injected trampoline
        # later does `from mutmut.__main__ import record_trampoline_hit`, which
        # then re-imports mutmut.__main__ as a *fresh* module and re-runs its
        # top-level `set_start_method('fork')` call against an already-set
        # multiprocessing context → RuntimeError → "failed to collect stats".
        continue-on-error: true
        run: |
          set +e
          mutmut run 2>&1 | tee mutmut.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Compare against baseline
        # The verdict logic lives in scripts/check_mutation_gate.py — shared
        # verbatim with the local pre-push hook so the two gates cannot drift.
        # It reads mutmut's .meta files directly because `mutmut run` exits 0
        # even when mutants survive (root-caused 2026-07-13; the exit-code
        # semantics and the export-cicd-stats rationale are documented in the
        # script's docstring). Tested by tests/test_check_mutation_gate.py.
        id: gate
        # continue-on-error so the follow-up steps (issue filing, artifact
        # upload) run; the final step re-raises the failure.
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/check_mutation_gate.py | tee gate.log

      - name: Upload mutmut log + meta files on failure
        if: steps.gate.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-debug
          path: |
            mutmut.log
            mutants/src/sumo_qa/*.py.meta
          if-no-files-found: warn
          retention-days: 14

      - name: Open issue on nightly failure
        # Schedule-only: workflow_dispatch runs (pre-merge branch checks from
        # the finish-pr flow, manual reruns) must not file issues. Deduped
        # against any open mutation-gate issue — the nightly cadence would
        # otherwise file one per red night (the June 2026 outage would have
        # produced 40).
        if: steps.gate.outcome == 'failure' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          OPEN_COUNT="$(gh issue list --label mutation-gate --state open --json number --jq 'length')"
          if [ "${OPEN_COUNT}" -gt 0 ]; then
            echo "An open mutation-gate issue already exists; not filing a duplicate."
            exit 0
          fi
          GATE_LOG="$(cat gate.log)"
          ISSUE_DATE="$(date -u +%Y-%m-%d)"
          gh issue create \
            --title "Nightly mutation gate failed (${ISSUE_DATE})" \
            --label mutation-gate \
            --body "The nightly mutation-testing gate failed.

          Run: ${RUN_URL}

          Gate output below. Triage: baseline DROPs usually mean the run
          itself broke (tooling/environment); SURVIVED rows are genuine
          weak-assertion debt — route through sumo-qa-strengthening-tests.

          \`\`\`
          ${GATE_LOG}
          \`\`\`"

      - name: Fail the job if the gate failed
        if: steps.gate.outcome == 'failure'
        run: exit 1
