# Pre-commit hooks for sumo-qa.
#
# Setup (one-time per clone) — works with whatever you used to install
# the dev dependencies:
#
#   # pip path:
#   python -m pip install -e ".[dev]"
#   pre-commit install --install-hooks
#   pre-commit install --hook-type pre-push
#
#   # or uv path (if you already use uv):
#   uv sync --all-extras
#   uv run pre-commit install --install-hooks
#   uv run pre-commit install --hook-type pre-push
#
# After that:
#   git commit  → ruff + format + hygiene on staged files (~1s)
#   git push    → full pytest suite (~2s after the first run; the first
#                 push will be slower because pre-commit installs the
#                 project deps into its own isolated venv).
#
# To run all hooks on demand:    pre-commit run --all-files
# To run pre-push hooks:         pre-commit run --all-files --hook-stage pre-push
# To bypass a single commit:     git commit --no-verify   (rare; CI catches anyway)
#
# The pytest hook uses `language: python` with explicit
# `additional_dependencies` (pre-commit's hook venvs can only install
# from PyPI, so the `.[dev]` shortcut doesn't work — versions are
# duplicated from `pyproject.toml.dependencies` and kept in sync by
# hand). This decouples the hook from whatever `python` happens to be
# on the user's PATH (pyenv / multiple Pythons / system vs venv).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Must match `ruff==0.16.0` in pyproject.toml's dev extras EXACTLY. This rev
    # is what runs at `git commit`; the pyproject pin is what runs in the `ruff
    # check + format` CI job. When the two disagree, a commit passes locally and
    # the required CI check fails on formatting alone (see the pin's comment in
    # pyproject.toml). Bump both in one commit, reformatting in the same change.
    rev: v0.16.1
    # Matching versions is not enough: a hook also has to see the same FILES its
    # CI counterpart does. Measured with `ruff check --show-files .` and
    # `ruff format --check .` on this tree:
    #
    #   ruff check .          253 .py + pyproject.toml and ruff.toml
    #   ruff format --check . 253 .py + 83 .md   (Python inside Markdown fences)
    #
    # Only ruff-format needs an override. The upstream python/pyi/jupyter list
    # misses Markdown, so a contributor commits a drifting fence, sees
    # "ruff format...(no files to check)Skipped", and turns the required CI job
    # red — verified by reverting a formatted fence and watching the hook skip a
    # file the CLI reformats.
    #
    # ruff-check keeps the upstream list for source files. `types_or: [...,
    # toml]` would be wrong: ruff special-cases the two config TOMLs by NAME, so
    # that tag hands the hook every tracked .toml (tests/fixtures/.../Cargo.toml)
    # which `ruff check --show-files .` does not list and CI never lints.
    #
    # The two config files still need their own pass, via the same aliased-hook
    # pattern as shellcheck below. Not for lint findings — ruff.toml selects
    # E/F/I/B/UP and every TOML rule is in the RUF family — but because ruff
    # REJECTS an invalid config outright, independent of any rule. A typo'd
    # selector is valid TOML, so `check-toml` passes it, while CI dies with
    # "Unknown rule selector `NOT-A-RULE` in `select`". Verified by injecting
    # exactly that.
    #
    # Only the VERSION agreement above is enforced by a test
    # (tests/test_toolchain_pins.py), because the `ruff check + format` job
    # installs ruff from pyproject.toml and never opens this file, so it cannot
    # see a stale rev. The hook shapes below are deliberately not
    # asserted anywhere: `ruff check + format` runs the real commands over the
    # real tree, so weakening a hook here (`--exit-zero`, a narrowed `files:`,
    # `exclude_types`, `stages`) still fails the required job on the next push.
    # Treat what follows as the reasoning to preserve when editing, not as a
    # contract something will catch you breaking.
    hooks:
      - id: ruff-check
        args: [--fix]
      # types_or, not types: pre-commit ANDs every filter together, and the
      # upstream ruff-check hook sets types_or to python/pyi/jupyter. Leaving
      # that inherited and adding only `files:` intersects to the empty set, so
      # the hook reports "(no files to check)Skipped" and silently guards
      # nothing. Overriding types_or and narrowing with files gives exactly the
      # two config names, with no other tracked .toml.
      - id: ruff-check
        alias: ruff-check-config
        name: ruff check (ruff config files)
        types_or: [toml]
        # `.ruff.toml` is a name ruff reads; `.pyproject.toml` is not, so the
        # optional dot belongs only on the ruff alternative.
        files: ^(pyproject|ruff|\.ruff)\.toml$
      - id: ruff-format
        types_or: [python, pyi, jupyter, markdown]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # tests/fixtures/ and .claude/hooks/fixtures/ hold byte-for-byte
        # captures of external CLI output (qaskills.sh CLI; mutmut / promptfoo
        # runs). Stripping trailing whitespace or normalising trailing newlines
        # there would diverge our fixtures from reality and silently mask
        # parser / matcher bugs.
        exclude: ^(tests/fixtures|\.claude/hooks/fixtures)/
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures|\.claude/hooks/fixtures)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Worked-example transcripts are markdown, no JSON in there.
        exclude: ^tests/scenarios/worked-examples/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Static analysis for shell scripts. hooks/session-start is loaded
  # into every MCP host session via the SessionStart hook — a bash bug
  # there breaks every session for every user. Its JSON-escape path
  # (lines 21–29) is exactly the kind of quoting / word-splitting code
  # shellcheck catches subtle bugs in. shellcheck-py bundles the
  # shellcheck binary so contributors don't need a system install.
  # Hook auto-detects shell scripts by shebang, so hooks/session-start
  # (no `.sh` extension) is covered. If new shell scripts land in the
  # repo, this hook will pick them up automatically; the
  # .github/workflows/lint.yml mirror is a literal file list and would
  # need updating to match.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
      # The route-qa-runners prefilter is a cmd.exe/sh polyglot, so it has no
      # shebang for the auto-detection above to find and would otherwise go
      # unlinted. Checked explicitly as `sh`: its batch block sits inside a
      # quoted heredoc, which shellcheck treats as data, so only the POSIX
      # branch is analysed. Mirrored in .github/workflows/lint.yml.
      - id: shellcheck
        alias: shellcheck-polyglot-hooks
        name: shellcheck (cmd/sh polyglot hooks)
        args: [--shell=sh]
        types: [file]
        files: ^\.claude/hooks/route-qa-runners-prefilter\.cmd$

  - repo: local
    hooks:
      # Vulnerability scanning — local mirror of GitHub's Dependabot
      # alerts. Dependabot already scans the repo against the same
      # advisory databases (npm + PyPI) and opens alerts/PRs when CVEs
      # land; these hooks just surface the same findings BEFORE the push
      # so you don't bounce off the Dependabot queue post-merge.
      #
      # Each hook fires only when the relevant lockfile changes — ordinary
      # commits don't pay the network cost of an advisory lookup.
      #
      # If Dependabot's severity threshold or ignore list changes (Settings
      # → Code security → Dependabot), update the corresponding flag here
      # so local and remote stay in sync.
      - id: npm-audit
        name: npm audit (high+critical)
        # --audit-level=high matches Dependabot's default for npm; bump
        # if you change Dependabot's severity floor. npm audit reads
        # package-lock.json directly — no `npm ci` needed.
        entry: npm audit --audit-level=high
        language: system
        files: ^package-lock\.json$
        pass_filenames: false
        require_serial: true
        # Pre-commit only — `git push` already runs the slow pytest hook;
        # re-running an advisory lookup at push time is pure latency, and
        # `uv run` invoked under pre-push can touch uv.lock and trip
        # pre-commit's "files were modified" check.
        stages: [pre-commit]

      - id: pip-audit
        name: pip-audit (PyPI advisory DB)
        # Uses the project's uv-managed env so the audit sees the same resolved
        # tree Dependabot does. `uv run --extra dev --extra vertex` installs the
        # same optional extras the CI mirror's `pip install -e ".[dev,vertex]"`
        # does, so security floors that live in those extras (e.g. the bleach
        # and tornado dev floors) are actually audited; without the flags
        # `uv run` audits only the base runtime env and silently skips the
        # extras. `--with pip-audit` lazily adds pip-audit to a uv-cached env
        # (no permanent dev-dep cost). The audit invocation, its flags, and the
        # suppression list (with per-advisory rationale) all live in
        # scripts/pip_audit.sh, shared verbatim with that CI mirror so local and
        # pipeline cannot drift. Add or drop an ignore there, never inline here.
        entry: uv run --extra dev --extra vertex --with pip-audit scripts/pip_audit.sh
        language: system
        files: ^(pyproject\.toml|uv\.lock|scripts/pip_audit\.sh)$
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: sumo-qa-validate
        name: sumo-qa-validate (knowledge/standards schemas)
        # Runs the strict-schema loaders (StandardsRulesEngine.from_file,
        # TestDataCatalogue) and the soft checks (standards-pack YAML
        # parseable, knowledge .md non-empty) against the repo. Fires only
        # when content files change so ordinary commits don't pay the cost.
        # `language: system` matches the pip-audit hook pattern — uses the
        # `sumo-qa-validate` console script from the user's `pip install -e .`
        # so the hook doesn't need its own isolated venv with the project
        # bootstrapped. Contributors must have run `pip install -e .` for
        # the script to be on PATH.
        entry: sumo-qa-validate
        language: system
        files: ^(knowledge/|standards/|src/sumo_qa/validate_content\.py$)
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: markdown-link-existence
        name: markdown link existence (pytest-check-links, file refs only)
        # Catches the dev_install.py-shaped class of bug: a markdown link
        # whose target file was removed but the link wasn't updated.
        # Fires only on changed .md files so ordinary code commits don't
        # pay the ~3s cost. Anchor checking is intentionally disabled
        # (upstream bug in pytest-check-links 0.10.1); follow up when
        # > 0.10.x ships. External URLs and GitHub-relative ../../commit/
        # paths are ignored inside scripts/check_markdown_links.sh.
        #
        # `language: system` matches the pip-audit / sumo-qa-validate
        # pattern — uses pytest from the user's `pip install -e ".[dev]"`
        # (or `uv sync --all-extras`) environment instead of pre-commit's
        # isolated venv. Contributors who skipped `[dev]` will see a clear
        # "pytest not found" error pointing them to the setup line at
        # the top of this file.
        entry: scripts/check_markdown_links.sh
        language: system
        files: \.md$
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]

      - id: no-em-dashes
        name: no em-dashes in user-facing docs
        # Standing rule: the em-dash (—) reads as an AI-slop tell in shipped
        # prose, so no user-facing doc carries one. Fails the commit if a
        # dash reaches README / DEMO / AGENTS / docs/*.md. Fenced code blocks
        # are exempt (literal example commands + sample tool output). Stdlib
        # only; `language: system` matches the markdown-link-existence pattern
        # and avoids pre-commit's isolated venv.
        entry: python scripts/check_no_em_dashes.py
        language: system
        files: ^(README|DEMO|AGENTS)\.md$|^docs/[^/]+\.md$
        pass_filenames: true
        stages: [pre-commit]

      - id: mutmut
        name: mutmut (pre-push, on changes to mutated modules or tests)
        # Runs the mutation gate locally before push. Fires only when one of the
        # mutated modules or any test file changes — mutation testing is
        # fast on the warm cache, so unrelated edits (docs / CI / installer /
        # server) skip it.
        #
        # The entry is scripts/check_mutation_gate.py (shared verbatim with
        # .github/workflows/mutation.yml), NOT bare `mutmut run`: `mutmut run`
        # exits 0 even when mutants survive, so the previous entry could never
        # fail on a survivor-introducing push (root-caused 2026-07-13 — that is
        # how PR #302's 47 survivors reached main). The script runs mutmut,
        # then computes the DROPPED/SURVIVED/MISSING verdict from the .meta
        # files, exactly like the nightly gate.
        #
        # Same `language: python` venv pattern as the pytest hook below — see
        # that block for the rationale around pinned deps and isolated venvs.
        # The target modules and pragma annotations live in
        # `[tool.mutmut]` in pyproject.toml.
        # --max-children 1: mutmut's default parallel-worker pool uses fork(),
        # which segfaults non-deterministically on macOS (every mutant exits -11
        # via SIGSEGV → all "suspicious" → strict-100% gate false-fails). Linux
        # CI runs multi-worker without issue; the local hook trades wall-clock
        # for portability across the team's MacBooks.
        entry: python scripts/check_mutation_gate.py --run-mutmut --max-children 1
        language: python
        additional_dependencies:
          - "hypothesis>=6,<7"
          - "mcp>=1.12,<2"
          # <3.6 mirrors the pyproject dev pin: mutmut 3.6.0's
          # record_trampoline_hit resolves relative source_paths against the
          # live cwd with strict=True, so chdir-ing tests crash the
          # stats-collection run ("failed to collect stats"). See the pin
          # comment in pyproject.toml [project.optional-dependencies] dev.
          - "mutmut>=3,<3.6"
          - "pydantic>=2.8,<3"
          - "PyYAML>=6,<7"
          - "pytest>=8.4,<10"
          - "pytest-cov>=6,<7"
          # tomllib stdlib backport for Python 3.10 (used by
          # plugin_packaging.canonical + tests/test_plugin_metadata.py).
          # 3.11+ ignores this via the marker.
          - "tomli>=2,<3; python_version < '3.11'"
          - "tzdata; platform_system == 'Windows'"
        pass_filenames: false
        files: ^(src/sumo_qa/(knowledge_loaders|rules|standards|tdm_validation|coverage_models|report_builder)\.py|tests/.*\.py)$
        stages: [pre-push]

      - id: pytest
        name: pytest (pre-push)
        # Runs on `git push`, not on every commit (too slow for single-file
        # iteration).
        #
        # `language: python` makes pre-commit create and own the venv for
        # this hook — decoupling it from whatever `python` happens to be
        # first on the user's PATH (pyenv, multiple Pythons, system vs
        # venv ambiguity).
        #
        # `additional_dependencies` lists the runtime deps explicitly
        # because pre-commit's hook venvs can only install from PyPI;
        # the `.[dev]` editable-install trick doesn't work here. Keep
        # this list in sync with the `dependencies` block in
        # pyproject.toml when bumping versions.
        #
        # pytest picks up `pythonpath = ["src"]` from pyproject.toml's
        # `[tool.pytest.ini_options]`, so `import sumo_qa.*` resolves
        # without the project itself needing to be pip-installed.
        entry: pytest -q
        language: python
        additional_dependencies:
          - "hypothesis>=6,<7"
          - "mcp>=1.12,<2"
          - "pydantic>=2.8,<3"
          - "PyYAML>=6,<7"
          - "pytest>=8.4,<10"
          - "pytest-cov>=6,<7"
          # Build backend — tests/test_wheel_packaging.py builds the wheel via
          # `pip wheel --no-build-isolation` to assert it ships py.typed.
          - "hatchling>=1.25"
          # tomllib stdlib backport for Python 3.10 (used by
          # plugin_packaging.canonical + tests/test_plugin_metadata.py).
          # 3.11+ ignores this via the marker.
          - "tomli>=2,<3; python_version < '3.11'"
          # The [treesitter] optional extra (kept in sync with the `treesitter`
          # extra in pyproject.toml). The pre-push suite must install it so the
          # repo_map_treesitter binding-contract test runs instead of skipping;
          # otherwise repo_map_treesitter.py never reaches full coverage and the
          # 100% gate fails locally. Mirrors the CI pytest matrix, which installs
          # the extra. Prebuilt Linux/macOS/Windows wheels, no compiler needed.
          # Floored at 1.12.5 like pyproject (#491): the adapter targets the
          # upstream binding that release introduced, and bumping the dep string
          # also re-keys pre-commit's cached hook venv past any 1.12.2 install.
          - "tree-sitter>=0.25,<0.26"
          - "tree-sitter-language-pack>=1.12.5,<2"
          # Conditional via PEP 508 marker: only installed on Windows hooks.
          # Needed by Hypothesis's `st.timezones()` strategy in
          # tests/test_hypothesis_tdm_validation.py — Windows ships no
          # system tz database, so stdlib `zoneinfo` falls through to `tzdata`.
          - "tzdata; platform_system == 'Windows'"
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    # Plugin-packaging drift mirror — runs the same check as the
    # plugin-packaging.yml CI gate so contributors see drift locally
    # before pushing. Triggered only when files in the canonical-source
    # chain change (pyproject overlay, plugin_packaging/, .claude-plugin/,
    # .codex-plugin/, .mcp.json, hooks/*.json).
    hooks:
      - id: plugin-packaging-drift
        name: plugin packaging drift check
        entry: python -m plugin_packaging.plugin_generator check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|plugin_packaging/|\.claude-plugin/|\.codex-plugin/|\.mcp\.json|hooks/.*\.json)$
        require_serial: true
