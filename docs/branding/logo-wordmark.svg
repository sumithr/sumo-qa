<svg viewBox="0 0 480 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumo-qa wordmark logo">
  <title>sumo-qa — heavy wordmark with collision</title>
  <!-- Heavy black SUMO with a red QA crashing into it; mawashi bar underneath -->
  <g font-family="Anton, 'Impact', 'Arial Black', sans-serif" font-weight="900">
    <!-- SUMO (black ink) -->
    <text x="20" y="138" font-size="136" letter-spacing="-2" fill="#0a0a0a">SUMO</text>
    <!-- QA in red, deliberately overlapping the trailing O of SUMO -->
    <text x="335" y="138" font-size="136" letter-spacing="-2" fill="#dc2626">QA</text>
  </g>
  <!-- Mawashi underline: solid red bar with a hard black notch (the QA-belt knot) -->
  <rect x="20" y="156" width="350" height="10" fill="#dc2626"/>
  <rect x="222" y="152" width="14" height="18" fill="#0a0a0a"/>
  <!-- Subtle baseline tick — programmer-monospace anchor at far right -->
  <g font-family="'JetBrains Mono', 'SF Mono', 'Menlo', monospace" font-size="11" fill="#0a0a0a" letter-spacing="0.5">
    <text x="460" y="186" text-anchor="end">v0.1.2 · apache-2.0</text>
  </g>
</svg>
