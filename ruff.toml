line-length = 100
target-version = "py310"
# mutants/ is auto-generated by mutmut during mutation runs; exclude it from all checks.
exclude = ["mutants/"]

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line-length handled by formatter

[lint.per-file-ignores]
# Tests intentionally interleave imports with setup writes (yaml fixtures
# materialised before importing the loader under test).
"tests/test_knowledge_loaders.py" = ["E402"]
# installer.py keeps a defensive version check before any 3.10-only syntax,
# in case someone runs the module file directly with an older Python.
# (pip's requires-python normally enforces 3.10+ at install time.)
"src/sumo_qa/installer.py" = ["UP036"]

[format]
quote-style = "double"
