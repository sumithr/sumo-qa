        \n```\n\n## Fresh test run\n```text\n$ pytest tests/test_repo_map_treesitter.py -q\ntests/test_repo_map_treesitter.py::test_parse_accepts_bytes_and_returns_module_root\
        \ PASSED\ntests/test_repo_map_treesitter.py::test_node_accessors_are_property_style PASSED\ntests/test_repo_map_treesitter.py::test_text_recovered_by_byte_slice\
        \ PASSED\ntests/test_repo_map_treesitter.py::test_text_aligned_after_invalid_utf8_byte PASSED\n\
        9 passed in 0.14s\n```\n"
      expected_finding: '`pyproject.toml` floors the `treesitter` extra at `tree-sitter-language-pack>=1.12.5`
        (the adapter now targets the upstream binding and is incompatible with older releases), but `.pre-commit-config.yaml`''s
        pre-push pytest hook keeps its own mirrored copy at `>=1.8,<2`, so a cached hook environment holding
        a pre-1.12.5 language-pack runs the suite against the old binding and fails the push.'
      expected_shape: Evidence-led verdict that INDEPENDENTLY flags that the dependency constraint changed
        in `pyproject.toml` while the mirrored constraint in `.pre-commit-config.yaml` (the pre-push hook's
        `additional_dependencies`, which says it is kept in sync with the pyproject extra) still allows
        `>=1.8`. Anchors to `pyproject.toml` and `.pre-commit-config.yaml:265`. Notes the green host-environment
        pytest run resolves the new pyproject constraint and never exercises the hook's isolated environment.
        Delivers NOT SAFE TO MERGE or NEEDS WORK. Ends without a confirmation question.
