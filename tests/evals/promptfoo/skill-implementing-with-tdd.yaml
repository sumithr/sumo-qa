description: >
  Skill-isolation eval for sumo-qa-implementing-with-tdd. ONE seed test defines
  the shape; promptfoo's `generate dataset` synthesises variations.
providers:
  - id: openai:chat:gpt-4o-mini
    label: candidate-gpt-4o-mini
    config:
      temperature: 0.0
      seed: 42
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-implementing-with-tdd/SKILL.md
    loaded_techniques: file://../../../knowledge/techniques.md
    expected_shape: >-
      Concrete TDD red-phase artefact. Names (a) the target test file path, (b)
      the function under test, (c) concrete input, (d) the assertion that
      distinguishes broken from fixed, (e) one test-design technique from the
      loaded techniques catalogue applied to this risk. Writes the failing test
      code inline (not "would write"). Refuses to write the production fix in
      the same turn. Ends with EXACTLY ONE of the SKILL's two pinned handoff
      phrasings — both are valid per skills/sumo-qa-implementing-with-tdd/SKILL.md
      step 7: phrasing (a) "red phase confirmed. Implement to make it green;
      I'll re-run when ready. If you'd like me to write the production code,
      say so." (used ONLY when actual red assertion output is shown in
      ground_truth_context), OR phrasing (b) "I'll run this and surface the
      assertion failure next." (used when no real red output is supplied —
      which is the case for every scenario in this eval, since no Bash tool
      is available). NO confirmation question, NO closing pleasantry, NO
      "shall I". Either phrasing PASSES the handoff check; only deviation
      from both is a failure.
    anti_patterns:
      - >-
        Writes the production fix in the same turn (Iron Law: red phase is
        test-only).
      - >-
        Tautology assertion that re-states the broken production code (e.g.
        asserting the buggy formula equals itself).
      - >-
        Asks 4+ clarification questions instead of grounding in the supplied
        context.
      - >-
        Stub allowance violation: any *behaviour* in a production stub instead
        of signature-only `pass` / `raise NotImplementedError`.
      - >-
        Hedging language — 'would write...', 'likely named...', 'probably
        check...' — instead of producing the concrete test code.
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL — apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
    - type: javascript
      value: 'output.match(/boundary value analysis|equivalence partitioning|decision table|state transition|pairwise|exploratory/i) !== null'
      threshold: 1
  options:
    disableVarExpansion: true
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0.0
        seed: 42
        response_format:
          type: json_object
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response

      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE — does the response demonstrate the expected shape concretely?
         (Concrete = produces the artefact: test code, assertion, file path,
         specific function name. Ends with exactly one of the two pinned
         handoff phrasings; either is valid. Hedging = SHAPE FAIL.)

      B. GROUNDING — does the response use the provided ground-truth context?
         The response must visibly reference it. Narrating without using the
         supplied context → GROUNDING FAIL.
         B GROUNDING: the named test-design technique must appear verbatim in {{loaded_techniques}}.

      C. ANTI-PATTERNS — for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then
      verdict>"}
prompts:
  - |
    You are a senior QA agent in an IDE chat session. You have loaded this
    sumo-qa skill and MUST follow its discipline exactly as written:

    --- BEGIN SKILL ---
    {{skill_content}}
    --- END SKILL ---

    You have also loaded the test-design technique catalogue (the source of
    truth for valid technique names; verbatim wording is mandatory per the
    skill's step 3):

    --- LOADED TECHNIQUES ---
    {{loaded_techniques}}
    --- END LOADED TECHNIQUES ---

    Repository state and prior conversation context for this turn:

    --- GROUND-TRUTH CONTEXT ---
    {{ground_truth_context}}
    --- END GROUND-TRUTH CONTEXT ---

    The developer just said:

    > {{user_prompt}}

    This is a post-confirmation red-phase turn. Execute step 3 of the skill's
    checklist (which names ALL FIVE required artefacts: target test file path,
    function under test, concrete input, distinguishing assertion, named
    test-design technique with verbatim catalogue wording), then write the
    COMPLETE failing test FUNCTION inline as a fenced code block (e.g.
    ```python
    def test_xxx():
        ...
        assert ...
    ```
    — not just the assertion line, the full test function with setup,
    invocation, and assertion). Skip writing production code. End with
    EXACTLY one of the skill's two pinned handoff phrasings (no question, no
    pleasantry) — phrasing (a) only when real red output is in the
    ground-truth context, otherwise phrasing (b).
tests:
  - description: SEED — regression-first bug fix (VIP double-discount)
    vars:
      user_prompt: >-
        Fix the VIP-customer double-discount bug regression-first. The discount
        stacks twice when a VIP gets a promo code applied. Logic is in
        `pricing/discount_calculator.py`.
      ground_truth_context: |
        ## pricing/discount_calculator.py (production — buggy)
        ```python
        def apply_discounts(order):
            total = order.total
            if order.customer.tier == "VIP":
                total = total * 0.9   # 10% VIP discount
            if order.promo_code:
                total = total * 0.9   # 10% promo discount
            # BUG: a VIP with a promo code gets BOTH discounts (effectively 19%)
            # The intended behaviour is that VIP + promo should cap at 15% combined.
            return total
        ```

        ## tests/pricing/test_discount_calculator.py (existing tests)
        ```python
        import pytest
        from pricing.discount_calculator import apply_discounts
        from tests.fixtures.order import make_order

        def test_vip_alone():
            order = make_order(total=100, tier="VIP")
            assert apply_discounts(order) == 90.0

        def test_promo_alone():
            order = make_order(total=100, promo_code="BLACKFRIDAY10")
            assert apply_discounts(order) == 90.0

        # No test for VIP + promo combination — this is the coverage gap.
        ```
  - vars:
      ground_truth_context: >
        ## pyproject.toml

        ```toml

        [tool.pytest.ini_options]

        pythonpath = ["."]

        testpaths = ["tests"]

        ```


        ## ecommerce/shipping.py (production — buggy)

        ```python

        FREE_SHIPPING_THRESHOLD = 50.0

        STANDARD_SHIPPING = 7.99



        def shipping_cost(cart):
            subtotal = sum(item.price * item.quantity for item in cart.items)
            if subtotal >= FREE_SHIPPING_THRESHOLD:
                return 0.0
            return STANDARD_SHIPPING
        ```


        ## tests/ecommerce/test_shipping.py (existing tests)

        ```python

        from dataclasses import dataclass


        from ecommerce.shipping import shipping_cost



        @dataclass

        class Item:
            price: float
            quantity: int = 1


        @dataclass

        class Cart:
            items: list[Item]
            discount_total: float = 0.0


        def make_cart(*prices, discount_total=0.0):
            return Cart(items=[Item(price=p) for p in prices], discount_total=discount_total)


        def test_free_shipping_when_subtotal_meets_threshold():
            cart = make_cart(25.0, 25.0)
            assert shipping_cost(cart) == 0.0


        def test_standard_shipping_when_subtotal_below_threshold():
            cart = make_cart(20.0, 10.0)
            assert shipping_cost(cart) == 7.99

        # No coverage for coupons/discount_total affecting the free-shipping
        threshold.

        ```
      user_prompt: >-
        Fix the free-shipping threshold bug regression-first. We’re waiving
        shipping based on the pre-discount subtotal; with coupons it should be
        based on the post-discount merchandise total. Logic is in
        `ecommerce/shipping.py`.
  - vars:
      ground_truth_context: >
        ## package.json

        ```json

        {
          "type": "module",
          "scripts": {
            "test": "jest"
          },
          "devDependencies": {
            "jest": "^29.7.0"
          }
        }

        ```


        ## src/cache/memoizeAsync.js (production — buggy)

        ```js

        export function memoizeAsync(fn) {
          const cache = new Map();

          return async function memoized(key) {
            if (!cache.has(key)) {
              cache.set(key, fn(key));
            }
            return cache.get(key);
          };
        }

        ```


        ## test/cache/memoizeAsync.test.js (existing tests)

        ```js

        import { memoizeAsync } from '../../src/cache/memoizeAsync.js';


        test('caches a successful async result by key', async () => {
          const fn = jest.fn(async (key) => `value:${key}`);
          const memoized = memoizeAsync(fn);

          await expect(memoized('a')).resolves.toBe('value:a');
          await expect(memoized('a')).resolves.toBe('value:a');

          expect(fn).toHaveBeenCalledTimes(1);
        });


        test('keeps separate cache entries per key', async () => {
          const fn = jest.fn(async (key) => `value:${key}`);
          const memoized = memoizeAsync(fn);

          await memoized('a');
          await memoized('b');

          expect(fn).toHaveBeenCalledTimes(2);
        });


        // No test covers rejected promises. Current implementation caches the
        rejection forever.

        ```
      user_prompt: >-
        Please fix the async memoizer rejection-caching bug regression-first. If
        the wrapped function rejects, that failure must not poison the cache; a
        later call for the same key should retry. File is
        `src/cache/memoizeAsync.js`.
  - vars:
      ground_truth_context: "## go.mod\n```go\nmodule github.com/acme/payments\n\ngo 1.22\n```\n\n## client/client.go (production — missing feature)\n```go\npackage client\n\nimport (\n\t\"context\"\n\t\"encoding/json\"\n\t\"fmt\"\n\t\"io\"\n\t\"net/http\"\n\t\"time\"\n)\n\ntype Client struct {\n\tBaseURL    string\n\tHTTPClient *http.Client\n\tMaxRetries int\n\tSleeper    func(time.Duration)\n}\n\ntype Invoice struct {\n\tID     string `json:\"id\"`\n\tAmount int    `json:\"amount\"`\n}\n\nfunc (c *Client) httpClient() *http.Client {\n\tif c.HTTPClient != nil {\n\t\treturn c.HTTPClient\n\t}\n\treturn http.DefaultClient\n}\n\nfunc (c *Client) sleep(d time.Duration) {\n\tif c.Sleeper != nil {\n\t\tc.Sleeper(d)\n\t\treturn\n\t}\n\ttime.Sleep(d)\n}\n\nfunc (c *Client) GetInvoice(ctx context.Context, id string) (*Invoice, error) {\n\turl := fmt.Sprintf(\"%s/invoices/%s\", c.BaseURL, id)\n\n\tfor attempt := 0; attempt <= c.MaxRetries; attempt++ {\n\t\treq, err := http.NewRequestWithContext(ctx, http.MethodGet, url, nil)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\tresp, err := c.httpClient().Do(req)\n\t\tif err != nil {\n\t\t\treturn nil, err\n\t\t}\n\n\t\tif resp.StatusCode >= 500 && attempt < c.MaxRetries {\n\t\t\tio.Copy(io.Discard, resp.Body)\n\t\t\tresp.Body.Close()\n\t\t\tc.sleep(100 * time.Millisecond)\n\t\t\tcontinue\n\t\t}\n\n\t\tdefer resp.Body.Close()\n\t\tif resp.StatusCode != http.StatusOK {\n\t\t\treturn nil, fmt.Errorf(\"get invoice: status %d\", resp.StatusCode)\n\t\t}\n\n\t\tvar invoice Invoice\n\t\tif err := json.NewDecoder(resp.Body).Decode(&invoice); err != nil {\n\t\t\treturn nil, err\n\t\t}\n\t\treturn &invoice, nil\n\t}\n\n\treturn nil, fmt.Errorf(\"get invoice: retries exhausted\")\n}\n```\n\n## client/client_test.go (existing tests)\n```go\npackage client\n\nimport (\n\t\"context\"\n\t\"net/http\"\n\t\"net/http/httptest\"\n\t\"testing\"\n\t\"time\"\n)\n\nfunc TestGetInvoiceRetriesServerError(t *testing.T) {\n\tcalls := 0\n\tserver := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tcalls++\n\t\tif calls == 1 {\n\t\t\thttp.Error(w, \"boom\", http.StatusBadGateway)\n\t\t\treturn\n\t\t}\n\t\tw.Header().Set(\"Content-Type\", \"application/json\")\n\t\tw.WriteHeader(http.StatusOK)\n\t\tw.Write([]byte(`{\"id\":\"inv_123\",\"amount\":4200}`))\n\t}))\n\tdefer server.Close()\n\n\tvar slept []time.Duration\n\tc := &Client{BaseURL: server.URL, MaxRetries: 1, Sleeper: func(d time.Duration) { slept = append(slept, d) }}\n\n\tinvoice, err := c.GetInvoice(context.Background(), \"inv_123\")\n\tif err != nil {\n\t\tt.Fatalf(\"GetInvoice returned error: %v\", err)\n\t}\n\tif invoice.ID != \"inv_123\" || invoice.Amount != 4200 {\n\t\tt.Fatalf(\"unexpected invoice: %#v\", invoice)\n\t}\n\tif calls != 2 {\n\t\tt.Fatalf(\"expected 2 calls, got %d\", calls)\n\t}\n\tif len(slept) != 1 || slept[0] != 100*time.Millisecond {\n\t\tt.Fatalf(\"unexpected sleeps: %#v\", slept)\n\t}\n}\n\nfunc TestGetInvoiceDoesNotRetryBadRequest(t *testing.T) {\n\tcalls := 0\n\tserver := httptest.NewServer(http.HandlerFunc(func(w http.ResponseWriter, r *http.Request) {\n\t\tcalls++\n\t\thttp.Error(w, \"bad\", http.StatusBadRequest)\n\t}))\n\tdefer server.Close()\n\n\tc := &Client{BaseURL: server.URL, MaxRetries: 3, Sleeper: func(time.Duration) { t.Fatal(\"should not sleep\") }}\n\n\t_, err := c.GetInvoice(context.Background(), \"inv_bad\")\n\tif err == nil {\n\t\tt.Fatal(\"expected error\")\n\t}\n\tif calls != 1 {\n\t\tt.Fatalf(\"expected 1 call, got %d\", calls)\n\t}\n}\n\n// No coverage for HTTP 429 Retry-After handling.\n```\n"
      user_prompt: >-
        TDD support for rate-limit responses in the Go payments client: when
        `GET /invoices/{id}` gets `429` with a `Retry-After` header in seconds,
        sleep that long and retry before failing. Existing client is in
        `client/client.go`.
  - vars:
      ground_truth_context: |
        ## build.gradle.kts
        ```kotlin
        plugins {
            kotlin("jvm") version "1.9.24"
        }

        repositories {
            mavenCentral()
        }

        dependencies {
            testImplementation(kotlin("test"))
            testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
        }

        tasks.test {
            useJUnitPlatform()
        }
        ```

        ## src/main/kotlin/com/acme/billing/BillingCycle.kt (production — buggy)
        ```kotlin
        package com.acme.billing

        import java.time.LocalDate

        object BillingCycle {
            fun nextChargeDate(current: LocalDate, anchorDay: Int): LocalDate {
                val nextMonth = current.plusMonths(1)
                return LocalDate.of(nextMonth.year, nextMonth.month, anchorDay)
            }
        }
        ```

        ## src/test/kotlin/com/acme/billing/BillingCycleTest.kt (existing tests)
        ```kotlin
        package com.acme.billing

        import org.junit.jupiter.api.Assertions.assertEquals
        import org.junit.jupiter.api.Test
        import java.time.LocalDate

        class BillingCycleTest {
            @Test
            fun `moves middle of month subscriptions to same day next month`() {
                assertEquals(
                    LocalDate.of(2024, 6, 15),
                    BillingCycle.nextChargeDate(LocalDate.of(2024, 5, 15), 15),
                )
            }

            @Test
            fun `moves December subscriptions into January`() {
                assertEquals(
                    LocalDate.of(2025, 1, 10),
                    BillingCycle.nextChargeDate(LocalDate.of(2024, 12, 10), 10),
                )
            }

            // No test covers anchors such as 29, 30, or 31 landing in a shorter month.
        }
        ```
      user_prompt: >-
        Fix the end-of-month billing anchor crash regression-first. Customers
        anchored on the 31st blow up in February; `nextChargeDate` should clamp
        to the last valid day of shorter months. Kotlin file is
        `src/main/kotlin/com/acme/billing/BillingCycle.kt`.
