name: staging-publish

# Build the package and publish it as a GitHub Release in the PRIVATE staging
# repo (sumithr/sumo-qa-staging) so project collaborators can pip-install and
# smoke-test a pre-prod candidate with the *exact* artifact shape end-users
# consume — WITHOUT exposing a dev build on public PyPI. Access is limited to
# collaborators of the private staging repo.
#
# SAFETY MODEL — why this can never leak the cross-repo token to fork PRs:
#   * Trigger is `workflow_dispatch` ONLY. There is deliberately no
#     `pull_request` / `pull_request_target` / `push` trigger, so untrusted
#     fork-PR code can never start this workflow or reach the publish token, and
#     the checked-out ref is always one a maintainer (write access required to
#     dispatch) selected.
#   * The publish job runs in the `staging` GitHub Environment, whose deployment
#     protection rules (required reviewers / allowed branches) the maintainer
#     configures in repo settings.
#   * Cross-repo write uses a NARROW fine-grained PAT (`STAGING_PUBLISH_TOKEN`,
#     `contents: write` on sumo-qa-staging ONLY) — never the default
#     `GITHUB_TOKEN` (which cannot write another repo) and never a broad token.
#
# CI trigger hygiene matches the repo convention (no `push: ["**"]`, no
# double-firing) — this one is intentionally manual-only.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build and stage (defaults to the dispatch ref)."
        required: false
        type: string

# Minimum default token scope for the build job. The publish job does NOT use
# the default token at all — it uses the STAGING_PUBLISH_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: staging-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build dev-versioned wheel + sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.devversion.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Empty string falls back to the dispatch ref (checkout's default).
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Compute a unique dev version
        id: devversion
        env:
          # `github.run_number` is GitHub-computed (monotonic per workflow),
          # never attacker-supplied — safe to interpolate, and guarantees a
          # PEP 440 dev release segment unique per run so each staged build
          # gets its own release tag. No PEP 440 local segment (`+...`).
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BASE=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          DEV="${BASE}.dev${RUN_NUMBER}"
          echo "Base version: ${BASE}  ->  dev version: ${DEV}"
          # Rewrite the static project version in place so the built artifact
          # carries the unique dev version. hatchling reads it from [project].
          python - "$DEV" <<'PY'
          import pathlib, re, sys
          dev = sys.argv[1]
          p = pathlib.Path("pyproject.toml")
          text = p.read_text()
          new, n = re.subn(
              r'(?m)^(version\s*=\s*)"[^"]+"',
              lambda m: f'{m.group(1)}"{dev}"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"expected exactly one version line, replaced {n}")
          p.write_text(new)
          PY
          echo "version=${DEV}" >> "$GITHUB_OUTPUT"

      - name: Install build backend
        run: python -m pip install build

      - name: Build
        run: python -m build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: staging-dist
          path: dist/

  publish:
    name: Publish to private staging repo
    needs: build
    runs-on: ubuntu-latest
    # Deployment protection (required reviewers / allowed branches) is enforced
    # by this Environment — configured in repo settings, NOT in this file.
    environment:
      name: staging
    steps:
      - name: Download artefacts
        uses: actions/download-artifact@v4
        with:
          name: staging-dist
          path: dist/

      - name: Publish release to the private staging repo
        env:
          # Fine-grained PAT with contents:write on sumo-qa-staging ONLY.
          # The default GITHUB_TOKEN cannot write a different repo, so a scoped
          # secret is required — and it is only readable by this protected job.
          GH_TOKEN: ${{ secrets.STAGING_PUBLISH_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          STAGING_REPO: sumithr/sumo-qa-staging
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          gh release create "$TAG" dist/* \
            --repo "$STAGING_REPO" \
            --title "sumo-qa ${VERSION} (staging)" \
            --notes "Pre-prod build of sumo-qa ${VERSION}. Collaborator access only — install per docs/DEVELOPMENT.md."
          {
            echo "## Staging publish"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`sumo-qa\` |"
            echo "| Version | \`${VERSION}\` |"
            echo "| Staging repo | \`${STAGING_REPO}\` (private) |"
            echo "| Release tag | \`${TAG}\` |"
            echo ""
            echo "### Install the staged artifact (collaborators only)"
            echo ""
            echo '```bash'
            echo "gh release download ${TAG} --repo ${STAGING_REPO} --pattern '*.whl'"
            echo "pip install ./sumo_qa-${VERSION}-py3-none-any.whl"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
