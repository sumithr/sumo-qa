# Pre-commit hooks for sumo-qa.
#
# Setup (one-time per clone) — works with whatever you used to install
# the dev dependencies:
#
#   # pip path:
#   python -m pip install -e ".[dev]"
#   pre-commit install --install-hooks
#   pre-commit install --hook-type pre-push
#
#   # or uv path (if you already use uv):
#   uv sync --all-extras
#   uv run pre-commit install --install-hooks
#   uv run pre-commit install --hook-type pre-push
#
# After that:
#   git commit  → ruff + format + hygiene on staged files (~1s)
#   git push    → full pytest suite (~2s after the first run; the first
#                 push will be slower because pre-commit installs the
#                 project deps into its own isolated venv).
#
# To run all hooks on demand:    pre-commit run --all-files
# To run pre-push hooks:         pre-commit run --all-files --hook-stage pre-push
# To bypass a single commit:     git commit --no-verify   (rare; CI catches anyway)
#
# The pytest hook uses `language: python` with explicit
# `additional_dependencies` (pre-commit's hook venvs can only install
# from PyPI, so the `.[dev]` shortcut doesn't work — versions are
# duplicated from `pyproject.toml.dependencies` and kept in sync by
# hand). This decouples the hook from whatever `python` happens to be
# on the user's PATH (pyenv / multiple Pythons / system vs venv).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches `ruff>=0.5,<1` from pyproject.toml's dev extras. Update both
    # together when bumping ruff.
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # tests/fixtures/ and .claude/hooks/fixtures/ hold byte-for-byte
        # captures of external CLI output (qaskills.sh CLI; mutmut / promptfoo
        # runs). Stripping trailing whitespace or normalising trailing newlines
        # there would diverge our fixtures from reality and silently mask
        # parser / matcher bugs.
        exclude: ^(tests/fixtures|\.claude/hooks/fixtures)/
      - id: end-of-file-fixer
        exclude: ^(tests/fixtures|\.claude/hooks/fixtures)/
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Worked-example transcripts are markdown, no JSON in there.
        exclude: ^tests/scenarios/worked-examples/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]

  # Static analysis for shell scripts. hooks/session-start is loaded
  # into every MCP host session via the SessionStart hook — a bash bug
  # there breaks every session for every user. Its JSON-escape path
  # (lines 21–29) is exactly the kind of quoting / word-splitting code
  # shellcheck catches subtle bugs in. shellcheck-py bundles the
  # shellcheck binary so contributors don't need a system install.
  # Hook auto-detects shell scripts by shebang, so hooks/session-start
  # (no `.sh` extension) is covered. If new shell scripts land in the
  # repo, this hook will pick them up automatically; the
  # .github/workflows/lint.yml mirror is a literal file list and would
  # need updating to match.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Vulnerability scanning — local mirror of GitHub's Dependabot
      # alerts. Dependabot already scans the repo against the same
      # advisory databases (npm + PyPI) and opens alerts/PRs when CVEs
      # land; these hooks just surface the same findings BEFORE the push
      # so you don't bounce off the Dependabot queue post-merge.
      #
      # Each hook fires only when the relevant lockfile changes — ordinary
      # commits don't pay the network cost of an advisory lookup.
      #
      # If Dependabot's severity threshold or ignore list changes (Settings
      # → Code security → Dependabot), update the corresponding flag here
      # so local and remote stay in sync.
      - id: npm-audit
        name: npm audit (high+critical)
        # --audit-level=high matches Dependabot's default for npm; bump
        # if you change Dependabot's severity floor. npm audit reads
        # package-lock.json directly — no `npm ci` needed.
        entry: npm audit --audit-level=high
        language: system
        files: ^package-lock\.json$
        pass_filenames: false
        require_serial: true
        # Pre-commit only — `git push` already runs the slow pytest hook;
        # re-running an advisory lookup at push time is pure latency, and
        # `uv run` invoked under pre-push can touch uv.lock and trip
        # pre-commit's "files were modified" check.
        stages: [pre-commit]

      - id: pip-audit
        name: pip-audit (PyPI advisory DB)
        # Uses the project's uv-managed env so the audit sees the same
        # resolved tree Dependabot does. `uv run --with pip-audit` lazily
        # installs pip-audit into a uv-cached env — no permanent dev-dep
        # cost. pip-audit has no severity filter, so this fails on any
        # advisory; suppress false positives via `--ignore-vuln <GHSA-…>`.
        # PYSEC-2025-183 ignored: disputed by the PyJWT supplier (the
        # "vulnerability" is that the library lets callers pick a weak HMAC
        # key length — argued to be the application's responsibility). OSV
        # lists every version 0+ as affected with no `fixed` event, so the
        # advisory cannot be remediated by upgrading. Revisit if upstream
        # ships a strict-key-length enforcement mode and rates this resolved.
        # CVE-2025-71176 ignored: local tmpdir symlink priv-esc/DoS in pytest's
        # /tmp/pytest-of-{user} handling (CWE-379, CVSS 6.8), fixed in pytest
        # 9.0.3. NOT remediable here — pytest is a dev/test-only dep (never in
        # the published wheel) and the markdown-link gate's pytest-check-links
        # (latest 0.10.1, unmaintained) hard-caps pytest<9, so the fixed pytest
        # is unreachable. Exploitation needs a hostile local user racing the
        # test run on a shared host. Revisit if a pytest>=9-compatible
        # link-checker ships (then bump pytest to >=9.0.3 and drop this).
        entry: uv run --with pip-audit pip-audit --strict --ignore-vuln PYSEC-2025-183 --ignore-vuln CVE-2025-71176
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: sumo-qa-validate
        name: sumo-qa-validate (knowledge/standards schemas)
        # Runs the strict-schema loaders (StandardsRulesEngine.from_file,
        # TestDataCatalogue) and the soft checks (standards-pack YAML
        # parseable, knowledge .md non-empty) against the repo. Fires only
        # when content files change so ordinary commits don't pay the cost.
        # `language: system` matches the pip-audit hook pattern — uses the
        # `sumo-qa-validate` console script from the user's `pip install -e .`
        # so the hook doesn't need its own isolated venv with the project
        # bootstrapped. Contributors must have run `pip install -e .` for
        # the script to be on PATH.
        entry: sumo-qa-validate
        language: system
        files: ^(knowledge/|standards/|src/sumo_qa/validate_content\.py$)
        pass_filenames: false
        require_serial: true
        stages: [pre-commit]

      - id: markdown-link-existence
        name: markdown link existence (pytest-check-links, file refs only)
        # Catches the dev_install.py-shaped class of bug: a markdown link
        # whose target file was removed but the link wasn't updated.
        # Fires only on changed .md files so ordinary code commits don't
        # pay the ~3s cost. Anchor checking is intentionally disabled
        # (upstream bug in pytest-check-links 0.10.1); follow up when
        # > 0.10.x ships. External URLs and GitHub-relative ../../commit/
        # paths are ignored inside scripts/check_markdown_links.sh.
        #
        # `language: system` matches the pip-audit / sumo-qa-validate
        # pattern — uses pytest from the user's `pip install -e ".[dev]"`
        # (or `uv sync --all-extras`) environment instead of pre-commit's
        # isolated venv. Contributors who skipped `[dev]` will see a clear
        # "pytest not found" error pointing them to the setup line at
        # the top of this file.
        entry: scripts/check_markdown_links.sh
        language: system
        files: \.md$
        pass_filenames: true
        require_serial: true
        stages: [pre-commit]

      - id: mutmut
        name: mutmut (pre-push, on changes to mutated modules or tests)
        # Runs the mutation gate locally before push. Fires only when one of the
        # four mutated modules or any test file changes — mutation testing is
        # ~90s, so unrelated edits (docs / CI / installer / server) skip it.
        #
        # `mutmut run` exits non-zero on any surviving mutant, which fails the
        # hook. This catches the survivor-introducing PR locally before it
        # reaches the nightly CI gate (the 5/19 regression made it through
        # because nothing checked at push time).
        #
        # Same `language: python` venv pattern as the pytest hook below — see
        # that block for the rationale around pinned deps and isolated venvs.
        # The four target modules and pragma annotations live in
        # `[tool.mutmut]` in pyproject.toml.
        # --max-children 1: mutmut's default parallel-worker pool uses fork(),
        # which segfaults non-deterministically on macOS (every mutant exits -11
        # via SIGSEGV → all "suspicious" → strict-100% gate false-fails). Linux
        # CI runs multi-worker without issue; the local hook trades wall-clock
        # for portability across the team's MacBooks.
        entry: mutmut run --max-children 1
        language: python
        additional_dependencies:
          - "hypothesis>=6,<7"
          - "mcp>=1.12,<2"
          - "mutmut>=3,<4"
          - "pydantic>=2.8,<3"
          - "PyYAML>=6,<7"
          - "pytest>=8.4,<10"
          - "pytest-cov>=6,<7"
          # tomllib stdlib backport for Python 3.10 (used by
          # plugin_packaging.canonical + tests/test_plugin_metadata.py).
          # 3.11+ ignores this via the marker.
          - "tomli>=2,<3; python_version < '3.11'"
          - "tzdata; platform_system == 'Windows'"
        pass_filenames: false
        files: ^(src/sumo_qa/(knowledge_loaders|rules|standards|tdm_validation|coverage_models|report_builder)\.py|tests/.*\.py)$
        stages: [pre-push]

      - id: pytest
        name: pytest (pre-push)
        # Runs on `git push`, not on every commit (too slow for single-file
        # iteration).
        #
        # `language: python` makes pre-commit create and own the venv for
        # this hook — decoupling it from whatever `python` happens to be
        # first on the user's PATH (pyenv, multiple Pythons, system vs
        # venv ambiguity).
        #
        # `additional_dependencies` lists the runtime deps explicitly
        # because pre-commit's hook venvs can only install from PyPI;
        # the `.[dev]` editable-install trick doesn't work here. Keep
        # this list in sync with the `dependencies` block in
        # pyproject.toml when bumping versions.
        #
        # pytest picks up `pythonpath = ["src"]` from pyproject.toml's
        # `[tool.pytest.ini_options]`, so `import sumo_qa.*` resolves
        # without the project itself needing to be pip-installed.
        entry: pytest -q
        language: python
        additional_dependencies:
          - "hypothesis>=6,<7"
          - "mcp>=1.12,<2"
          - "pydantic>=2.8,<3"
          - "PyYAML>=6,<7"
          - "pytest>=8.4,<10"
          - "pytest-cov>=6,<7"
          # Build backend — tests/test_wheel_packaging.py builds the wheel via
          # `pip wheel --no-build-isolation` to assert it ships py.typed.
          - "hatchling>=1.25"
          # tomllib stdlib backport for Python 3.10 (used by
          # plugin_packaging.canonical + tests/test_plugin_metadata.py).
          # 3.11+ ignores this via the marker.
          - "tomli>=2,<3; python_version < '3.11'"
          # Conditional via PEP 508 marker: only installed on Windows hooks.
          # Needed by Hypothesis's `st.timezones()` strategy in
          # tests/test_hypothesis_tdm_validation.py — Windows ships no
          # system tz database, so stdlib `zoneinfo` falls through to `tzdata`.
          - "tzdata; platform_system == 'Windows'"
        pass_filenames: false
        stages: [pre-push]

  - repo: local
    # Plugin-packaging drift mirror — runs the same check as the
    # plugin-packaging.yml CI gate so contributors see drift locally
    # before pushing. Triggered only when files in the canonical-source
    # chain change (pyproject overlay, plugin_packaging/, .claude-plugin/,
    # .codex-plugin/, .mcp.json, hooks/*.json).
    hooks:
      - id: plugin-packaging-drift
        name: plugin packaging drift check
        entry: python -m plugin_packaging.plugin_generator check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|plugin_packaging/|\.claude-plugin/|\.codex-plugin/|\.mcp\.json|hooks/.*\.json)$
        require_serial: true
