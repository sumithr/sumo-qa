name: release-please

on:
  push:
    branches:
      - main

# Minimum-required token scope at workflow level. Individual jobs that
# need write scope (contents: write for the release commit; pull-requests:
# write for opening the release PR) declare it on the job. CodeQL's
# "workflow does not contain permissions" lint is satisfied by this
# top-level declaration.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT rather than the default GITHUB_TOKEN so that the
          # release PR triggers required status checks (pytest matrix,
          # ruff). GITHUB_TOKEN-created PRs don't fire pull_request
          # workflows on themselves, which leaves the PR permanently
          # blocked by branch protection.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # When release-please bumps [project].version in pyproject.toml,
      # four other committed files embed that version literal:
      #   .claude-plugin/plugin.json, .codex-plugin/plugin.json,
      #   src/sumo_qa/_data/plugin_metadata.json, and the SHA256 sidecar
      #   at plugin_packaging/generated/manifest.json.
      # Without regeneration the plugin-packaging drift check and the
      # snapshot-version test fail on the release PR and block auto-merge.
      #
      # We check out the release branch via actions/checkout (which sets
      # up git auth correctly for the later push), run the generator,
      # and push the regen as a follow-up commit on the same branch.
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v5
        with:
          ref: ${{ (steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName) || '' }}
          # PAT so the follow-up push triggers required status checks
          # on the release PR (same reasoning as the action's `token:`).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate plugin adapters for the bumped version
        if: ${{ steps.release.outputs.pr }}
        env:
          # Read action outputs via env to avoid inline ${{ }} expansion
          # in run: blocks (workflow-injection-safe pattern).
          HEAD_BRANCH: ${{ (steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName) || '' }}
        run: |
          set -euo pipefail
          python -m pip install --quiet -e ".[dev]"
          python -m plugin_packaging.plugin_generator sync
          if git diff --quiet; then
            echo "Generator output already matches the bumped version — nothing to commit."
            exit 0
          fi
          git config user.name  "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git add .claude-plugin .codex-plugin .mcp.json hooks/hooks.json \
                  hooks/hooks-codex.json docs/host-adapters.md \
                  src/sumo_qa/_data/plugin_metadata.json \
                  plugin_packaging/generated/manifest.json
          git commit -m "chore(packaging): regenerate plugin adapters for version bump"
          git push origin "HEAD:${HEAD_BRANCH}"

      # The release PR is merged automatically. RELEASE_PLEASE_TOKEN is the
      # repo owner's PAT, an always-bypass actor on the "Protect main"
      # ruleset — but a *plain* merge does NOT auto-bypass; GitHub still
      # blocks it on the unmet required-approval rule. `--admin` is what
      # invokes the bypass to merge past that rule with no human review.
      # --admin also bypasses the ruleset's required status checks, so it
      # would happily merge a red release — that's why we explicitly wait
      # for those checks to pass below before calling it.
      - name: Merge the release PR once required checks pass
        if: ${{ steps.release.outputs.pr }}
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Read action outputs via env to avoid inline ${{ }} expansion
          # in run: blocks (workflow-injection-safe pattern).
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR_JSON" | jq -r '.number')
          HEAD_SHA=$(git rev-parse HEAD)
          # The regen push above creates a fresh commit; GitHub needs a moment
          # to create its check runs. We can't gate on `gh pr checks` here: it
          # lists the required *contexts* as pending even when zero runs exist,
          # so calling `--watch` too early aborts with "no checks reported".
          # Poll the commit's actual check-runs instead, then watch.
          for attempt in $(seq 1 60); do
            COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" --jq '.total_count' 2>/dev/null || echo 0)
            [ "${COUNT}" -gt 0 ] && break
            [ "${attempt}" -eq 60 ] && { echo "no check runs appeared on ${HEAD_SHA}" >&2; exit 1; }
            sleep 10
          done
          # --required watches the full required set (read from the ruleset) to
          # completion and fails fast on the first unsuccessful check.
          gh pr checks "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
            --required --watch --fail-fast --interval 30
          gh pr merge --squash --admin --delete-branch \
            --repo "${GITHUB_REPOSITORY}" "${PR_NUMBER}"
