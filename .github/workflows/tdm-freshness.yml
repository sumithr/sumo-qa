name: tdm-freshness

on:
  schedule:
    # Weekly Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,vertex]"

      - name: Run TDM freshness check
        id: check
        continue-on-error: true
        run: |
          set -o pipefail
          python scripts/check_tdm_freshness.py | tee freshness.log

      - name: Open issue on failure
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          FRESHNESS_LOG="$(cat freshness.log)"
          ISSUE_DATE="$(date -u +%Y-%m-%d)"
          gh issue create \
            --title "TDM URL freshness check failed (${ISSUE_DATE})" \
            --label tdm-freshness \
            --body "The scheduled TDM URL freshness check found one or more known-good
          test-data entries pointing at URLs that returned non-2xx responses.

          Run: ${RUN_URL}

          See the full output below.

          \`\`\`
          ${FRESHNESS_LOG}
          \`\`\`"

      - name: Fail the job if URLs were stale
        if: steps.check.outcome == 'failure'
        run: exit 1
