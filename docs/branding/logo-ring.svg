<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumo-qa dohyo-ring logo">
  <title>sumo-qa — dohyo with impact mark</title>
  <!-- Off-centred red dohyo with hard depth shadow -->
  <circle cx="118" cy="118" r="92" fill="#0a0a0a"/>
  <circle cx="115" cy="115" r="92" fill="#dc2626"/>
  <!-- Inner ring engraving -->
  <circle cx="115" cy="115" r="76" fill="none" stroke="#0a0a0a" stroke-width="2" stroke-dasharray="3 4" opacity="0.45"/>
  <!-- Bold geometric "S" — built as two stacked semicircles with hard cuts, suggesting a wrestler's twist -->
  <g fill="#faf5ee">
    <path d="M 90 70
             C 75 70 65 80 65 95
             C 65 110 75 118 95 118
             L 135 118
             C 145 118 150 122 150 130
             C 150 138 142 142 130 142
             L 75 142
             L 75 162
             L 135 162
             C 160 162 175 152 175 132
             C 175 114 165 102 145 102
             L 105 102
             C 95 102 90 98 90 92
             C 90 86 96 82 108 82
             L 165 82
             L 165 62
             L 90 62
             L 90 70
             Z"
          opacity="0.0"/>
    <!-- A cleaner construction: pure path "S" with squared corners (brutalist) -->
    <path d="M 158 68
             L 80 68
             C 72 68 68 72 68 80
             L 68 104
             C 68 112 72 116 80 116
             L 140 116
             C 144 116 146 118 146 122
             L 146 130
             C 146 134 144 136 140 136
             L 64 136
             L 64 162
             L 144 162
             C 156 162 164 154 164 142
             L 164 118
             C 164 106 156 100 144 100
             L 86 100
             C 82 100 80 98 80 94
             L 80 90
             C 80 86 82 84 86 84
             L 158 84
             Z"/>
  </g>
  <!-- Wordmark below the ring -->
  <g font-family="Anton, 'Impact', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">
    <text x="120" y="232" font-size="22" letter-spacing="6" fill="#0a0a0a">SUMO·QA</text>
  </g>
</svg>
