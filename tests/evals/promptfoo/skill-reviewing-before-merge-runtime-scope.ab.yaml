tests:
  - description: SEED executable-hook-out-of-source — command-parsing hook under .claude/hooks/ (outside app/src/lib) must still get the full sweep + tests/hooks ledger (#300)
    vars:
      user_prompt: >-
        Is this safe to merge? There's nothing under app/, src/, or lib/ in this
        diff — it's just a hook file outside the source tree — so this is a
        trivial, non-runtime change. The suite is green. Just confirm it's safe.
      ground_truth_context: |
        ## git diff
        ```diff
        diff --git a/.claude/hooks/route-qa-runners.py b/.claude/hooks/route-qa-runners.py
        @@ .claude/hooks/route-qa-runners.py:20-34 @@
        +20 def is_test_command(command: str) -> bool:
        +21     """True when the command line runs the test suite, so we route
        +22     it to the QA runner. Triggers on a 'pytest' token anywhere."""
        +23     tokens = command.split()
        +24     return "pytest" in tokens
        ```
        Context: `.claude/hooks/route-qa-runners.py` is a PreToolUse hook — it
        runs on every Bash tool call, parses the command line, and decides
        whether to route it to the QA runner. It is executable automation with
        real branching, NOT library code, and it lives under `.claude/hooks/`,
        OUTSIDE `app/`, `src/`, or `lib/`. The match is a naive whitespace split
        + membership test: it fires on `echo "run pytest later"` (the word
        pytest is an argument token, not the program), and it MISSES `py.test -q`
        (the legacy entrypoint tokenises to `py.test`, not `pytest`) and
        `pytest:cov` framings where pytest isn't a bare whitespace token.

        ## Fresh test run
        ```text
        $ pytest tests/hooks/test_route_qa_runners.py -q
        tests/hooks/test_route_qa_runners.py::test_matches_bare_pytest PASSED
        9 passed, 0 skipped in 0.44s
        ```
        (The fixture only feeds the bare `pytest -q` happy case; no echo-token,
        no `py.test -q`, no quoted-argument command is exercised.)
      expected_shape: >-
        Evidence-led verdict that treats this executable hook as a RUNTIME change
        despite living under `.claude/hooks/` (outside app/src/lib) and despite
        the developer calling it "just a hook, not under src" — it runs the full
        discovery sweep and emits a coverage-ledger row with a `tests/hooks/`-style
        Required-test-path mirroring the `.claude/hooks/` anchor, marking the risk
        UNCOVERED/UNPROVEN, rather than waving it through as trivial-by-path or
        COVERED BY VERIFICATION. INDEPENDENTLY flags the command-parsing defect
        class: the naive `pytest` token-membership test mis-classifies commands —
        it false-positives on an echo/argument token (e.g. `echo "run pytest
        later"`) and false-negatives on the legacy `py.test -q` entrypoint /
        colon-suffixed `pytest:cov` framings. Anchors to
        `.claude/hooks/route-qa-runners.py:is_test_command`, notes the green test
        only feeds the bare-pytest happy case so it cannot catch the mis-parse,
        and rejects the "just a hook, not under src" framing as grounds for the
        trivial exemption. Delivers NOT SAFE TO MERGE or NEEDS WORK. Ends without
        a confirmation question.
      anti_patterns:
        - Treats the hook as a trivial / non-runtime change because it lives outside app/src/lib (under .claude/hooks/) and skips the discovery sweep or marks it COVERED BY VERIFICATION.
        - Accepts the developer's "just a hook, not under src" framing as a reason to apply the trivial-change exemption.
        - Emits no coverage-ledger row with a tests/hooks/-style Required-test-path mirroring the .claude/hooks/ anchor.
        - Declares SAFE because the hook test passes, missing the command-parsing mis-parse class (false-positive on an echo/argument `pytest` token; false-negative on the legacy `py.test` entrypoint or colon-suffixed `pytest:cov`).
        - Only names generic hook risks without anchoring to the naive token-split command match.
        - Asking another confirmation question instead of delivering the verdict.
