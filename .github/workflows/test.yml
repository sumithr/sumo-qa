name: tests

# Avoid double-runs on every push to a PR branch:
#   - `push: branches: [main]` — only main pushes trigger the push event
#     (covers merges + direct main commits).
#   - `pull_request: branches: [main]` — PR opens/updates trigger here
#     (covers all feature-branch development).
# Push to a feature branch with an open PR → only pull_request fires, once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required token scope. The test job only checks out the repo and
# runs pytest against it — no write actions. Satisfies CodeQL's "workflow
# does not contain permissions" lint.
permissions:
  contents: read

# Cancel in-progress runs when a new push lands on the same ref.
# Saves CI minutes during rapid iteration; the latest commit always gets the
# definitive run. Uses `github.ref` (GitHub-computed, not attacker-supplied)
# so per-PR concurrency buckets stay distinct without exposing branch-name
# injection risk in the grouping key.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Python on Linux; macOS and Windows on the oldest and
      # newest only (9 jobs, not 15). No test is gated on a Python version, so
      # each OS-specific test (the Windows-only cmd.exe branch, the POSIX-only
      # symlink/bash/permission tests) still runs on every OS it targets.
      # The ubuntu job names are the ruleset's required checks: keep the name
      # template and all five ubuntu versions.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The `treesitter` extra is installed on every job in the matrix so
        # the import-edge layer (#354) is exercised on Linux, macOS, and
        # Windows (its prebuilt wheels are validated on each here), and so
        # the 100% coverage gate sees the tree-sitter code paths. The graceful-
        # degradation path (extra absent) is covered deterministically in every
        # run by the monkeypatched tests in tests/test_repo_map_imports.py, so a
        # separate extra-free job isn't needed to prove it.
        run: python -m pip install -e ".[dev,vertex,treesitter]"

      # pytest-xdist spreads the suite over the runner's cores (`-n auto`).
      # The 100% coverage gate (addopts) runs on one job, ubuntu py3.14, where
      # coverage's sys.monitoring core costs almost nothing; the other jobs
      # pass --no-cov, which drops the ~35% the ctrace core adds on 3.10-3.13.
      - name: Run pytest with the 100% coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        run: python -m pytest -n auto

      - name: Run pytest
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.14'
        run: python -m pytest -n auto --no-cov
