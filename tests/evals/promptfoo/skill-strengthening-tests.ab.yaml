# Discrimination on the Claude pair (issue #688; candidate claude-haiku-4-5,
# judge claude-opus-5).
#
# The three original seeds (VIP promo boundary, youth discount boundary, identity
# multiplication equivalent) do NOT discriminate on this pair: the #679 run scored
# A0 3/3, A1 3/3, B 3/3. They cannot, by construction. Every decision the skill
# teaches for them is already in the A0 leg: the shared prompt states config-side
# suppression, no tautological test, production unchanged and no confirmation
# question. Each seed's context also pre-decides the rest. The two boundary seeds'
# "Prior turns recap" hands over the real verdict and the technique name, and their
# report excerpt names the missing boundary input. The identity-multiplication seed
# hands over the equivalence verdict and the config-side suppression surface
# (`mutation-testing.yml`, `ignoredMutants`). A0 is left with only the mechanics
# (pick the boundary value, get the assertion polarity, write the config entry),
# which the Claude candidate does unaided. They stay as regression guards for B,
# not as lift evidence.
#
# The production-defect seed is the discriminating case. It targets the skill's
# HARD-GATE, the one taught behaviour absent from both the shared prompt and the
# recaps: when a mutant survives because the production code is wrong (here the
# acceptance criterion quoted in the test file matches the MUTANT, not the
# original), stop the strengthening flow and hand the defect to a separate
# regression-first fix instead of writing a strengthening test that pins the bug.
# Its recap does not pre-decide the verdict.
#
# Measured 2026-09-14, this seed only, one pass per leg. Before the #688 skill fix
# all three legs FAILED: A0 and B pinned the bug (`toBe(false)` at 5000), A1
# delivered a red `toBe(true)` test. That was a skill gap (the HARD-GATE existed
# but triage had no way to detect it), fixed in the SKILL.md with a third triage
# outcome, not in this rubric. After the fix: A0 FAIL, A1 FAIL, B PASS (0.88).
#
# Review fix (#688): the shared prompt's answer space is now neutral and identical
# across A0, A1 and B. It used to say "decide whether the survivor is a real
# assertion gap or an equivalent mutant", offer only those two formats and forbid
# additional sections, so A0 and A1 could not stop on a production defect without
# disobeying the prompt while B's skill overrode it; that confounded the lift. The
# prompt now says "decide what the survivor needs" and allows a survivor that fits
# neither format to be answered in one short section saying why, closing with the
# same `Production code stays unchanged.` last line as the two formats, without
# naming the spec check. Every other constraint is unchanged. The production-defect seed
# also gains an anti-pattern for surfacing an internal control label (HARD-GATE).
#
# Neutral-prompt runs (this seed only, one pass per leg, 2026-09-14). The binary
# prompt results above are kept as history.
#   First review fix: A0 FAIL (0.15), A1 FAIL (0.10), B FAIL (0.55). B wrote no
#     test and routed away, but named only a skill and omitted "production stays
#     unchanged". Fixed by giving the neither-format line the shared last line and
#     spelling out the hand-off in step 3(c) (a failing test at the input where
#     spec and code disagree first, then the production fix).
#   Second review fix: A0 FAIL (0.00), A1 FAIL (0.05), B PASS (0.80). No output
#     surfaced HARD-GATE in either run.
#
# True-negative seed for the guard (review round 2). Step 3(c) only fires on a
# CURRENT spec, so the production-defect seed's context now carries a ticket
# status confirming SHIP-218 is current (it does not say the code is wrong), and
# `SEED - boundary survivor with an obsolete spec comment` tests the other
# direction: the same boundary and the same SHIP-218 comment ("£50.00 or more"),
# but the ticket status shows SHIP-218 superseded by SHIP-341 ("more than
# £50.00"). The right answer is an ordinary strengthening test expecting `false`
# at 5000 pence, with no production-defect hand-off. A0 and A1 may pass it (the
# ordinary answer is what they already give); it gates B against over-firing.
# Run 2026-09-14, both seeds, one pass per leg, neutral prompt:
#   production defect (with ticket status): A0 FAIL (0.10), A1 FAIL (0.05),
#     B PASS (0.88)
#   obsolete spec comment: A0 PASS (0.85), A1 PASS (0.90), B PASS (0.88)
#   No output surfaced HARD-GATE.
disableVarExpansion: true
description: 'A/B/C value-measurement for sumo-qa-strengthening-tests'
providers:
  - file://{{ env.SUMO_EVAL_CANDIDATES_FILE | default('providers/claude-candidate.yaml') }}
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-strengthening-tests/SKILL.md
    loaded_techniques: file://../../../knowledge/techniques.md
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider: file://{{ env.SUMO_EVAL_JUDGE_FILE | default('providers/claude-judge.yaml') }}
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response
      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      The candidate has loaded the techniques catalogue below for your
      verification:


      --- LOADED TECHNIQUES ---

      {{loaded_techniques}}

      --- END LOADED TECHNIQUES ---


      The per-test mutant context supplied to the candidate was:


      --- SURVIVING MUTANT DESCRIPTION ---

      {{surviving_mutant_description}}

      --- END SURVIVING MUTANT DESCRIPTION ---


      --- CURRENT TEST CODE ---

      {{current_test_code}}

      --- END CURRENT TEST CODE ---


      --- SURROUNDING PRODUCTION CODE ---

      {{surrounding_production_code}}

      --- END SURROUNDING PRODUCTION CODE ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response demonstrate the expected shape concretely?
         Real mutants should produce a strengthening test artefact anchored to
         the discriminating input. Equivalent mutants should be suppressed in
         the supplied tool config with a rationale, and should not produce test
         code. A mutant that survives because the original production code is
         wrong (the supplied specification matches the mutant, not the original)
         should stop the strengthening flow: no strengthening test for it, and
         the defect handed to a separate regression-first fix.

      B. GROUNDING - the response must visibly use the supplied mutant
         description, current test code, and surrounding production code. For a
         real boundary mutant, the proposed test must pin the exact boundary
         value that distinguishes the original from the mutant. For an
         equivalent mutant, the response must explain why no observable test can
         distinguish the original from the mutant and must use the supplied
         config-side suppression surface. For a production-defect survivor, the
         response must cite the supplied specification and the exact input
         where the original code and the specification disagree. Named
         techniques for real mutants must appear in the loaded techniques
         catalogue.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
