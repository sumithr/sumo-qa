disableVarExpansion: true
description: >
  Issue #300 — A0/A1 control for the BEHAVIOUR-NOT-PATH runtime-scope discipline.
  Proves the new behaviour is LOAD-BEARING: the SAME executable-hook seed
  (`.claude/hooks/route-qa-runners.py`, a command-parsing PreToolUse hook
  OUTSIDE app/src/lib) runs against the PRE-EDIT (origin/main) SKILL.md body
  (A0) and the post-#300 body (A1). The pre-#300 body keys the runtime-change
  gate (Verdict-format discipline) on an `app/`/`src/`/`lib/` PATH PREFIX and
  scopes the trivial-change exemption to a diff with "no app/src/lib file
  present" — so when the candidate applies the loaded body verbatim (both prompts
  instruct it to classify strictly by the skill's stated trigger, not by its own
  intuition about hooks), a hook under `.claude/hooks/` reads as path-trivial: A0
  classifies it non-runtime/tooling, uses N/A or COVERED BY VERIFICATION instead
  of a mirrored `tests/hooks/` coverage-ledger row, and does not reject the
  "outside src = trivial" framing — a SHAPE FAIL under the rubric. A1 (the
  post-#300 body) keys the trigger on EXECUTABLE BEHAVIOUR not path prefix: the
  hook gets the full discovery sweep + coverage ledger with a tests/hooks/-style
  Required-test-path and the "just a hook, not under src" framing is rejected —
  it flags the command-parsing defect and reaches NOT SAFE, a PASS. The
  A0(FAIL) -> A1(PASS) lift is deterministic over 3 runs and is the proof that
  #300 isolates NEW behaviour, not pre-existing handling. (An earlier weaker seed
  framing let A0 PASS — the path-keyed body still ran the step-4 sweep on its own
  instinct; the seed was hardened to lean on "nothing under app/src/lib =
  trivial" and to make BOTH prompts classify strictly by the loaded body's stated
  trigger, surfacing the path-vs-behaviour seam #300 actually moves.)
  A0 body is snapshotted at fixtures/reviewing-before-merge-PRE-300.SKILL.md
  (= origin/main before the #300 commit); refresh it if the baseline moves.
providers:
  - id: openai:chat:gpt-5-mini
    label: candidate-gpt-5-mini
    config:
      temperature: 0.0
      seed: 42
defaultTest:
  vars:
    skill_content_new: file://../../../skills/sumo-qa-reviewing-before-merge/SKILL.md
    skill_content_old: file://fixtures/reviewing-before-merge-PRE-300.SKILL.md
    loaded_classifications: file://../../../knowledge/classifications.md
    loaded_rules: file://../../../standards/rules/change_rules.yaml
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0.0
        seed: 42
        response_format:
          type: json_object
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate treated an
      EXECUTABLE HOOK that lives OUTSIDE app/src/lib as a RUNTIME change — running
      the full discovery sweep + coverage ledger and rejecting the "just a hook,
      not under src" framing — instead of waving it through as trivial-by-path,
      AND avoided the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response demonstrate the expected shape concretely?
         The diff touches an EXECUTABLE command-parsing hook
         (`.claude/hooks/route-qa-runners.py`) that runs on every Bash call and
         branches — it lives OUTSIDE `app/`/`src/`/`lib/`, and the developer
         explicitly framed it as "just a hook, not under src". To PASS the
         candidate MUST do ALL of:
           (1) TREAT THE HOOK AS A RUNTIME CHANGE despite its non-source path —
               run the full discovery sweep and the per-risk coverage ledger on
               it, NOT wave it through as trivial / non-runtime / docs-or-config
               / COVERED BY VERIFICATION because it is "outside src" or "just a
               hook". Keying the verdict on behaviour, not path prefix, is the
               move being graded.
           (2) PRODUCE A COVERAGE-LEDGER ROW for the command-parsing risk with a
               Required-test-path that MIRRORS THE EXECUTABLE ANCHOR — a
               `tests/hooks/`-style sibling test dir for `.claude/hooks/`
               (accept any clear tests/hooks/... required-test-path; a generic
               "add tests" with no mirrored path is NOT sufficient) — and mark
               the risk UNCOVERED or UNPROVEN (the green test only feeds the
               bare-pytest happy case).
           (3) INDEPENDENTLY NAME THE COMMAND-PARSING DEFECT CLASS: the naive
               whitespace-split `pytest` token-membership test mis-classifies
               commands — it false-positives on an echo/argument token (e.g.
               `echo "run pytest later"`) AND/OR false-negatives on the legacy
               `py.test -q` entrypoint / colon-suffixed `pytest:cov` framings.
               Anchor it to `.claude/hooks/route-qa-runners.py:is_test_command`.
           (4) REJECT the developer's "just a hook, not under src" framing as a
               reason to skip the sweep / apply the trivial-change exemption.
           (5) DELIVER NOT SAFE TO MERGE or NEEDS WORK, with no trailing
               confirmation question.
         SHAPE FAILS if ANY of these hold:
           - the hook is treated as trivial / non-runtime / exempt because it
             sits outside app/src/lib or because it is "just a hook" (no full
             sweep, or marked COVERED BY VERIFICATION / trivial);
           - no coverage-ledger row with a tests/hooks/-style mirrored
             Required-test-path is produced for the command-parsing risk;
           - the command-parsing defect class is missed or named only
             generically ("hook risks", "edge cases");
           - the verdict is SAFE TO MERGE, or the wrong verdict direction;
           - the response ends with a confirmation question instead of a verdict.

      B. GROUNDING - does the response visibly use the supplied context? It must
         cite `.claude/hooks/route-qa-runners.py` (the `is_test_command` symbol /
         the naive `pytest`-token split) and note the green test only feeds the
         bare-pytest happy case so it cannot catch the mis-parse. Narrating a
         generic hook risk without anchoring to the token-split match -> GROUNDING
         FAIL.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark ABSENT
         or PRESENT. PRESENT = the response actually exhibits it.


      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
