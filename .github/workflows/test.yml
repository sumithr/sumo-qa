name: tests

# Avoid double-runs on every push to a PR branch:
#   - `push: branches: [main]` — only main pushes trigger the push event
#     (covers merges + direct main commits).
#   - `pull_request: branches: [main]` — PR opens/updates trigger here
#     (covers all feature-branch development).
# Push to a feature branch with an open PR → only pull_request fires, once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required token scope. The test job only checks out the repo and
# runs pytest against it — no write actions. Satisfies CodeQL's "workflow
# does not contain permissions" lint.
permissions:
  contents: read

# Cancel in-progress runs when a new push lands on the same ref.
# Saves CI minutes during rapid iteration; the latest commit always gets the
# definitive run. Uses `github.ref` (GitHub-computed, not attacker-supplied)
# so per-PR concurrency buckets stay distinct without exposing branch-name
# injection risk in the grouping key.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every supported Python on Linux; macOS and Windows on the oldest and
      # newest only. No test is gated on a Python version, so each OS-specific
      # test (the Windows-only cmd.exe branch, the POSIX-only
      # symlink/bash/permission tests) still runs on every OS it targets.
      # The ubuntu job names are the ruleset's required checks: keep the name
      # template and all five ubuntu versions.
      #
      # `cov: true` marks the one job that runs the 100% coverage gate
      # (addopts): ubuntu py3.14, where coverage's sys.monitoring core costs
      # almost nothing. The rest pass --no-cov, which drops the overhead the
      # ctrace core adds on 3.10-3.13.
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: ubuntu-latest, python-version: "3.14", cov: true }
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.14" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The `treesitter` extra is installed on every job so the import-edge
        # layer (#354) and its prebuilt wheels are exercised on each OS and
        # Python version in the matrix, and so the coverage job sees the
        # tree-sitter code paths. The graceful-degradation path (extra
        # absent) is covered deterministically in every run by the
        # monkeypatched tests in tests/test_repo_map_imports.py, so a separate
        # extra-free job isn't needed to prove it.
        run: python -m pip install -e ".[dev,vertex,treesitter]"

      # pytest-xdist spreads the suite over the runner's cores; `--dist
      # loadfile` keeps each module on one worker so module-scoped fixtures
      # (the wheel build, the MCP server spawns) run once per module.
      #
      # SUMO_QA_REQUIRE_TREESITTER makes a tree-sitter import failure fail the
      # job (tests/test_repo_map_imports.py) instead of silently skipping the
      # tree-sitter tests on that OS and Python.
      - name: Run pytest
        env:
          SUMO_QA_REQUIRE_TREESITTER: "1"
        run: python -m pytest -n auto --dist loadfile ${{ !matrix.cov && '--no-cov' || '' }}
