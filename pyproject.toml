[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumo-qa"
version = "0.1.5"
description = "Sumo QA — a senior-QA-shaped MCP server for pre-coding QA planning, TDD scaffolding, mutation-testing follow-up, code review, and test-data discovery."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sumith Ramsookbhai", email = "sumithr51@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# No upper cap — packaging.python.org's current guidance is not to pin an
# upper bound on requires-python. All three dependencies (mcp, pydantic,
# PyYAML) ship cp310 through cp314 wheels as of 2026-05; future-Python
# compatibility is best handled by re-releasing when issues actually
# surface, not by gating installs in advance.
requires-python = ">=3.10"
dependencies = [
  # Loose pins so the package builds against whatever pre-built wheels are
  # available for the user's Python version. Tighten only when a specific
  # incompatibility is found.
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.5,<1",
]
vertex = [
  "google-cloud-aiplatform>=1.71.0",
]

[project.urls]
Homepage = "https://github.com/sumithr/sumo-qa"
Repository = "https://github.com/sumithr/sumo-qa"
Issues = "https://github.com/sumithr/sumo-qa/issues"

[project.scripts]
sumo-qa = "sumo_qa.server:main"
sumo-qa-install = "sumo_qa.installer:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sumo_qa"]

# Bundle the standards packs, change rules, and known-good test data into the
# wheel so users who install via pipx/uv/pip get a working server with no env
# vars or paths to configure. The package's resolver falls back to these
# bundled resources when the user hasn't pointed env vars elsewhere.
[tool.hatch.build.targets.wheel.force-include]
"standards" = "sumo_qa/_data/standards"
"knowledge" = "sumo_qa/_data/knowledge"
"skills" = "sumo_qa/_data/skills"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
