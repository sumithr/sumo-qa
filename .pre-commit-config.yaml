# Pre-commit hooks for sumo-qa.
#
# Setup (one-time per clone) — works with whatever you used to install
# the dev dependencies:
#
#   # pip path:
#   python -m pip install -e ".[dev]"
#   pre-commit install --install-hooks
#
#   # or uv path (if you already use uv):
#   uv sync --all-extras
#   uv run pre-commit install --install-hooks
#
# After that, every `git commit` runs ruff (with auto-fix) + formatting
# + basic file hygiene against the staged files. ~1 second.
#
# To run all hooks on demand:   pre-commit run --all-files
# To bypass a single commit:    git commit --no-verify   (rarely needed; CI will catch)
#
# Test runs deliberately stay in CI (`.github/workflows/test.yml`),
# not as a local pre-push hook — that would couple every push to which
# `python` happens to be first on PATH (system vs pyenv vs venv) and
# fail confusingly in mixed environments.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pin matches `ruff>=0.5,<1` from pyproject.toml's dev extras. Update both
    # together when bumping ruff.
    rev: v0.13.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # Worked-example transcripts are markdown, no JSON in there.
        exclude: ^tests/scenarios/worked-examples/
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
