        Context: `canonical` backs the `toolkit canon` command, which prints
        the canonical form of a JSON payload to stdout; it writes no file.
        `canonical` is the only subprocess call in `src/toolkit/canon.py`. The
        child is the running interpreter by absolute path (`sys.executable`,
        no `PATH` lookup) in isolated mode (`-I`: it ignores every `PYTHON*`
        variable and the user site directory, and keeps the cwd off
        `sys.path`). Its program imports only the standard-library `json` and
        `sys`, reads the payload from stdin and writes the result as bytes to stdout;
        it opens no file and spawns nothing.

        ## Fresh test run
        ```text
