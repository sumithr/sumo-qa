name: install-smoke

# End-to-end execution test for the canonical install paths documented in
# README.md and DEMO.md:
#
#   pip install sumo-qa && sumo-qa-install --claude-code
#   pip install sumo-qa && sumo-qa-install --vscode --workspace <repo>
#   pip install sumo-qa && sumo-qa-install --claude-desktop
#   pip install sumo-qa && sumo-qa-install --jetbrains
#
# Works on macOS, Linux, AND Windows because pip generates `.exe` wrappers
# on Windows. This smoke catches host-specific regressions in pyproject.toml
# entry points and installer.py without expanding the full Python matrix.
#
# Trigger pattern matches the rest of .github/workflows/*.yml: push on
# main, pull_request for everything else, concurrency cancel for rapid
# iteration.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required token scope. Every job only checks out the repo and
# runs scripts against it — no write actions, no PR comments, no checks
# API. Satisfies CodeQL's "workflow does not contain permissions" lint.
permissions:
  contents: read

concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install-pip:
    name: pip install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # Pin a single Python version — this is a smoke test of the
          # install vector, not a compatibility matrix. The pytest
          # workflow (test.yml) covers 3.10–3.14.
          python-version: "3.12"

      - name: pip install from source
        # Installs the wheel built from THIS PR's source, not the PyPI
        # release. `pip install .` (not `-e .`) mirrors what a real
        # `pip install sumo-qa` user gets — a built wheel, not an
        # editable install.
        run: pip install .

      - name: Verify entry points are on PATH
        # `shell: bash` makes this step work uniformly on Windows
        # (git-bash, preinstalled on windows-latest), macOS, and Linux
        # — so `command -v` resolves the same way everywhere. Verifies
        # every entry point declared in pyproject.toml ([project.scripts])
        # so a Windows .exe wrapper regression on any of them is caught.
        # No untrusted GitHub event inputs are interpolated in this step.
        shell: bash
        run: |
          command -v sumo-qa
          sumo-qa --help >/dev/null
          command -v sumo-qa-install
          sumo-qa-install --help >/dev/null
          command -v sumo-qa-doctor
          sumo-qa-doctor --help >/dev/null

      - name: Smoke sumo-qa-doctor end-to-end
        # Real doctor invocation against a fresh wheel install on each OS.
        # Unit tests cover the logic; this catches regressions specific to
        # the install vector — e.g. a hatch packaging bug that drops the
        # console-script wrapper, or a Windows-specific Path / shutil.which
        # interaction the unit tests can't reach.
        #
        # Two assertions:
        #   1. Plain run produces structured output (every line starts with
        #      [OK]/[WARN]/[FAIL] + a Summary footer). Exit code is NOT
        #      gated — a fresh runner has no Claude / VS Code / JetBrains
        #      installation, so multiple FAILs are expected; doctor's exit
        #      code is 1 in that case. We only assert doctor itself runs
        #      cleanly and produces the documented output shape.
        #   2. --json output parses and carries the documented top-level
        #      shape (schema_version + summary + checks).
        #
        # `set +e` brackets every doctor invocation so a non-zero exit
        # (expected on a fresh runner) doesn't fail the workflow step.
        # The shape assertions stay strict.
        #
        # No untrusted GitHub event inputs are interpolated in this step.
        shell: bash
        run: |
          set +e
          sumo-qa-doctor > doctor.out
          doctor_exit=$?
          sumo-qa-doctor --json > doctor.json
          doctor_json_exit=$?
          python -m sumo_qa.doctor --help > /dev/null
          module_help_exit=$?
          set -e
          echo "doctor exit codes: human=$doctor_exit json=$doctor_json_exit module-help=$module_help_exit"
          # Module-form --help must always exit 0 — it's an argparse help
          # display, no checks run.
          [ "$module_help_exit" -eq 0 ]
          test -s doctor.out
          grep -q "^\[OK\]\|^\[WARN\]\|^\[FAIL\]" doctor.out
          grep -q "^Summary:" doctor.out
          python -c "import json; d = json.load(open('doctor.json')); assert d['schema_version'] == '0'; assert 'summary' in d and 'checks' in d; assert isinstance(d['checks'], list); assert len(d['checks']) >= 6, d"

      - name: Smoke install.sh wrapper (--print-plan)
        # The one-command wrapper is a thin router; --print-plan emits the
        # exact commands it WOULD delegate to without executing them, so this
        # smoke verifies the routing on a real runner with zero side effects.
        # Runs under git-bash on Windows too (the entry-point step above
        # already relies on it). No untrusted GitHub event inputs are
        # interpolated in this step.
        shell: bash
        run: |
          plan=$(bash install.sh --print-plan)
          echo "$plan"
          echo "$plan" | grep -q -- "-m pip install sumo-qa"
          echo "$plan" | grep -q -- "-m sumo_qa.installer"
          # Doctor runs via the resolved interpreter (-m sumo_qa.doctor), not
          # the bare console script, so verification is PATH-independent.
          echo "$plan" | grep -q -- "-m sumo_qa.doctor"
          # --update routes to the upgrade path.
          bash install.sh --print-plan --update | grep -q -- "-m pip install --upgrade sumo-qa"
          # A verified host is forwarded; an unverified host is rejected.
          bash install.sh --print-plan --host vscode | grep -q -- "--vscode"
          ! bash install.sh --print-plan --host emacs

      - name: Smoke install.ps1 wrapper (-PrintPlan)
        # Windows-only PowerShell parity smoke for the wrapper. Mirrors the
        # bash smoke above. No untrusted GitHub event inputs are interpolated.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # -PrintPlan emits one command per line; join to a single string so
          # the membership checks below work regardless of array semantics
          # (a bare `$array -notmatch x` returns the non-matching subset, not
          # a boolean, which would mis-fire on a multi-line plan).
          $plan = (& .\install.ps1 -PrintPlan) -join "`n"
          $plan
          if ($plan -notmatch '-m pip install sumo-qa') { throw 'plan missing pip install' }
          if ($plan -notmatch '-m sumo_qa.installer') { throw 'plan missing installer' }
          if ($plan -notmatch 'sumo_qa\.doctor') { throw 'plan missing doctor' }
          $upd = (& .\install.ps1 -PrintPlan -Update) -join "`n"
          if ($upd -notmatch '-m pip install --upgrade sumo-qa') { throw 'update plan missing upgrade' }
          # -Host must still bind (it is preserved as an alias of -TargetHost)
          # and forward --vscode to the installer.
          $vs = (& .\install.ps1 -PrintPlan -Host vscode) -join "`n"
          if ($vs -notmatch '--vscode') { throw 'host flag not forwarded' }

      - name: Smoke sumo-qa-install --claude-code
        # Claude Code host-wiring path contains the Windows-specific branches in
        # installer.py (APPDATA handling, .cmd shims, symlink-vs-copy fallback
        # in _install_claude_code_skills_per_dir). Without exercising it, a
        # Windows regression in _setup_claude_code() ships unnoticed.
        #
        # On a fresh runner neither ~/.claude nor ~/.config/claude exists, so
        # _setup_claude_code's detection gate (installer.py:370-372) would
        # short-circuit with "not detected" and the install would exit
        # successfully without actually exercising the skill-symlink and
        # config-write paths. Mirror the Claude Desktop / JetBrains smokes
        # below: create a temp HOME with .claude/ pre-existing, point
        # HOME / USERPROFILE / APPDATA at it, then assert the installer
        # actually wrote what it should — skill symlinks under
        # ~/.claude/skills/ plus claude_desktop_config.json with the
        # sumo-qa MCP entry.
        #
        # `_register_claude_code_mcp` no-ops gracefully when the `claude` CLI
        # isn't on PATH (which it isn't on a fresh runner), so the registry
        # registration step isn't asserted against.
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="sumo-qa-claude-code-"))
          home = root / "home"
          appdata = root / "AppData" / "Roaming"
          (home / ".claude").mkdir(parents=True)
          appdata.mkdir(parents=True)

          env = os.environ.copy()
          env["HOME"] = str(home)
          env["USERPROFILE"] = str(home)
          env["APPDATA"] = str(appdata)

          subprocess.run(["sumo-qa-install", "--claude-code"], check=True, env=env)

          skills_dir = home / ".claude" / "skills"
          assert skills_dir.is_dir(), skills_dir
          installed = sorted(p.name for p in skills_dir.iterdir() if p.is_dir() or p.is_symlink())
          assert installed, f"no skills installed under {skills_dir}"

          system = platform.system()
          if system == "Windows":
              config_dir = appdata / "Claude"
          else:
              config_dir = home / ".config" / "claude"
          config_path = config_dir / "claude_desktop_config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          server = config["mcpServers"]["sumo-qa"]
          assert server["command"], server
          PY

      - name: Smoke VS Code workspace config
        # Exercises the installed-wheel console script against a temporary
        # workspace and verifies the VS Code-native schema. VS Code ignores
        # Claude's `mcpServers` schema, so this check guards the documented
        # `--vscode --workspace <repo>` path.
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          workspace = Path(tempfile.mkdtemp(prefix="sumo-qa-vscode-"))
          (workspace / "pyproject.toml").write_text("[project]\nname = 'smoke'\n", encoding="utf-8")

          subprocess.run(
              ["sumo-qa-install", "--vscode", "--workspace", str(workspace)],
              check=True,
          )

          config_path = workspace / ".vscode" / "mcp.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          assert "servers" in config, config
          assert "mcpServers" not in config, config
          server = config["servers"]["sumo-qa"]
          assert server["type"] == "stdio", server
          assert server["command"], server
          assert server["args"] == [], server
          PY

      - name: Smoke Claude Desktop config path
        # Creates only the host config directory under temporary HOME/APPDATA
        # and verifies that the installed console script writes the Claude
        # Desktop `mcpServers` config there without touching the runner user.
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="sumo-qa-claude-desktop-"))
          home = root / "home"
          appdata = root / "AppData" / "Roaming"
          home.mkdir(parents=True)
          appdata.mkdir(parents=True)

          system = platform.system()
          if system == "Darwin":
              config_dir = home / "Library" / "Application Support" / "Claude"
          elif system == "Windows":
              config_dir = appdata / "Claude"
          else:
              config_dir = home / ".config" / "Claude"
          config_dir.mkdir(parents=True)

          env = os.environ.copy()
          env["HOME"] = str(home)
          env["USERPROFILE"] = str(home)
          env["APPDATA"] = str(appdata)

          subprocess.run(["sumo-qa-install", "--claude-desktop"], check=True, env=env)

          config_path = config_dir / "claude_desktop_config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          server = config["mcpServers"]["sumo-qa"]
          assert server["command"], server
          PY

      - name: Smoke JetBrains manual output
        # JetBrains setup intentionally remains a Settings-UI workflow. This
        # smoke creates a fake IDE config root and verifies the installer prints
        # the manual fields instead of writing a Claude/VS Code JSON schema.
        shell: bash
        run: |
          python - <<'PY'
          import os
          import platform
          import subprocess
          import tempfile
          from pathlib import Path

          root = Path(tempfile.mkdtemp(prefix="sumo-qa-jetbrains-"))
          home = root / "home"
          appdata = root / "AppData" / "Roaming"
          home.mkdir(parents=True)
          appdata.mkdir(parents=True)

          system = platform.system()
          if system == "Darwin":
              jb_root = home / "Library" / "Application Support" / "JetBrains"
          elif system == "Windows":
              jb_root = appdata / "JetBrains"
          else:
              jb_root = home / ".config" / "JetBrains"
          (jb_root / "IntelliJIdea2026.1" / "options").mkdir(parents=True)

          env = os.environ.copy()
          env["HOME"] = str(home)
          env["USERPROFILE"] = str(home)
          env["APPDATA"] = str(appdata)

          proc = subprocess.run(
              ["sumo-qa-install", "--jetbrains"],
              check=True,
              env=env,
              capture_output=True,
              text=True,
          )
          assert "Command:" in proc.stdout, proc.stdout
          assert "Model Context Protocol" in proc.stdout, proc.stdout
          assert "mcpServers" not in proc.stdout, proc.stdout
          assert not list(jb_root.rglob("*.json"))
          assert not list(jb_root.rglob("*.xml"))
          PY

  plugin-dir-handshake:
    # Validates each generated plugin folder by spawning the MCP server it
    # references and running an `initialize` + `tools/list` handshake. This
    # provides the schema-correctness guarantee for the Codex manifest
    # (which has no published JSON Schema) and a behavioural guarantee for
    # the Claude Code manifest (which is also schema-validated by
    # plugin-packaging.yml).
    #
    # We do NOT run the host binaries themselves (auth + sandboxing make
    # that fragile in CI). Instead we read the adapter's `.mcp.json`,
    # spawn the declared `command`, and assert sumo_qa_* tools come back —
    # mirroring how the installer's own _verify_mcp_handshake works.
    name: plugin-dir handshake
    runs-on: ubuntu-latest
    needs: install-pip
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install wheel
        run: pip install .

      - name: Install uv
        # The plugin's .mcp.json command is now `uvx --from git+...`
        # (per #83 plugin self-containment). The handshake spawns whatever
        # .mcp.json says, so uvx must be on PATH. Astral's official
        # installer puts uv at $HOME/.local/bin on Linux.
        # No untrusted GitHub event inputs interpolated.
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: MCP initialize handshake (auto-discovers every .*-plugin/ adapter)
        shell: bash
        # The handshake logic lives in scripts/plugin_dir_handshake.py and
        # reuses run_handshake() from scripts/uvx_smoke_handshake.py so the
        # stdin-stays-open contract has one source of truth. Regression
        # tests at tests/test_uvx_smoke_handshake.py and
        # tests/test_plugin_dir_handshake.py keep both job paths protected.
        #
        # No matrix: the script auto-discovers every `.*-plugin/` directory
        # with a plugin.json at cwd and smokes each. A new host adapter
        # added to plugin_packaging/plugin_generator.py is picked up
        # automatically — no workflow edit. test_auto_discovers_every_
        # adapter_with_plugin_json pins the discovery contract.
        #
        # The previous inline heredoc used subprocess.communicate() which
        # closes stdin immediately and triggers the mcp library's cancel-
        # in-flight-handlers branch — fails on Linux's epoll scheduler.
        # Same root cause as PR #141; that fix missed this second job.
        run: python scripts/plugin_dir_handshake.py

  install-plugin-uvx:
    name: plugin install via uvx (${{ matrix.os }})
    # Smokes the canonical plugin install path: uvx fetches sumo-qa from
    # the local checkout (simulating `uvx --from git+https://github.com/...`)
    # and spawns the MCP server. Proves the .mcp.json uvx form actually
    # works end-to-end on every OS — catches regressions a pip-only smoke
    # would miss (uvx-incompatible packaging changes, env-var passthrough
    # bugs, Windows .exe shim differences for uvx).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv (Linux/macOS)
        # Bash installer + PATH for *nix runners. Cross-platform install
        # via a single step is unreliable: the bash installer doesn't
        # work on Windows-native shells, and $HOME/.local/bin doesn't
        # resolve identically across shells.
        # No untrusted GitHub event inputs interpolated.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install uv (Windows)
        # Windows uses Astral's PowerShell installer. uv installs to
        # %USERPROFILE%\.local\bin (per Astral's docs); add that to
        # the Windows-native PATH so subsequent steps can find uvx
        # from python subprocess.
        # No untrusted GitHub event inputs interpolated.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"
          "$env:USERPROFILE\.local\bin" >> $env:GITHUB_PATH

      - name: Verify uvx can resolve sumo-qa via ${CLAUDE_PLUGIN_ROOT}
        # The plugin's .mcp.json declares `uvx --from ${CLAUDE_PLUGIN_ROOT}
        # sumo-qa` per Anthropic's canonical pattern
        # (https://code.claude.com/docs/en/mcp#plugin-provided-mcp-servers).
        # Mirror the runtime substitution by setting CLAUDE_PLUGIN_ROOT to
        # the checkout root, then verify uvx can resolve the three console
        # scripts the package ships. No untrusted GitHub event inputs.
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: |
          uvx --from "$CLAUDE_PLUGIN_ROOT" sumo-qa --help >/dev/null
          uvx --from "$CLAUDE_PLUGIN_ROOT" sumo-qa-install --help >/dev/null
          uvx --from "$CLAUDE_PLUGIN_ROOT" sumo-qa-doctor --help >/dev/null

      - name: Smoke MCP initialize via uvx-spawned server
        # End-to-end: spawn the MCP server via uvx and drive an initialize
        # + tools/list handshake. Confirms the uvx-bootstrap pattern
        # produces a working JSON-RPC server on every OS — catches
        # regressions in the canonical plugin install vector.
        # Mirrors the runtime ${CLAUDE_PLUGIN_ROOT} substitution Claude
        # Code performs when reading .mcp.json (Anthropic's canonical
        # pattern: https://code.claude.com/docs/en/mcp#plugin-provided-mcp-servers).
        #
        # The handshake logic lives in scripts/uvx_smoke_handshake.py so it
        # is importable + unit-testable (tests/test_uvx_smoke_handshake.py
        # pins the stdin-stays-open-until-id==2-received contract against
        # a deterministic mock that mirrors the mcp library's cancel-on-EOF
        # branch — the bug that bit PR #141 ubuntu CI when the smoke used
        # subprocess.communicate()).
        #
        # No untrusted GitHub event inputs interpolated.
        shell: bash
        env:
          CLAUDE_PLUGIN_ROOT: ${{ github.workspace }}
        run: python scripts/uvx_smoke_handshake.py
