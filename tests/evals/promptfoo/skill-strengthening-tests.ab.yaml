      Line 2 (applied technique, VERBATIM catalogue heading from knowledge/techniques.md):
        `Applying <technique name>:` then one sentence rationale tying technique to the mutant shape.
      Line 3 (target test file path): `Target test file: \`<path>\``
      Then: the failing test code block (fenced, complete function definition).
      Last line: `Production code stays unchanged.`

      For an equivalent mutant, produce this response format:

      Line 1 (mutant surface anchor): `<mutant id>: \`<original expression>\` -> \`<mutated expression>\` - equivalent mutant.`
      Line 2: `No strengthening test:` then one sentence explaining why the original and mutant are observably equivalent.
      Line 3: `Suppress in tool config: \`<path>\``
      Then: the config-side suppression snippet (fenced).
      Last line: `Production code stays unchanged.`

      NO confirmation question. NO closing pleasantry. NO additional sections.
      The technique for real mutants MUST be the verbatim catalogue heading -
