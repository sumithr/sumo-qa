        \  \"tree-sitter-language-pack>=1.8,<2\",\n+141     \"tree-sitter-language-pack>=1.12.5,<2\",\n\
        \ 142   ]\n 143   \n 144   [project.urls]\n\ndiff --git a/src/sumo_qa/repo_map_treesitter.py b/src/sumo_qa/repo_map_treesitter.py\n\
        @@ src/sumo_qa/repo_map_treesitter.py:10-26 @@\n 10       single switch the orchestrator reads to\
        \ decide between emitting import edges\n 11       and recording the graceful-degradation warning.\n\
        \ 12    \n-13    2. **Non-mainstream binding API.** ``tree-sitter-language-pack``'s binding is\n\
        -14       method-style and differs from the upstream ``tree-sitter`` package:\n-15       ``parse()``\
        \ takes a ``str`` (not ``bytes``); ``tree.root_node()`` is a\n-16       method; and node accessors\
        \ are methods too — ``kind()``, ``child(i)``,\n-17       ``child_count()``, ``named_child(i)``,\
        \ ``named_child_count()``,\n-18       ``start_byte()``, ``end_byte()``. A node carries no ``.text``\
        \ attribute, so\n-19       source text is recovered by byte-slicing the original source. All of\
        \ that is\n-20       absorbed here behind :class:`TSNode`; the version is pinned and the\n+13  \
        \  2. **Binding API absorption.** Since 1.12.5 the language-pack's\n+14       ``get_parser()`` returns\
        \ the upstream ``tree_sitter.Parser``: ``parse()``\n+15       takes ``bytes`` (a ``str`` raises\
        \ ``TypeError``); ``tree.root_node`` and the\n+16       node accessors — ``type``, ``child_count``,\
        \ ``start_byte``, ``end_byte`` —\n+17       are properties (``child(i)`` stays a method), and the\
        \ kind accessor is named\n+18       ``type``, not ``kind``. Earlier language-pack releases bundled\
        \ a str-only\n+19       method-style binding with the opposite shapes (#491), so the extra is\n\
        +20       floored at 1.12.5 in pyproject. All of it is absorbed here behind\n+21       :class:`TSNode`\
        \ — resolvers never touch the raw API — and the\n 22       binding-contract test (``tests/test_repo_map_treesitter.py``)\
        \ fails loudly\n-22       if any of these shapes drift.\n+23       if any of these shapes drift\
        \ again.\n 24    \"\"\"\n 25    \n 26    from __future__ import annotations\n@@ src/sumo_qa/repo_map_treesitter.py:77-87\
        \ @@\n 77        @property\n 78        def kind(self) -> str:\n 79            \"\"\"The node's grammar\
        \ kind (``import_statement``, ``dotted_name``, …).\"\"\"\n-79            return str(self._node.kind())\n\
        +80            return str(self._node.type)\n 81    \n 82        @property\n 83        def child_count(self)\
        \ -> int:\n-83            return int(self._node.child_count())\n+84            return int(self._node.child_count)\n\
        \ 85    \n 86        def child(self, index: int) -> TSNode:\n 87            return TSNode(self._node.child(index),\
        \ self._src)\n@@ src/sumo_qa/repo_map_treesitter.py:116-123 @@\n 116   def parse(language: str,\
        \ src: bytes) -> TSNode:\n 117       \"\"\"Parse ``src`` for ``language`` and return the wrapped\
        \ root node.\n 118   \n-118       ``src`` is bytes (resolvers read files as bytes); the language-pack\n\
        -119       ``parse`` wants ``str``, so decoding happens here. Raises\n+119       ``src`` is bytes\
        \ (resolvers read files as bytes); the binding's ``parse``\n+120       wants ``bytes`` too, but\
        \ the input is normalized first (see below). Raises\n 121       :class:`TreesitterUnavailableError`\
        \ when the extra is absent — callers must\n 122       gate on :data:`TREESITTER_AVAILABLE` first.\n\
        \ 123       \"\"\"\n@@ src/sumo_qa/repo_map_treesitter.py:126-142 @@\n 126               \"tree-sitter\
        \ is not installed; install the [treesitter] extra\"\n 127           )\n 128       parser = _language_pack.get_parser(language)\n\
        -128       # The binding wants ``str``; tree-sitter then parses that string's UTF-8\n-129      \
        \ # encoding and reports byte offsets into THOSE bytes. Carry the same bytes\n-130       # into\
        \ TSNode (not the original ``src``) so a node's text slice stays aligned\n-131       # even when\
        \ ``errors=\"replace\"`` rewrote an invalid byte to U+FFFD - which is\n-132       # 3 bytes, shifting\
        \ every later offset and otherwise silently dropping a real\n-133       # import (#458). For valid\
        \ UTF-8 the round-trip is identity, so this is a\n-134       # no-op there.\n-135       decoded\
        \ = src.decode(\"utf-8\", errors=\"replace\")\n-136       tree = parser.parse(decoded)\n-137   \
        \    if tree is None:  # pragma: no cover -- defensive: parse() of decoded text always yields a\
