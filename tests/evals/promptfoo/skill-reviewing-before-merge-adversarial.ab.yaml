disableVarExpansion: true
description: >
  Issue #236 — A/B/C discovery-lift measurement for the adversarial
  review-recall corpus. Unlike skill-reviewing-before-merge.ab.yaml (which
  measures FINAL-VERDICT formatting after risks are pre-supplied), this file
  measures INDEPENDENT DISCOVERY from a raw diff: does the full skill (B) find
  the seeded Codex-class defect that no-skill (A0) and catalogues-only (A1)
  baselines miss? Hypothesis: B beats A0/A1 in aggregate because the
  adversarial discovery pass forces a signal->defect-class sweep before the
  risk list; A0/A1 lack that pass and declare green-tested diffs safe. Uses a
  representative 6-seed spread (easy->hard discovery families + a docs-only
  negative control) from skill-reviewing-before-merge-adversarial.yaml. Candidate
  is gpt-5-mini (a cheap reasoning model), NOT the estate's gpt-4o-mini: a
  discovery eval needs a candidate that can reason over a raw diff, and
  gpt-4o-mini proved too noisy to measure it (its full-corpus baseline-vs-postcut
  inverted run-to-run). On gpt-5-mini this is a clean, same-run controlled
  result — B (full skill) 6/6 vs A0 (no skill) / A1 (catalogues only) only
  ~1-4/6: the discovery pass takes B to a perfect score on the hard families
  A0/A1 miss. A0/A1 flicker run-to-run; B is stable. Read the B-over-A0
  ordering as the signal.
providers:
  - file://{{ env.SUMO_EVAL_CANDIDATES_FILE | default('providers/cloud-reasoning-candidate.yaml') }}
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-reviewing-before-merge/SKILL.md
    classifications: file://../../../knowledge/classifications.md
    approaches: file://../../../knowledge/approaches.md
    principles: file://../../../knowledge/principles.md
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider: file://{{ env.SUMO_EVAL_JUDGE_FILE | default('providers/cloud-quality-judge.yaml') }}
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate
      INDEPENDENTLY DISCOVERED the seeded defect from a raw diff (no risks were
      pre-supplied) AND avoided the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE - the candidate was NOT handed the risks; it must name the
         specific defect class described in the expected shape (not a generic
         "edge cases might exist"), anchor it to the file + line/symbol that
         carries the defect (a changed path in the diff, or — for
         drift/generated-artifact seeds — the stale repo-state artifact named in
         the supplied context), and deliver the verdict the expected shape
         requires. Naming only generic/unrelated risks, missing the seeded
         defect, or the wrong verdict direction is a SHAPE FAIL.

      B. GROUNDING - the response must cite the specific file +
         symbol/line/construct that carries the defect — normally a changed
         path in the diff, but for drift/generated-artifact seeds the
         actionable anchor may be a stale repo-state artifact named in the
         supplied "repo state" block (citing that is valid grounding). A
         plausible risk not anchored to any supplied file -> GROUNDING FAIL.

      C. ANTI-PATTERNS - for each anti-pattern listed, mark ABSENT or PRESENT.


      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - label: 'A0 - no skill, no catalogues'
    raw: |
      You are a senior QA reviewer in an IDE chat session.

      Raw repository diff and fresh verification evidence for this turn. The
      risks have NOT been named for you — discover them yourself from the raw
      diff. The developer has waived the section-by-section confirmation gates
      and asked for a single-pass review. You have just read the diff and run
      the tests shown below.

      --- GROUND-TRUTH CONTEXT ---
      {{ground_truth_context}}
      --- END GROUND-TRUTH CONTEXT ---

      The developer just said:

      > {{user_prompt}}

      Deliver your merge-review response. Name the concrete risks you find and
      deliver the verdict. Keep the response concise and evidence-led.
