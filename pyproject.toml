[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumo-qa"
version = "0.50.3"
description = "Sumo QA — a senior-QA-shaped MCP server for pre-coding QA planning, TDD scaffolding, mutation-testing follow-up, code review, and test-data discovery."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Sumith Ramsookbhai", email = "sumithr51@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
# No upper cap — packaging.python.org's current guidance is not to pin an
# upper bound on requires-python. All three dependencies (mcp, pydantic,
# PyYAML) ship cp310 through cp314 wheels as of 2026-05; future-Python
# compatibility is best handled by re-releasing when issues actually
# surface, not by gating installs in advance.
requires-python = ">=3.10"
dependencies = [
  # Loose pins so the package builds against whatever pre-built wheels are
  # available for the user's Python version. Tighten only when a specific
  # incompatibility is found.
  "mcp>=1.12,<2",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  # Security floor for a transitive dependency pulled by `mcp` (FastMCP's
  # Starlette transport). starlette < 1.0.1 is affected by PYSEC-2026-161.
  # Declared directly (not just a uv constraint) so the floor propagates to the
  # built wheel and protects pip/Poetry installers too, not only uv resolution.
  # Drop once `mcp` requires a safe starlette floor itself.
  "starlette>=1.0.1",
  # TOML reader for the slice-2 repo-map scanner's pyproject.toml parsing.
  # tomllib is stdlib on 3.11+; 3.10 (still supported per requires-python)
  # needs the tomli backport. dev extras already pull tomli for plugin_packaging,
  # but the scanner ships in the wheel, so the floor has to live here too.
  "tomli>=2,<3; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "jsonschema>=4,<5",
  # tomllib is stdlib on 3.11+; 3.10 needs the backport. Used by the
  # plugin_packaging canonical loader (build-time / maintainer-time),
  # tests/test_plugin_metadata.py, AND mypy when type-checking the
  # repo-map scanner's 3.10-branch `import tomli as tomllib`. Mypy is
  # pinned to python_version="3.10", so the 3.10 branch resolves on every
  # dev host regardless of the interpreter version — hence unconditional
  # here, while the wheel keeps the conditional runtime declaration above.
  "tomli>=2,<3",
  "mutmut>=3,<4",
  # NOTE: CVE-2025-71176 (local tmpdir symlink, fixed in pytest 9.0.3) cannot be
  # remediated by upgrading while pytest-check-links is a dev dep — its latest
  # release (0.10.1) hard-caps pytest<9 and is unmaintained. The advisory is
  # ignored in the pip-audit hook with rationale; revisit if a pytest>=9
  # -compatible link-checker ships. See .pre-commit-config.yaml.
  "pytest>=8.4,<10",
  "pytest-cov>=6,<8",
  # Markdown link-existence gate: pre-commit + CI invoke
  # `scripts/check_markdown_links.sh`, which wraps pytest-check-links.
  # Catches the class of bug where a doc references a file that was
  # removed but the link wasn't updated. Anchor checking stays OFF
  # (upstream bug in 0.10.1); revisit when > 0.10.x ships.
  "pytest-check-links>=0.10,<1",
  "ruff>=0.5,<1",
  # Static type checking — see [tool.mypy]. mypy is pure-Python (no Node
  # toolchain), matching the project's Python-only CI. types-PyYAML supplies
  # the stubs PyYAML doesn't ship inline. hatchling (the build backend) lets
  # tests/test_wheel_packaging.py build the wheel offline via
  # `pip wheel --no-build-isolation` and inspect it for the py.typed marker.
  "mypy>=2,<3",
  "types-PyYAML>=6,<7",
  "hatchling>=1.25",
  "pre-commit>=3.7,<5",
  # Windows ships no system tz database; Hypothesis `st.timezones()` strategy
  # needs `tzdata` to enumerate IANA zones via stdlib `zoneinfo`.
  "tzdata; platform_system == 'Windows'",
]
vertex = [
  "google-cloud-aiplatform>=1.71.0",
]
# Optional import-graph parser for the repo-map scanner's `imports` edge layer
# (#354). The core install stays pure-Python; this extra adds the tree-sitter
# binding only when a caller opts in (`pip install sumo-qa[treesitter]`). With
# it absent, `scan_repo` still succeeds — it records a `RepoMapWarning` and
# emits only `likely_tests` edges (see repo_map_treesitter / repo_map_imports).
# `tree-sitter-language-pack` ships one abi3 wheel bundling ~165 grammars with
# prebuilt Linux/macOS/Windows wheels (no compiler, no Node). Pinned so a
# binding-API drift surfaces as a contract-test failure, not silent breakage.
treesitter = [
  "tree-sitter>=0.25,<0.26",
  "tree-sitter-language-pack>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/sumithr/sumo-qa"
Repository = "https://github.com/sumithr/sumo-qa"
Issues = "https://github.com/sumithr/sumo-qa/issues"

[project.scripts]
sumo-qa = "sumo_qa.cli:console_main"
sumo-qa-install = "sumo_qa.installer:main"
sumo-qa-doctor = "sumo_qa.doctor:main"
sumo-qa-validate = "sumo_qa.validate_content:main"
sumo-qa-ingest = "sumo_qa.ingest:main"
sumo-qa-feedback = "sumo_qa.feedback_memory:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sumo_qa"]

# Bundle the standards packs, change rules, knowledge catalogues, and host
# skills into the wheel so pipx/uv/pip users get a working server with no
# env vars or paths to configure. The package's resolver falls back to these
# bundled resources when the user hasn't pointed env vars elsewhere.
#
# Test data is deliberately NOT bundled. The repo's own auth/billing sample
# YAMLs live under tests/fixtures/test_data/ and exist only for the package's
# test suite — shipping them would pollute end-user `sumo_qa_find_test_data`
# results with our internal fixtures. Fresh installs start with an empty
# catalogue; teams populate `knowledge/test_data/` (or QA_TEST_DATA_PATH).
[tool.hatch.build.targets.wheel.force-include]
"standards" = "sumo_qa/_data/standards"
"knowledge" = "sumo_qa/_data/knowledge"
"skills" = "sumo_qa/_data/skills"
"hooks" = "sumo_qa/_data/hooks"
"assets" = "sumo_qa/_data/assets"

[tool.pytest.ini_options]
# `src` exposes the installed package `sumo_qa`. `.` (repo root) exposes the
# build-time-only `plugin_packaging` package — it is NOT shipped in the
# wheel (no entry under `[tool.hatch.build.targets.wheel]`), so it must be
# resolvable from the repo root for the test suite and the pre-push hook
# (which runs in pre-commit's isolated venv where conftest.py's sys.path
# tweak doesn't fire before collection).
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q --cov=src/sumo_qa --cov-fail-under=100"

[tool.mypy]
# Make the `Typing :: Typed` classifier real: type-check the shipped package.
# Targets the lowest supported runtime (requires-python = ">=3.10") so the
# checker flags any 3.11+-only syntax/typing the package can't use.
python_version = "3.10"
files = ["src/sumo_qa"]
# Surface accidentally-unused suppressions so the narrow ignores below don't
# rot silently once the underlying dynamic surface changes.
warn_unused_ignores = true
warn_redundant_casts = true
# Tests are intentionally out of scope — no full strict-mode conversion across
# the suite (per issue #75 non-goals). mcp and pydantic ship their own py.typed,
# so only PyYAML needs the types-PyYAML stubs declared in the dev extras.

[[tool.mypy.overrides]]
# The [treesitter] extra is optional, so its binding is absent from the core
# (and lint-CI) environment; it is also used only dynamically behind the
# TSNode/parse() adapter. Treat it as ``Any`` so the type check is identical
# whether or not the extra is installed; the alternative, an inline
# ``# type: ignore[import-not-found]``, would be flagged unused in whichever
# environment has the module present (see repo_map_treesitter.py).
module = "tree_sitter_language_pack"
ignore_missing_imports = true

[tool.mutmut]
# Target only the four parser/decision modules per the Phase 3 strategy.
# Other modules (installer, server, tdm_*) aren't included in this baseline.
paths_to_mutate = [
  "src/sumo_qa/knowledge_loaders.py",
  "src/sumo_qa/rules.py",
  "src/sumo_qa/standards.py",
  "src/sumo_qa/tdm_validation.py",
  # #147 follow-up: the coverage/mutation artifact validation is decision logic
  # (schema-version gate, range/vocab/type classification, signal mapping), so
  # it earns mutation coverage. Strengthened to 0 survivors (1 equivalent
  # join-separator mutant carries a `# pragma: no mutate`).
  "src/sumo_qa/coverage_models.py",
  # The QA-report builder: artifact ingestion + the render-ready projection
  # (honest absent/invalid/stale states, falsifiable readiness reasons, signal
  # threading). Strengthened to 0 survivors. Dead/redundant branches carry a
  # `# pragma: no mutate` with rationale; the scorecard signal-threading mutants
  # (continuation-line kwargs that mutmut/LibCST can't pragma) are killed by a
  # collaborator-spy test instead.
  "src/sumo_qa/report_builder.py",
]
# --no-cov: bypasses --cov-fail-under=100 addopts (fails every mutated run)
# -x: stop at first failure for speed
# --ignore: exclude tests that spawn a fresh Python interpreter importing a
#   mutated module. Such a subprocess is NOT started by the mutmut runner, so the
#   trampoline injected into the mutated function reads an absent MUTANT_UNDER_TEST
#   env var and crashes (`KeyError: 'MUTANT_UNDER_TEST'`; older mutmut releases
#   surfaced this as `AttributeError: 'NoneType' object has no attribute
#   'max_stack_depth'`). The wheel-build test is excluded for a related reason —
#   under mutmut the CWD is the incomplete mutants/ mirror, so its build
#   subprocess would target the wrong tree.
#
#   DISCOVERABLE CONVENTION (do not add to this list by tribal knowledge):
#   every entry below carries the `mutmut-subprocess-spawning` marker comment in
#   the test file itself, and tests/test_mutmut_subprocess_exclusions.py is a
#   LOUD guard that runs in the ordinary pytest suite — it fails immediately (at
#   the PR that introduces the test, not a later unrelated one) if a
#   subprocess-spawning test is added without being marked AND listed here, and
#   reciprocally if a listed entry is stale. See docs/DEVELOPMENT.md § Mutation
#   testing.
# Note: mutmut 3.x does not support a `runner` key — use pytest_add_cli_args.
pytest_add_cli_args = [
  "--no-cov",
  "-x",
  # Spawn `python -m sumo_qa` (the full package → transitively imports the four
  # mutated modules via the server). Marker: `mutmut-subprocess-spawning`.
  "--ignore=tests/test_e2e_mcp_initialize.py",
  "--ignore=tests/test_tools_list_contract.py",
  # Spawns `python -m sumo_qa.installer`; installer imports the server path and
  # mutated modules transitively. Marker: `mutmut-subprocess-spawning`.
  "--ignore=tests/test_installer_mcp_binary.py",
  # Builds a wheel via a `pip wheel` subprocess; under mutmut the CWD is mutants/,
  # so the build would target the incomplete mutated tree. Marker:
  # `mutmut-subprocess-spawning`.
  "--ignore=tests/test_wheel_packaging.py",
  # Spawns `python -m sumo_qa.ingest` and a `python -c` subprocess that imports
  # the mutated knowledge_loaders.py. Marker: `mutmut-subprocess-spawning`.
  "--ignore=tests/test_ingest_source_free.py",
  # Spawns `python -m sumo_qa.doctor`; under mutmut this subprocess imports
  # trampoline-injected modules without MUTANT_UNDER_TEST. Marker:
  # `mutmut-subprocess-spawning`.
  "--ignore=tests/test_doctor.py",
]
tests_dir = ["tests/"]
# mutmut only copies paths_to_mutate modules into mutants/src/sumo_qa/, leaving the
# rest of the package absent. also_copy ensures the full src/ tree is mirrored into
# mutants/src/ (dirs_exist_ok=True) so the mutated files overwrite the originals
# while every other module (debug_capture, server, installer, …) stays importable.
# Resource directories (standards/, knowledge/, skills/, hooks/) are also copied
# because tests resolve them via `Path(__file__).resolve().parents[1]` which points
# to mutants/ when pytest runs from that CWD, so all data dirs must exist under
# mutants/ too.
also_copy = [
  "src/",
  "standards/",
  "knowledge/",
  "skills/",
  "hooks/",
  # plugin_packaging/ lives at the repo root (not under src/). Tests in
  # tests/test_plugin_packaging_*.py import it directly; without copying
  # it into the mutants/ mirror those tests fail to collect, mutmut's
  # `-x` aborts after the first failure, and the gate false-DROPs every
  # module. Not shipped in the wheel — mutmut-local-only, same as
  # `.claude/`.
  "plugin_packaging/",
  # tests/test_claude_hooks.py spawns the hook scripts via subprocess and
  # resolves their path relative to repo-root (which under mutmut is mutants/).
  # Without this entry, the first claude-hooks test fails on "No such file",
  # mutmut's -x aborts stats collection, and the gate reports false-DROPPED
  # for every module. NOT shipped in the wheel: Hatch reads only
  # [tool.hatch.build.targets.wheel.force-include], so this entry is
  # mutmut-local-only.
  ".claude/",
  # tests/test_release_please_config.py (added in #225) resolves
  # `Path(__file__).resolve().parents[1] / "release-please-config.json"`,
  # which under mutmut becomes `mutants/release-please-config.json`. Without
  # this entry the test FileNotFoundErrors during collection, mutmut's `-x`
  # aborts stats collection, and the pre-push mutmut hook fails on every
  # push whose delta touches any test file (the hook's regex matches all
  # of `tests/*.py`). Same root-level-resource pattern as `.claude/`.
  "release-please-config.json",
  # tests/test_report_html.py (#157) imports scripts/regen_report_snapshots.py
  # via `Path(__file__).resolve().parents[1] / "scripts"`, which under mutmut
  # becomes `mutants/scripts/`. Without this entry the module FileNotFoundErrors
  # during collection, mutmut's `-x` aborts stats collection, and the pre-push
  # mutmut hook fails on every push whose delta touches any test file. Same
  # root-level-resource pattern as `.claude/`. Not shipped in the wheel —
  # mutmut-local-only.
  "scripts/",
  # tests/test_server.py::test_copilot_instructions_enforce_qa_routing (added
  # in #240) resolves `Path(__file__).resolve().parent.parent / ".github" /
  # "copilot-instructions.md"`, which under mutmut becomes
  # `mutants/.github/copilot-instructions.md`. Without this entry the test
  # FileNotFoundErrors during collection, mutmut's `-x` aborts stats
  # collection, and the pre-push mutmut hook fails on every push whose delta
  # touches any test file. The whole dir is copied (not just the one file)
  # because mutmut copies dir entries verbatim but does not create parent
  # dirs for a nested-file entry. Same dir-copy pattern as `.claude/`.
  ".github/",
  # tests/test_marketplace_assets.py (added in #84) resolves
  # `Path(__file__).resolve().parents[1] / "assets"`, which under mutmut
  # becomes `mutants/assets/`. Without this entry T1 fails on the missing
  # icon, mutmut's `-x` aborts stats collection, and the pre-push mutmut
  # hook fails on every push whose delta touches any test file. Same
  # root-level-resource pattern as `release-please-config.json`. NOT
  # shipped in the wheel — mutmut-local-only.
  "assets/",
  # tests/test_install_wrapper.py (added in #158) resolves
  # `Path(__file__).resolve().parents[1] / "install.sh"` (and `install.ps1`)
  # and shells out to them, which under mutmut become
  # `mutants/install.sh` / `mutants/install.ps1`. Without these entries the
  # first install-wrapper test fails with exit 127 ("No such file"), mutmut's
  # `-x` aborts stats collection, and the pre-push mutmut hook fails on every
  # push whose delta touches any test file. Same root-level-resource pattern
  # as `release-please-config.json`. NOT shipped in the wheel — the wrapper
  # is a repo-root convenience script, mutmut-local-only here.
  "install.sh",
  "install.ps1",
  # tests/test_plugin_packaging_marketplace.py (added in #382) resolves
  # `REPO_ROOT / ".claude-plugin" / "marketplace.json"`, which under mutmut
  # becomes `mutants/.claude-plugin/marketplace.json`. Without this entry the
  # committed-output tests fail during collection, mutmut's `-x` aborts stats
  # collection, and the pre-push mutmut hook fails on every push whose delta
  # touches any test file. The whole dir is copied (the committed generated
  # plugin/marketplace JSON). Same root-level-resource pattern as `assets/`.
  # NOT mutated — mutmut-local mirror only.
  ".claude-plugin/",
]

# ---------------------------------------------------------------------------
# Plugin packaging — host-neutral canonical source
#
# Shared metadata (name, version, description, license, author, urls) lives
# in [project] and [project.urls] above. Do NOT duplicate those fields here.
# This overlay carries only plugin-specific metadata and host-shared content
# (MCP server entry, hook declarations) consumed by
# plugin_packaging.plugin_generator to emit .claude-plugin/plugin.json,
# .codex-plugin/plugin.json, .mcp.json, hooks/hooks.json, and
# hooks/hooks-codex.json.
# ---------------------------------------------------------------------------
[tool.sumo-qa.plugin]
display_name = "Sumo QA"
keywords = ["qa", "testing", "tdd", "mutation-testing", "mcp", "claude-code", "codex"]
# Marketplace copy (issue #84) — canonical here, propagated ONLY by the
# generator (snapshot + docs/host-adapters.md). short_description is capped
# at 200 chars by plugin_packaging.canonical; host manifests keep the
# [project] description as their `description`.
category = "testing"
short_description = "A QA-native MCP server and skills library: analyze a repo, map risks to tests and evidence, plan and scaffold tests, strengthen weak suites, and review diffs before merge with senior-QA discipline."
long_description = """\
Sumo QA packages a senior QA engineer's working discipline as an MCP server \
with a bundled skills library. It drives the QA loop end to end: analyze the \
repository to understand what it does, map named risks to the tests and \
evidence that would catch them, decide a grounded test approach, then do the \
work: test plans, TDD scaffolding, mutation-testing follow-up, test-data \
discovery, and pre-merge diff review.

Every recommendation cites a curated QA catalogue of principles, techniques, \
classifications, and approaches instead of improvised advice, so guidance \
stays consistent across hosts and models. It ships as a standard stdio MCP \
server: install with pip, wire it into a supported host with one command, \
and verify the setup with the bundled doctor."""

[tool.sumo-qa.plugin.mcp]
server_name = "sumo-qa"
# Anthropic's canonical pattern for plugin-bundled MCP servers (per
# https://code.claude.com/docs/en/mcp#plugin-provided-mcp-servers) uses
# the ${CLAUDE_PLUGIN_ROOT} substitution to resolve files inside the
# plugin's own folder. For Python plugins, uvx --from ${CLAUDE_PLUGIN_ROOT}
# builds and runs the Python package from that folder — the plugin is
# genuinely self-contained because the repo IS the plugin (pyproject.toml +
# src/sumo_qa/ + bundled standards/knowledge/skills/hooks/assets all live
# at the plugin root).
#
# Works identically in both install modes:
#   - claude --plugin-dir <local-repo>  → ${CLAUDE_PLUGIN_ROOT} = <local-repo>
#   - claude plugin install <name>      → ${CLAUDE_PLUGIN_ROOT} = the cache dir
#                                          (= the plugin folder which IS the repo)
#
# Users need `uv` (≥0.4) on PATH — documented prerequisite in
# docs/INSTALL.md, parallel to how `npx` is assumed for Node-based plugins
# per Anthropic's published MCP docs.
command = "uvx"
args = ["--from", "${CLAUDE_PLUGIN_ROOT}", "sumo-qa"]
transport = "stdio"

[tool.sumo-qa.plugin.mcp.env]
# Anthropic's Python-stdio MCP best practices recommend PYTHONUNBUFFERED=1
# so the server's JSON-RPC responses aren't held in a stdout buffer waiting
# for an explicit flush — keeps the handshake latency low and predictable.
PYTHONUNBUFFERED = "1"

[[tool.sumo-qa.plugin.hooks]]
event = "SessionStart"
script = "session-start"
trigger = "startup|clear|compact"
