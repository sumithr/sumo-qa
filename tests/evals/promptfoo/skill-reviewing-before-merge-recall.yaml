description: >
  Issue #754 - review-recall corpus: real past misses of
  sumo-qa-reviewing-before-merge, each a diff copied from the commit that
  carried the defect plus the green test run that shipped with it, and the
  finding a reviewer should have raised. Sources: the review-miss ledger (#752)
  entries that reproduce as a bounded diff, topped up with fixed findings from
  codex review comments on merged PRs. The score is recall, not a pass rate:
  a case is caught when the review names the defect file (asserts/
  recall-expected-file.js) AND the judge matches the defect and finds it
  treated as a merge blocker. Wording, format and ledger discipline are
  graded elsewhere and are deliberately not scored here. metadata.category is
  the ledger category and metadata.split is train or held-out: a category fix
  (#755-#759) is tuned on train and judged on held-out. Negative controls
  (category control) guard against a review that flags everything; they are
  reported apart from recall. Score runs with recall.py (see README "Review-
  recall corpus").
# local-tier: reasoning (SUMO_EVAL_BACKEND=local TIER=reasoning runs this config;
# it needs a reasoning-capable local candidate)
providers:
  - file://providers/claude-candidate.yaml
defaultTest:
  vars:
    skill_content: file://fixtures/assemble-review-skill.js
    review_modules: [runtime-scope, discovery-probes, coverage-ledger]
    loaded_classifications: file://../../../knowledge/classifications.md
    loaded_rules: file://../../../standards/rules/change_rules.yaml
    also_acceptable: ''
  assert:
    - type: javascript
      value: file://asserts/recall-expected-file.js
    - type: llm-rubric
      value: |
        **Expected finding:** {{expected_finding}}

        **Also acceptable as the catch:** {{also_acceptable}}

        **Expected shape:** {{expected_shape}}
  options:
    disableVarExpansion: true
    provider: file://providers/claude-judge.yaml
    rubricPrompt: >
      You are grading RECALL: did a code review independently find one specific
      real defect in a raw diff? No risks were named for the reviewer. Judge
      the substance of the finding, never its wording or format.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- SUPPLIED CONTEXT (what the reviewer was given) ---

      {{ground_truth_context}}

      --- END SUPPLIED CONTEXT ---


      --- LOADED CLASSIFICATIONS (catalogue the candidate was given) ---

      {{loaded_classifications}}

      --- END LOADED CLASSIFICATIONS ---


      --- LOADED RULES (catalogue the candidate was given) ---

      {{loaded_rules}}

      --- END LOADED RULES ---


      --- CANDIDATE REVIEW ---

      {{output}}

      --- END CANDIDATE REVIEW ---


      Grade two axes:


      A. DEFECT FOUND - the review names the same failure as the expected
         finding (or the also-acceptable one): the same mechanism on the same
         file and code path, in any words. A different defect in the same
         file, a generic "edge cases may exist", or a risk that merely sits
         near the defect without stating how it fails is NOT a catch.

      B. TREATED AS A BLOCKER - the review lets that finding stop the merge:
         the verdict is NOT SAFE TO MERGE or NEEDS WORK and the defect is
         among the reasons (a named risk, an uncovered or unproven ledger
         row, or a required fix). Mentioning it only as a residual concern or
         optional follow-up under a SAFE verdict is NOT a blocker.


      For a negative control (the expected finding says there is no defect),
      PASS only when the review raises no blocker and delivers SAFE TO MERGE.


      PASS only when A and B both hold. Ignore every other quality of the
      review: format, length, taxonomy labels, extra risks and confirmation
      questions do not change the grade.


      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<A, B, then verdict>"}
prompts:
  - |
    You are a senior QA agent in an IDE chat session. You have loaded this
    sumo-qa skill and MUST follow its discipline exactly as written:

    --- BEGIN SKILL ---
    {{skill_content}}
    --- END SKILL ---

    You have also loaded the canonical change classifications:

    --- LOADED CLASSIFICATIONS ---
    {{loaded_classifications}}
    --- END LOADED CLASSIFICATIONS ---

    ...and the team's change rules (keyed by classification):

    --- LOADED RULES ---
    {{loaded_rules}}
    --- END LOADED RULES ---

    Raw repository diff and fresh verification evidence for this turn. The risks
    have NOT been named or confirmed for you — you must discover them yourself
    from the raw diff. You have just read the diff and run the tests shown below.

    --- GROUND-TRUTH CONTEXT ---
    {{ground_truth_context}}
    --- END GROUND-TRUTH CONTEXT ---

    The developer just said:

    > {{user_prompt}}

    Apply the loaded skill. The developer has WAIVED the section-by-section
    confirmation gates and asked for a single-pass review: run the adversarial
    discovery pass yourself against the raw diff, name the concrete risks you
    discover (anchored to file:line), and deliver the verdict in this one turn —
    no confirmation question. Keep the response concise and evidence-led.
tests:
  - description: 'RECALL config-or-dependency - language-pack floor raised in pyproject but the pre-push
      hook''s mirrored constraint left at the old range (ledger #493, PR #492)'
    metadata:
      category: config-or-dependency
      split: train
      ledger_issue: 493
      source_pr: 492
      defect_commit: 10559ba2
      expected_file: pyproject.toml
    vars:
      review_modules:
      - runtime-scope
      - discovery-probes
      - coverage-ledger
      - inventory-drift
      user_prompt: Is this safe to merge?
      ground_truth_context: "## git diff\n```diff\ndiff --git a/pyproject.toml b/pyproject.toml\n@@ pyproject.toml:132-144\
