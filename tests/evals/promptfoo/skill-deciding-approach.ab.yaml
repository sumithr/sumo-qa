disableVarExpansion: true
description: 'A/B/C value-measurement for sumo-qa-deciding-approach'
providers:
  - file://{{ env.SUMO_EVAL_CANDIDATES_FILE | default('providers/cloud-cheap-candidate.yaml') }}
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-deciding-approach/SKILL.md
    classifications: file://../../../knowledge/classifications.md
    approaches: file://../../../knowledge/approaches.md
    principles: file://../../../knowledge/principles.md
  assert:
    - type: llm-rubric
      value: |
        **Expected routing for this seed:**
        - classification: {{expected_classification}}
        - approach: {{expected_approach}}
        - next_skill: {{expected_next_skill}}

        **Classification check:**
        The candidate's classification must equal `{{expected_classification}}`
        as a literal string match, including `n/a` when that is the expected
        value.

        **Approach check:**
        The candidate's approach must equal `{{expected_approach}}` as a literal
        string match, including `n/a` when that is the expected value.

        **Next-skill check:**
        The candidate's next-skill value must equal `{{expected_next_skill}}`.
        The canonical payload field per the router's contract is
        `next_action.skill` (sometimes called `next_skill` for brevity in
        this rubric — they refer to the SAME field). A response that emits
        `next_action: {skill: "X"}` and a response that emits
        `next_skill: "X"` are equivalent for grading; do NOT fail SHAPE
        because the candidate used the canonical `next_action.skill` form.
        If `{{expected_next_skill}}` is the literal string `none`, the candidate
        must STOP with no skill handoff; treat a STOP response as passing this
        check and any skill handoff as failing this check.

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        - Invents a classification not present in knowledge/classifications.md when expected_classification is not `n/a`.
        - Invents an approach not present in knowledge/approaches.md when expected_approach is not `n/a`.
        - Routes to any skill other than `{{expected_next_skill}}` when expected_next_skill is not `none`.
        - Routes to any skill when expected_next_skill is `none`; the correct behavior is STOP with no handoff.
        - Omits the expected classification `{{expected_classification}}` when exact classification matching is required.
        - Omits the expected approach `{{expected_approach}}` when exact approach matching is required.
        - Performs downstream TDD or test-writing work instead of returning the route.
  options:
    disableVarExpansion: true
    provider: file://{{ env.SUMO_EVAL_JUDGE_FILE | default('providers/cloud-quality-judge.yaml') }}
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response
      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      The complete catalogues loaded for this router decision are:


      --- LOADED CLASSIFICATIONS ---

      {{classifications}}

      --- END LOADED CLASSIFICATIONS ---


      --- LOADED APPROACHES ---

      {{approaches}}

      --- END LOADED APPROACHES ---


      --- LOADED PRINCIPLES ---

      {{principles}}

      --- END LOADED PRINCIPLES ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response include classification, approach, and
         next-skill routing? For this seed, the classification must be
         {{expected_classification}}, the approach must be
         {{expected_approach}}, and the next-skill value must be
         {{expected_next_skill}}. The canonical payload field for the
         next-skill value is `next_action.skill`; the rubric sometimes
         abbreviates this as `next_skill` — both refer to the SAME field
         and BOTH forms PASS SHAPE if the value matches. Do NOT FAIL SHAPE
         because the candidate emitted `next_action.skill` instead of a
         flat `next_skill` key. n/a is a valid expected value meaning "this
         routing slot doesn't apply" and the candidate must emit literal n/a to
         match.

      B. GROUNDING - classification and approach names must match catalogue
         entries verbatim unless the expected value is n/a. Verbatim catalogue
         wording is required for this internal router eval; do not penalize it
         as user-facing taxonomy.
         Invented or paraphrased names are GROUNDING FAIL.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - label: 'A0 — no skill, no catalogues'
    raw: |
      You are a senior QA agent in an IDE chat session.

      The developer just said:

      > {{user_prompt}}

      This is an isolation eval of the router's INTERNAL return value, not a
      user-facing response. Return only the routing decision consumed by the next
      skill: classification, approach, rationale, and next_action.skill. Do NOT
      write tests or execute downstream QA work. No confirmation question. No
      closing pleasantry.
  - label: 'A1 — catalogues only, no skill'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded the
      canonical catalogues the router must use:

      --- LOADED CLASSIFICATIONS ---
      {{classifications}}
      --- END LOADED CLASSIFICATIONS ---

      --- LOADED APPROACHES ---
      {{approaches}}
      --- END LOADED APPROACHES ---

      --- LOADED PRINCIPLES ---
      {{principles}}
      --- END LOADED PRINCIPLES ---

      The developer just said:

      > {{user_prompt}}

      This is an isolation eval of the router's INTERNAL return value, not a
      user-facing response. Return only the routing decision consumed by the next
      skill: classification, approach, rationale, and next_action.skill. Use
      verbatim catalogue names. Do NOT write tests or execute downstream QA work.
      No confirmation question. No closing pleasantry.
  - label: 'B — full skill (current)'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded this
      sumo-qa router skill and MUST follow its discipline exactly as written:

      --- BEGIN SKILL ---
      {{skill_content}}
      --- END SKILL ---

      You have also loaded the canonical catalogues the router must use:

      --- LOADED CLASSIFICATIONS ---
      {{classifications}}
      --- END LOADED CLASSIFICATIONS ---

      --- LOADED APPROACHES ---
      {{approaches}}
      --- END LOADED APPROACHES ---

      --- LOADED PRINCIPLES ---
      {{principles}}
      --- END LOADED PRINCIPLES ---

      The developer just said:

      > {{user_prompt}}

      This is an isolation eval of the router's INTERNAL return value, not a
      user-facing response. Return only the routing decision consumed by the next
      skill: classification, approach, rationale, and next_action.skill. Use
      verbatim catalogue names. Do NOT write tests or execute downstream QA work.
      No confirmation question. No closing pleasantry.
tests:
  - description: SEED - billing bug routes regression-first
    vars:
      user_prompt: >-
        I need to fix a billing bug and add some new tests for it
      expected_classification: business_logic_change
      expected_approach: regression-first
      expected_next_skill: sumo-qa-implementing-with-tdd
  - description: SEED - new-endpoint routes tdd-scaffold
    vars:
      user_prompt: >-
        I'm adding a new endpoint to expose subscription tier to the frontend — needs tests
      expected_classification: api_contract_change
      expected_approach: tdd-scaffold
      expected_next_skill: sumo-qa-implementing-with-tdd
  - description: SEED - mutation-survivors routes strengthen-test-coverage
    vars:
      user_prompt: >-
        Mutation testing flagged 8 survivors in our pricing module — production code is fine, the tests are weak
      expected_classification: test_change
      expected_approach: strengthen-test-coverage
      expected_next_skill: sumo-qa-strengthening-tests
  - description: SEED - readme-typos routes no-tests-recommended STOP
    vars:
      user_prompt: >-
        Fixing some typos in our README — anything I need to do test-wise?
      expected_classification: docs_change
      expected_approach: no-tests-recommended
      expected_next_skill: none
  - description: SEED - quarterly-qa-audit routes strategy-orchestration
    vars:
      user_prompt: >-
        Can you audit our test coverage across the repo and design where we should invest QA effort next quarter?
      expected_classification: n/a
      expected_approach: strategy-orchestration
      expected_next_skill: sumo-qa-strategising
  - description: SEED - playwright-e2e routes external-skill
    vars:
      user_prompt: >-
        We're adding end-to-end browser tests with Playwright for checkout — how should we approach this?
      expected_classification: n/a
      expected_approach: n/a
      expected_next_skill: sumo-qa-suggesting-external-skill
  - description: SEED - orphan script routes recommend-removal STOP
    vars:
      user_prompt: >-
        Help me write tests for ./install.sh — but heads-up, I just grepped
        and nothing in the repo references it: no CI workflow uses it, the
        README doesn't mention it, no other script invokes it, and the
        pyproject entry points don't point at it. Still want me to scaffold
        tests, or is there a better move?
      expected_classification: n/a
      expected_approach: recommend-removal
      expected_next_skill: none
