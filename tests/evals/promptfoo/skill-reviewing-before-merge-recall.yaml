        \ `start_byte`, `end_byte` — with `child(i)`\n+99        # still a method (#491). The wrapper targets\
        \ exactly that shape, and\n+100       # pyproject floors the extra at 1.12.5 because the earlier\
        \ bundled binding\n+101       # had the opposite, mutually exclusive shape (str-only method-style).\n\
        +102       # Assert the raw shapes here so any future flip fails with a precise\n+103       # message\
        \ instead of the import-edge layer silently emitting nothing.\n 104       root = parse(\"python\"\
        , _SNIPPET)\n-99        raw = root._node  # the underlying language-pack node\n-100       assert\
        \ callable(raw.kind)\n-101       assert callable(raw.child_count)\n-102       assert callable(raw.start_byte)\n\
        -103       assert callable(raw.end_byte)\n+105       raw = root._node  # the underlying tree_sitter.Node\n\
        +106       assert isinstance(raw.type, str)\n+107       assert isinstance(raw.child_count, int)\n\
        +108       assert isinstance(raw.start_byte, int)\n+109       assert isinstance(raw.end_byte, int)\n\
        +110       assert callable(raw.child)\n+111       assert not hasattr(raw, \"kind\")\n 112   \n 113\
        \   \n 114   def test_text_recovered_by_byte_slice():\n-107       # The binding carries no `.text`;\
        \ the wrapper recovers source text from the\n-108       # node's byte range. Assert a known dotted\
        \ name round-trips.\n+115       # The wrapper recovers source text by slicing the normalized bytes\
        \ the\n+116       # parser saw via the node's byte range (it deliberately does not use the\n+117\
        \       # raw node's own `.text` — the slice is what #458 pins the alignment\n+118       # invariant\
        \ on). Assert a known dotted name round-trips.\n 119       root = parse(\"python\", _SNIPPET)\n\
        \ 120       dotted = [n for n in root.descendants() if n.kind == \"dotted_name\"]\n 121       texts\
        \ = {n.text for n in dotted}\n```\n\n## Repo state the operator should know about\n```text\n$ grep\
        \ -rn \"tree-sitter-language-pack\" --include='*.yaml' --include='*.yml' --include='*.toml' --include=Dockerfile\
        \ . | grep -v tests/evals\n.pre-commit-config.yaml:265:          - \"tree-sitter-language-pack>=1.8,<2\"\
        \npyproject.toml:132:# `tree-sitter-language-pack` ships one abi3 wheel bundling ~165 grammars with\n\
        pyproject.toml:141:  \"tree-sitter-language-pack>=1.12.5,<2\",\n\n$ sed -n 257,266p .pre-commit-config.yaml\n\
        \          # The [treesitter] optional extra (kept in sync with the `treesitter`\n          # extra\
        \ in pyproject.toml). The pre-push suite must install it so the\n          # repo_map_treesitter\
        \ binding-contract test runs instead of skipping;\n          # otherwise repo_map_treesitter.py\
        \ never reaches full coverage and the\n          # 100% gate fails locally. Mirrors the CI pytest\
        \ matrix, which installs\n          # the extra. Prebuilt Linux/macOS/Windows wheels, no compiler\
