<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumo-qa logo, line-art variant">
  <title>sumo-qa — line-art logo</title>
  <g fill="none" stroke="#0f0f0f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- chonmage (top knot) -->
    <path d="M100 24 L100 14" />
    <path d="M93 17 L107 17" />
    <!-- head -->
    <circle cx="100" cy="42" r="15" />
    <!-- shoulders & torso (broad oval) -->
    <path d="M64 78 Q60 100 70 130 Q85 148 100 148 Q115 148 130 130 Q140 100 136 78 Q120 64 100 64 Q80 64 64 78 Z" />
    <!-- mawashi (belt) -->
    <line x1="68" y1="118" x2="132" y2="118" stroke-width="6" />
    <!-- arms hanging in stance -->
    <path d="M64 92 Q52 110 56 132" />
    <path d="M136 92 Q148 110 144 132" />
    <!-- legs in shiko stance (low, wide) -->
    <path d="M84 148 Q70 168 60 184" />
    <path d="M116 148 Q130 168 140 184" />
    <!-- ground line -->
    <line x1="40" y1="186" x2="160" y2="186" stroke-width="2" />
  </g>
</svg>
