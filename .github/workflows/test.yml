name: tests

# Avoid double-runs on every push to a PR branch:
#   - `push: branches: [main]` — only main pushes trigger the push event
#     (covers merges + direct main commits).
#   - `pull_request: branches: [main]` — PR opens/updates trigger here
#     (covers all feature-branch development).
# Push to a feature branch with an open PR → only pull_request fires, once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimum-required token scope. The test job only checks out the repo and
# runs pytest against it — no write actions. Satisfies CodeQL's "workflow
# does not contain permissions" lint.
permissions:
  contents: read

# Cancel in-progress runs when a new push lands on the same ref.
# Saves CI minutes during rapid iteration; the latest commit always gets the
# definitive run. Uses `github.ref` (GitHub-computed, not attacker-supplied)
# so per-PR concurrency buckets stay distinct without exposing branch-name
# injection risk in the grouping key.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # The `treesitter` extra is installed across the whole 3-OS x 5-Python
        # matrix so the import-edge layer (#354) is exercised on Linux, macOS,
        # and Windows (its prebuilt wheels are validated on each here), and so
        # the 100% coverage gate sees the tree-sitter code paths. The graceful-
        # degradation path (extra absent) is covered deterministically in every
        # run by the monkeypatched tests in tests/test_repo_map_imports.py, so a
        # separate extra-free job isn't needed to prove it.
        run: python -m pip install -e ".[dev,vertex,treesitter]"

      - name: Run pytest
        run: python -m pytest --cov=src/sumo_qa --cov-fail-under=100 -q
