<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumo-qa logo, geometric variant">
  <title>sumo-qa — geometric logo</title>
  <!-- circular dohyo (ring) -->
  <circle cx="100" cy="100" r="92" fill="#fef3c7" stroke="#d97706" stroke-width="3" />
  <!-- abstract sumo: two stacked filled shapes + sash -->
  <!-- head -->
  <circle cx="100" cy="58" r="22" fill="#0f0f0f" />
  <!-- chonmage accent -->
  <rect x="96" y="34" width="8" height="8" rx="2" fill="#dc2626" />
  <!-- body (broad rounded form, suggests bulk) -->
  <ellipse cx="100" cy="128" rx="56" ry="46" fill="#0f0f0f" />
  <!-- mawashi (sash) -->
  <rect x="44" y="145" width="112" height="12" fill="#dc2626" />
  <!-- belt knot detail -->
  <circle cx="100" cy="151" r="5" fill="#fef3c7" />
</svg>
