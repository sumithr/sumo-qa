name: release

on:
  push:
    tags:
      - "v*"
  # Dry run from any branch: build, attest and verify without publishing.
  # The publish and release-assets jobs only run for a tag push.
  workflow_dispatch:

# Minimum-required default token scope; each job below widens only what it
# needs. Satisfies CodeQL's "workflow does not contain permissions" lint.
permissions:
  contents: read

jobs:
  # Builds from the hashed lock alone and fixes the package digests in
  # build-info.json before anything unhashed is installed anywhere.
  build:
    name: Build and record
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No pip cache: this job installs only the hashed lock below.
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Every package here is pinned with hashes in the lock, and the build
      # runs with --no-isolation, so this environment is the complete set of
      # build inputs. build-info.json records it.
      - name: Install pinned build tools
        run: python -m pip install --require-hashes -r .github/release/requirements.txt

      - name: Build wheel + sdist
        run: python -m build --no-isolation

      - name: Record build info and package digests
        run: python scripts/release_evidence.py record dist

      # Every later job takes the package bytes from this artifact.
      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: dist/
          if-no-files-found: error

  # Installs the wheel's dependencies from PyPI without hashes, so this job
  # gets no signing permissions and uploads only the SBOM: the package bytes
  # on this runner never leave it.
  sbom:
    name: SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # cyclonedx-py comes from the hashed lock.
      - name: Install pinned build tools
        run: python -m pip install --require-hashes -r .github/release/requirements.txt

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: packages/

      # CycloneDX SBOM of the dependency set installing the wheel resolves on
      # this runner (Linux, CPython 3.13), in a throwaway venv. cyclonedx-py
      # validates the document against the schema before writing. No
      # --output-reproducible: it drops the serialNumber, and actions/attest
      # rejects a CycloneDX SBOM without one.
      - name: Generate SBOM
        run: |
          python -m venv --without-pip "$RUNNER_TEMP/sbom-env"
          python -m pip --python "$RUNNER_TEMP/sbom-env/bin/python" install packages/*.whl
          mkdir sbom
          cyclonedx-py environment --pyproject pyproject.toml --mc-type library \
            --of JSON -o sbom/sbom.cdx.json \
            "$RUNNER_TEMP/sbom-env/bin/python"

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/sbom.cdx.json
          if-no-files-found: error

  # Gates first, then signs: bad bytes never get a permanent attestation.
  attest:
    name: Verify, then attest provenance and SBOM
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Sigstore signing certificate for the attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # The packages and build-info.json from the build job; the SBOM job
      # contributes only sbom.cdx.json.
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: packages
          path: dist/

      - name: Download SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: dist/

      - name: Write SHA256SUMS
        run: python scripts/release_evidence.py sums dist

      # Fails unless every package matches the digest the build job recorded.
      - name: Verify digests, SBOM and build info
        run: python scripts/release_evidence.py verify dist --commit "$GITHUB_SHA"

      # SLSA build provenance for every file SHA256SUMS lists.
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: dist/sbom.cdx.json

      # The one release artifact: verify, PyPI and the GitHub release all
      # take their bytes from it.
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: dist/
          if-no-files-found: error

  verify:
    name: Verify attestations
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist/

      # Fails on any file without a provenance attestation from this
      # workflow, commit and ref, and on a package without an SBOM attestation.
      - name: Verify attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" \
              --deny-self-hosted-runners "${@:2}"
          }
          for f in dist/*; do
            [ "${f##*/}" = SHA256SUMS ] || check "$f"
          done
          for f in dist/*.whl dist/*.tar.gz; do
            check "$f" --predicate-type https://cyclonedx.org/bom
          done

  publish:
    name: Publish to PyPI
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted publishing; the action also uploads PEP 740 attestations.
      id-token: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: release-files/

      # The verified bytes; PyPI takes only the packages, from dist/.
      - name: Select the packages
        run: mkdir dist && mv release-files/*.whl release-files/*.tar.gz dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  release-assets:
    name: Attach release files to the GitHub release
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist/

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
