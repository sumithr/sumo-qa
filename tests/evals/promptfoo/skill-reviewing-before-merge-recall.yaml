        +32     def importers_from_repo_map(edges: Iterable[RepoMapEdge]) -> dict[str, set[str]]:

        +33         """Project #353 repo-map ``imports`` edges into ``importers_by_imported``.

        +34

        +35         The repo-map records an ``imports`` edge as ``source imports target`` with

        +36         ``file:``-prefixed node ids. :func:`impacted_symbols_via_imports` instead

        +37         keys on the INVERSE (imported path -> the set of importer paths) with plain

        +38         paths, and nothing else projected one into the other, so a caller consuming a

        +39         real ``.sumo-qa/repo-map.json`` would silently reach no importer. This bridges

        +40         them: for each ``imports`` edge the ``target`` (imported) path collects the

        +41         ``source`` (importer) path, both stripped of the ``file:`` prefix. Non-

        +42         ``imports`` edges are ignored.

        +43         """

        +44         importers: dict[str, set[str]] = {}

        +45         for edge in edges:

        +46             if edge.type != "imports":

        +47                 continue

        +48             importer = _strip_file_prefix(edge.source)

        +49             imported = _strip_file_prefix(edge.target)

        +50             importers.setdefault(imported, set()).add(importer)

        +51         return importers

        +52

        +53

        +54     def _strip_file_prefix(node_id: str) -> str:

        +55         """The repo-relative path behind a ``file:``-prefixed node id.

        +56

        +57         ``str.removeprefix`` leaves an already-plain id untouched, so a node id

        +58         without the prefix passes through unchanged."""

        +59         return node_id.removeprefix(_FILE_NODE_PREFIX)

