name: release-please

on:
  push:
    branches:
      - main

# Minimum-required token scope at workflow level. Individual jobs that
# need write scope (contents: write for the release commit; pull-requests:
# write for opening the release PR) declare it on the job. CodeQL's
# "workflow does not contain permissions" lint is satisfied by this
# top-level declaration.
permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use a PAT rather than the default GITHUB_TOKEN so that the
          # release PR triggers required status checks (pytest matrix,
          # ruff). GITHUB_TOKEN-created PRs don't fire pull_request
          # workflows on themselves, which leaves the PR permanently
          # blocked by branch protection.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      # release-please-config.json updates the version-bearing generated
      # JSON snapshots in the first release PR commit. The generators still
      # run here to refresh the SHA256 sidecar, synchronize the marketplace
      # preview version, and catch any other generated drift before auto-merge.
      #
      # We check out the release branch via actions/checkout (which sets
      # up git auth correctly for the later push), run the generator,
      # and push the regen as a follow-up commit on the same branch.
      - name: Checkout release PR branch
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@v7
        with:
          ref: ${{ (steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName) || '' }}
          # PAT so the follow-up push triggers required status checks
          # on the release PR (same reasoning as the action's `token:`).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        if: ${{ steps.release.outputs.pr }}
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate version-bearing assets
        if: ${{ steps.release.outputs.pr }}
        env:
          # Read action outputs via env to avoid inline ${{ }} expansion
          # in run: blocks (workflow-injection-safe pattern).
          HEAD_BRANCH: ${{ (steps.release.outputs.pr && fromJSON(steps.release.outputs.pr).headBranchName) || '' }}
        run: |
          set -euo pipefail
          python -m pip install --quiet -e ".[dev]"
          python -m plugin_packaging.plugin_generator sync
          python scripts/generate_marketplace_assets.py version
          if git diff --quiet; then
            echo "Generated output already matches the bumped version — nothing to commit."
            exit 0
          fi
          git config user.name  "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git add .claude-plugin .codex-plugin .mcp.json hooks/hooks.json \
                  hooks/hooks-codex.json docs/host-adapters.md \
                  src/sumo_qa/_data/plugin_metadata.json \
                  plugin_packaging/generated/manifest.json \
                  assets/preview-doctor.txt assets/preview-doctor.svg
          git commit -m "chore(packaging): regenerate version-bearing assets"
          git push origin "HEAD:${HEAD_BRANCH}"

      # Auto-merge the release PR. release-please authors it as the repo owner
      # (RELEASE_PLEASE_TOKEN). The "Protect main" ruleset requires a code-owner
      # approval, which the owner cannot give their own PR — so the normal merge
      # path is permanently "approval required". The PAT is an always-bypass
      # actor on that ruleset, so `--admin` merges past it. --admin ALSO bypasses
      # required status checks, so we wait for those to pass first to avoid
      # shipping a red release. Collaborators' PRs are untouched and still need
      # the owner's review.
      - name: Merge the release PR once required checks pass
        if: ${{ steps.release.outputs.pr }}
        timeout-minutes: 60
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Read action outputs via env to avoid inline ${{ }} expansion
          # in run: blocks (workflow-injection-safe pattern).
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -uo pipefail
          PR=$(jq -r '.number' <<<"$RELEASE_PR_JSON")
          [ -n "$PR" ] && [ "$PR" != "null" ] || { echo "::error::could not read release PR number"; exit 1; }

          # Wait for the release PR's REQUIRED checks to finish, then merge.
          # `gh pr checks --required --watch --fail-fast` blocks until every
          # required check completes and exits non-zero on the first failure.
          # Its one quirk: in the seconds right after release-please (and the
          # regen step) push the PR head, no check runs exist yet, so it exits
          # immediately printing "no checks reported". Retry ONLY that transient
          # case — doing the watch in one call (not a separate registration
          # poll) closes the race where the head changes between two calls.
          # Any other non-zero exit is a genuine check failure and stops here.
          checks_green=""
          for attempt in $(seq 1 30); do
            if out=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" \
                       --required --watch --fail-fast --interval 30 2>&1); then
              echo "$out"
              checks_green=1
              break
            fi
            if grep -qiE "no (required )?checks reported" <<<"$out"; then
              echo "Required checks not registered on PR #$PR yet (attempt ${attempt}/30) — waiting…"
              sleep 15
              continue
            fi
            echo "$out" >&2
            echo "::error::A required check failed on release PR #$PR — not merging."
            exit 1
          done
          [ "$checks_green" = 1 ] || { echo "::error::required checks never registered on release PR #$PR"; exit 1; }

          # All required checks are green — bypass-merge as the owner PAT.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --admin --delete-branch
