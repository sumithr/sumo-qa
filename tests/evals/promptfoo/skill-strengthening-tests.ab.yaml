        - Treats M9 as an ordinary assertion gap or as an equivalent mutant without flagging that the original code contradicts the acceptance criterion.
        - Delivers a test expecting `true` at 5000 pence as the M9 strengthening test to add in this flow (it fails against the unchanged production code and turns the suite red) instead of handing the defect to a separate regression-first fix.
