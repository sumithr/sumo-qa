disableVarExpansion: true
description: 'A/B/C value-measurement for sumo-qa-strengthening-tests'
providers:
  - file://{{ env.SUMO_EVAL_CANDIDATES_FILE | default('providers/cloud-cheap-candidate.yaml') }}
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-strengthening-tests/SKILL.md
    loaded_techniques: file://../../../knowledge/techniques.md
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider: file://{{ env.SUMO_EVAL_JUDGE_FILE | default('providers/cloud-quality-judge.yaml') }}
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response
      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      The candidate has loaded the techniques catalogue below for your
      verification:


      --- LOADED TECHNIQUES ---

      {{loaded_techniques}}

      --- END LOADED TECHNIQUES ---


      The per-test mutant context supplied to the candidate was:


      --- SURVIVING MUTANT DESCRIPTION ---

      {{surviving_mutant_description}}

      --- END SURVIVING MUTANT DESCRIPTION ---


      --- CURRENT TEST CODE ---

      {{current_test_code}}

      --- END CURRENT TEST CODE ---


      --- SURROUNDING PRODUCTION CODE ---

      {{surrounding_production_code}}

      --- END SURROUNDING PRODUCTION CODE ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response demonstrate the expected shape concretely?
         Real mutants should produce a strengthening test artefact anchored to
         the discriminating input. Equivalent mutants should be suppressed in
         the supplied tool config with a rationale, and should not produce test
         code.

      B. GROUNDING - the response must visibly use the supplied mutant
         description, current test code, and surrounding production code. For a
         real boundary mutant, the proposed test must pin the exact boundary
         value that distinguishes the original from the mutant. For an
         equivalent mutant, the response must explain why no observable test can
         distinguish the original from the mutant and must use the supplied
         config-side suppression surface. Named techniques for real mutants
         must appear in the loaded techniques catalogue.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - label: 'A0 - no skill, no catalogues'
    raw: |
      You are a senior QA agent in an IDE chat session.

      Mutation survivor and code context for this turn:

      --- SURVIVING MUTANT DESCRIPTION ---
      {{surviving_mutant_description}}
      --- END SURVIVING MUTANT DESCRIPTION ---

      --- CURRENT TEST CODE ---
      {{current_test_code}}
      --- END CURRENT TEST CODE ---

      --- SURROUNDING PRODUCTION CODE ---
      {{surrounding_production_code}}
      --- END SURROUNDING PRODUCTION CODE ---

      The developer just said:

      > {{user_prompt}}

      This is the final-turn strengthening proposal. Decide whether the
      survivor is a real assertion gap or an equivalent mutant.

      For a real mutant, produce this response format:

      Line 1 (mutant surface anchor): `<mutant id>: \`<original expression>\` -> \`<mutated expression>\` - <one-word descriptor>.`
      Line 2 (applied technique): `Applying <technique name>:` then one sentence rationale tying technique to the mutant shape.
      Line 3 (target test file path): `Target test file: \`<path>\``
      Then: the failing test code block (fenced, complete function definition).
      Last line: `Production code stays unchanged.`

      For an equivalent mutant, produce this response format:

      Line 1 (mutant surface anchor): `<mutant id>: \`<original expression>\` -> \`<mutated expression>\` - equivalent mutant.`
      Line 2: `No strengthening test:` then one sentence explaining why the original and mutant are observably equivalent.
      Line 3: `Suppress in tool config: \`<path>\``
      Then: the config-side suppression snippet (fenced).
      Last line: `Production code stays unchanged.`

      NO confirmation question. NO closing pleasantry. NO additional sections.
      Equivalent mutants MUST be suppressed in tool config, not killed by a
      tautological test.
