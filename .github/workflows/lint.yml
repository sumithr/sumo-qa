name: lint

# Same de-dupe pattern as tests.yml — push only on main, pull_request for
# everything else, plus concurrency cancel for rapid iteration. See
# .github/workflows/test.yml for the full rationale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  shellcheck:
    name: shellcheck
    # CI mirror of the shellcheck-py pre-commit hook so a contributor who
    # skipped `pre-commit install` still gets the same enforcement.
    # ubuntu-latest ships shellcheck preinstalled — no extra install step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: shellcheck hooks/session-start
