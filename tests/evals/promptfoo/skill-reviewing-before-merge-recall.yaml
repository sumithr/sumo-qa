        +27     from __future__ import annotations

        +28

        +29     import re

        +30

        +31     # ``+++ b/path`` (or ``+++ path``) names the new-side file; ``git`` prefixes with

        +32     # ``b/`` and may append a tab-separated timestamp, both stripped below. Consulted

        +33     # only OUTSIDE a hunk: inside a hunk ``+++ x`` is an added content line.

        +34     _NEW_FILE_RE = re.compile(r"^\+\+\+ (?:b/)?(.*?)(?:\t.*)?$")

        +35     # ``@@ -old[,len] +new[,len] @@``: capture the new-side start line.

        +36     _HUNK_RE = re.compile(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@")

        +37     # ``git`` file-section separator: it always begins a new file''s header block and

        +38     # can never be hunk content (every content line carries a ``+``/``-``/`` ``/``\``

        +39     # prefix), so it definitively ends any hunk in progress and returns us to the

        +40     # header region where the following ``+++ `` line is the new-file header.

        +41     _DIFF_GIT_PREFIX = "diff --git "

        +42

        +43

        +44     def changed_lines_from_unified_diff(diff_text: str) -> dict[str, set[int]]:

        +45         """New-side changed line numbers per file path from a unified diff.

        +46

        +47         Returns ``{path: {line, ...}}`` for every non-deleted file the diff touched:

        +48         each added line''s new-side number plus a deletion-seam line for each removed

        +49         line (so removing logic inside a surviving symbol stays visible).

        +50         Deterministic; empty when the diff changes nothing.

        +51         """

        +52         changed: dict[str, set[int]] = {}

        +53         current_path: str | None = None

        +54         new_line = 0

        +55         in_hunk = False

        +56         for raw in diff_text.splitlines():

        +57             if raw.startswith(_DIFF_GIT_PREFIX):

        +58                 # A new file section: leave any hunk and wait for its +++ header.

        +59                 in_hunk = False

        +60                 current_path = None

        +61                 continue

        +62             hunk_match = _HUNK_RE.match(raw)

        +63             if hunk_match is not None:

        +64                 new_line = int(hunk_match.group(1))

        +65                 in_hunk = True

        +66                 continue

        +67             if not in_hunk:

        +68                 # Header region (before the first hunk, or after a diff --git): the

        +69                 # only line we act on is the +++ new-file header.

        +70                 new_match = _NEW_FILE_RE.match(raw)

        +71                 if new_match is not None:

        +72                     path = new_match.group(1)

        +73                     # A file removed entirely has no new-side path to record against.

        +74                     current_path = None if path == "/dev/null" else path

        +75                 continue

        +76             if current_path is None:

        +77                 continue  # inside a deleted (/dev/null) file: nothing to attribute

        +78             if raw.startswith("+"):

        +79                 # An added line, including ``+++ x`` (content ``++ x``), which the

        +80                 # header region would have mis-read as a file switch.

        +81                 changed.setdefault(current_path, set()).add(new_line)

        +82                 new_line += 1

        +83             elif raw.startswith("-"):

        +84                 # A removed line has no new-side line of its own; the deletion sits

        +85                 # BETWEEN new-side lines (new_line - 1) and new_line. Record both

        +86                 # sides of that seam (without advancing): new_line alone points at

        +87                 # the next surviving line, which is the FOLLOWING symbol''s def when

        +88                 # the deleted line was the last statement of a function. Attributing

        +89                 # both sides guarantees the enclosing symbol is touched, at the cost

        +90                 # of sometimes also flagging the neighbour (over-attribution beats

        +91                 # an invisible change for QA evidence).

        +92                 # Clamp to line 1: a zero-length new side at the start of a file

        +93                 # (git emits `@@ -1 +0,0 @@` for a -U0 first-line deletion) sets

        +94                 # new_line to 0, which no 1-based symbol span can match.

        +95                 lines = changed.setdefault(current_path, set())

        +96                 lines.add(max(new_line, 1))

        +97                 if new_line > 1:

        +98                     lines.add(new_line - 1)

        +99             elif raw.startswith("\\"):

        +100                 # "\ No newline at end of file" is metadata, not a content line.

        +101                 continue

        +102             else:

        +103                 # A context line (leading space) exists on both sides; advance the

        +104                 # new-side counter without recording it as changed.

        +105                 new_line += 1

        +106         return changed


