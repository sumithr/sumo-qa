name: AI task
description: Structured implementation task for AI-created issues
title: "[Task]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What needs to change and why?
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected outcome
      description: What should be true when this is done?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Files, modules, workflows, behavior, or docs likely affected.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Concrete checks that define completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: Test plan
      description: Commands or manual checks expected before closing.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Related issues, links, logs, prior decisions, constraints, or examples.
    validations:
      required: false
