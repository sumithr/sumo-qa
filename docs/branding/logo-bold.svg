<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="sumo-qa logo, bold mark with QA tie-in">
  <title>sumo-qa — bold logo (Q in the mawashi)</title>
  <!-- solid black sumo silhouette in shiko stance -->
  <g fill="#0f0f0f">
    <!-- chonmage -->
    <rect x="96" y="20" width="8" height="14" rx="2" />
    <!-- head -->
    <circle cx="100" cy="48" r="18" />
    <!-- broad torso, shaped to suggest stance -->
    <path d="M62 80
             Q56 100 58 132
             Q62 162 80 180
             L120 180
             Q138 162 142 132
             Q144 100 138 80
             Q120 66 100 66
             Q80 66 62 80
             Z" />
    <!-- arms tucked in shiko stance -->
    <ellipse cx="56" cy="108" rx="10" ry="22" />
    <ellipse cx="144" cy="108" rx="10" ry="22" />
  </g>
  <!-- mawashi belt as a horizontal band carrying a "Q" -->
  <g>
    <rect x="58" y="120" width="84" height="20" fill="#dc2626" />
    <!-- Q glyph centred on the belt -->
    <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="22">
      <text x="100" y="138" text-anchor="middle">Q</text>
    </g>
  </g>
</svg>
