disableVarExpansion: true
description: >
  Issue #332 — A0/A1 control proving the verifier-evidence discipline is
  LOAD-BEARING. The SAME seed (an eval-surface skill change with green per-file
  review + green codex + green CI, but the promptfoo eval was NEVER run with
  Node 24 + the key) runs against the PRE-EDIT (origin/main) SKILL.md body (A0)
  and the post-#332 body (A1). A0 lacks the step-9 "Verification-evidence
  discipline" block — it has no rule treating a MISSING relevant surface-specific
  verifier as a SAFE-blocker, so with the suite/CI green and risks plausibly
  covered it returns SAFE (or fails to name the unrun promptfoo eval as a
  blocker) — a SHAPE FAIL under the rubric. A1 (the new body) classifies the
  unrun verifier UNVERIFIED (surface verifier) and delivers NOT SAFE. The
  A0(FAIL) -> A1(PASS) lift isolates the #332 behaviour, not pre-existing
  risk-coverage handling. A0 body is snapshotted at
  fixtures/reviewing-before-merge-PRE-332.SKILL.md (= origin/main before the #332
  commit); refresh it if the baseline moves.
providers:
  - id: openai:chat:gpt-5-mini
    label: candidate-gpt-5-mini
    config:
      temperature: 0.0
      seed: 42
defaultTest:
  vars:
    skill_content_new: file://../../../skills/sumo-qa-reviewing-before-merge/SKILL.md
    skill_content_old: file://fixtures/reviewing-before-merge-PRE-332.SKILL.md
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0.0
        seed: 42
        response_format:
          type: json_object
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate treated a
      MISSING relevant surface-specific verifier as a SAFE-blocker instead of
      returning SAFE on green review + green CI, AND avoided the named
      anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE - the change is an eval-surface skill edit. The load-bearing
         behaviour this control isolates is the SURFACE-VERIFIER GATE: the
         candidate MUST invoke the rule that an eval-surface skill change REQUIRES
         its relevant promptfoo eval to have RUN with Node 24 + the configured key
         as a PRECONDITION for SAFE — a verifier-evidence requirement that holds
         REGARDLESS of whether any individual risk is separately uncovered — and
         classify the unrun eval UNVERIFIED (surface verifier), then deliver NOT
         SAFE TO MERGE. Reaching NOT SAFE ONLY because "R1 is an uncovered risk"
         (the generic uncovered-risk path), WITHOUT invoking the surface-verifier
         requirement that the promptfoo eval itself must have run, is NOT
         sufficient — it is the pre-#332 shape. SHAPE FAILS if it declares SAFE on
         green review/codex/CI, reaches NOT SAFE only via generic uncovered-risk
         reasoning without invoking the required-verifier-must-run gate, or treats
         green CI as covering the changed grading behaviour.

      B. GROUNDING - it must (a) state that BECAUSE this is an eval-surface skill
         change the promptfoo eval is the REQUIRED verifier that must have run with
         Node 24 + the configured key, (b) name the specific unrun eval, and (c)
         note CI does not run promptfoo (no Node 24 + key run exists). A verdict
         that never ties the requirement to the eval-surface nature of the change,
         or never names the required-but-unrun verifier -> GROUNDING FAIL.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT.


      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - label: 'A0 - PRE-332 body (control, expected FAIL)'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded this
      sumo-qa skill and MUST follow its discipline exactly as written:

      --- BEGIN SKILL ---
      {{skill_content_old}}
      --- END SKILL ---

      Repository diff, prior review gates, and fresh verification evidence for
      this turn:

      --- GROUND-TRUTH CONTEXT ---
      {{ground_truth_context}}
      --- END GROUND-TRUTH CONTEXT ---

      The developer just said:

      > {{user_prompt}}

      Apply the loaded skill. The developer has WAIVED the section-by-section
      confirmation gates and asked for a single-pass verdict. Deliver the verdict
      in this one turn — no confirmation question. Keep the response concise and
      evidence-led.
  - label: 'A1 - post-332 body (new, expected PASS)'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded this
      sumo-qa skill and MUST follow its discipline exactly as written:

      --- BEGIN SKILL ---
      {{skill_content_new}}
      --- END SKILL ---

      Repository diff, prior review gates, and fresh verification evidence for
      this turn:

      --- GROUND-TRUTH CONTEXT ---
      {{ground_truth_context}}
      --- END GROUND-TRUTH CONTEXT ---

      The developer just said:

      > {{user_prompt}}

      Apply the loaded skill. The developer has WAIVED the section-by-section
      confirmation gates and asked for a single-pass verdict. Deliver the verdict
      in this one turn — no confirmation question. Keep the response concise and
      evidence-led.
tests:
  - description: SEED missing-verifier — eval-surface skill change, green review + codex + CI, promptfoo eval NEVER run with Node 24 + key
    vars:
      user_prompt: >-
        Is this safe to merge? Per-file review came back clean, codex was clean,
        and CI is fully green.
      ground_truth_context: |
        ## Prior review gates
        Scope gate: completed. The diff edits one file —
        skills/sumo-qa-reviewing-before-merge/SKILL.md — adding a new
        external-contract risk class to the discovery sweep (a behaviour change
        to how the skill grades reviews). It also adds a new promptfoo eval,
        tests/evals/promptfoo/skill-reviewing-before-merge-external-contract.yaml.
        Risk gate: completed. The developer confirmed:
        R1 — the new external-contract grading branch could over- or under-fire;
        its behaviour is only observable when the eval that exercises it runs.

        ## git diff
        ```diff
        diff --git a/skills/sumo-qa-reviewing-before-merge/SKILL.md b/skills/sumo-qa-reviewing-before-merge/SKILL.md
        @@ +47 lines: new external-contract probe + coverage-ledger rule @@
        diff --git a/tests/evals/promptfoo/skill-reviewing-before-merge-external-contract.yaml b/...
        @@ +120 lines: new eval, two seeds @@
        ```

        ## Verification evidence available this turn
        - Per-file sumo-qa review of the SKILL.md diff: SAFE.
        - Codex adversarial pass: clean.
        - CI: all required checks green (lint, pytest, token-budget).
        - The promptfoo eval skill-reviewing-before-merge-external-contract.yaml
          was NOT run. (CI does not run promptfoo — these evals are not in CI.)
          No record of any promptfoo run with Node 24 + the OpenAI key for this
          change.
      expected_shape: >-
        Evidence-led verdict that recognises the changed surface (the SKILL.md
        grading behaviour) has a REQUIRED verifier — the promptfoo eval
        skill-reviewing-before-merge-external-contract.yaml — that was NEVER run
        with Node 24 + the configured OpenAI key this turn, and that green
        per-file review + green codex + green CI do NOT exercise the changed
        grading behaviour (CI does not run promptfoo). Classifies it UNVERIFIED
        (surface verifier) and delivers NOT SAFE TO MERGE pending the promptfoo
        eval running correctly. Names the unrun eval. Ends without a confirmation
        question.
      anti_patterns:
        - Declares SAFE TO MERGE on the strength of green per-file review / codex / CI.
        - Treats green CI as covering the changed grading behaviour even though CI does not run promptfoo.
        - Never names the promptfoo eval as the required-but-unrun verifier.
        - Proposes clearing the blocker by skipping the eval or loosening the rubric instead of running the eval.
        - Ends with a confirmation/clarifying question in place of the verdict (prescribed remediation steps after a delivered verdict are NOT this anti-pattern).
