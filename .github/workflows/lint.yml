name: lint

# Same de-dupe pattern as tests.yml — push only on main, pull_request for
# everything else, plus concurrency cancel for rapid iteration. See
# .github/workflows/test.yml for the full rationale.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal GITHUB_TOKEN scope — none of the jobs in this workflow write
# back to the repo, comment, or alter releases. Explicit read-only
# contents addresses the CodeQL "Workflow does not contain permissions"
# advisory (https://github.com/sumithr/sumo-qa/security/code-scanning/12).
permissions:
  contents: read

jobs:
  ruff:
    name: ruff check + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,vertex]"

      - name: ruff check
        run: python -m ruff check .

      - name: ruff format --check
        run: python -m ruff format --check .

  mypy:
    name: mypy (static type check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,vertex]"

      # Config (target version, paths, narrow ignores) lives in [tool.mypy]
      # in pyproject.toml so local and CI runs stay identical.
      - name: mypy
        run: python -m mypy

  shellcheck:
    name: shellcheck
    # CI mirror of the shellcheck-py pre-commit hook so a contributor who
    # skipped `pre-commit install` still gets the same enforcement.
    # ubuntu-latest ships shellcheck preinstalled — no extra install step.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck hooks/session-start scripts/check_markdown_links.sh scripts/pip_audit.sh install.sh

      # The prefilter is a cmd.exe/sh polyglot with no shebang, so it needs an
      # explicit --shell; its batch block is a quoted heredoc that shellcheck
      # reads as data, leaving just the POSIX branch to analyse.
      - name: shellcheck (cmd/sh polyglot hooks)
        run: shellcheck --shell=sh .claude/hooks/route-qa-runners-prefilter.cmd

  actionlint:
    name: actionlint (workflow lint)
    # CI mirror of the actionlint pre-commit hook: runs that same pinned hook
    # (rev in .pre-commit-config.yaml) through the pre-commit dev dep.
    # ubuntu-latest ships shellcheck, which actionlint uses on run: blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: python -m pip install -e ".[dev]"

      - name: actionlint
        run: pre-commit run actionlint --all-files

  markdown-links:
    name: markdown link existence
    # CI mirror of the local `markdown-link-existence` pre-commit hook.
    # Runs the same wrapper script against every tracked markdown file,
    # so a PR that breaks a doc reference fails CI even if the contributor
    # skipped `pre-commit install`. Single Python + single OS by design —
    # markdown rendering is platform-independent and the pytest matrix
    # adds nothing here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: python -m pip install -e ".[dev]"

      - name: Run link gate
        run: ./scripts/check_markdown_links.sh

  no-em-dashes:
    name: no em-dashes in docs
    # CI mirror of the local `no-em-dashes` pre-commit hook. Runs the same
    # script against the full documentation set so a stray em-dash fails CI
    # even if the contributor skipped `pre-commit install`. Single Python +
    # single OS, and stdlib-only (no dev deps), because prose is platform-
    # independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run em-dash gate
        run: python scripts/check_no_em_dashes.py

  context-budget:
    name: context token budget
    # Deterministic audit of what sumo-qa puts in a host's context:
    # the SessionStart bootstrap, the tools/list surface per profile and
    # capability group, root skills and the bundled review workflows, against [tool.sumo-qa.context-budget] in
    # pyproject.toml. Prints the full measurement table on every run. Single
    # Python + single OS: the estimate is platform-independent.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: python -m pip install -e .

      - name: Run context budget audit
        run: python scripts/audit_context_budget.py

  runtime-lock:
    name: runtime lock installs on the release platform
    # The release SBOM job installs .github/release/runtime-requirements.txt
    # with --no-deps on this platform (Linux, CPython 3.13). This runs the same
    # install before a tag, so a single-pin bump that breaks a transitive
    # constraint, or a pin with no Linux cp313 wheel, fails here instead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Build the wheel from the hashed release-tools lock
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/release/requirements.txt
          python -m build --no-isolation --wheel

      - name: Install the runtime lock and the wheel, then pip check
        run: |
          set -euo pipefail
          env_python="$RUNNER_TEMP/lock-env/bin/python"
          python -m venv --without-pip "$RUNNER_TEMP/lock-env"
          python -m pip --python "$env_python" install --require-hashes --no-deps --only-binary :all: \
            -r .github/release/runtime-requirements.txt
          # Separate call: the lock's hashes put the whole call in hash-checking mode.
          python -m pip --python "$env_python" install --no-deps dist/*.whl
          python -m pip --python "$env_python" check

  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    # CI mirror of the local `pip-audit` pre-commit hook so a contributor who
    # skipped `pre-commit install` still gets the same enforcement. Uses the
    # same setup-python + editable-install pattern as the ruff/mypy jobs above,
    # then runs scripts/pip_audit.sh, the SAME wrapper the pre-commit hook
    # calls, so the audit flags and suppression list are single-sourced and can
    # never drift between local and CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies + pip-audit
        run: python -m pip install -e ".[dev,vertex]" pip-audit

      - name: Run pip-audit gate
        run: ./scripts/pip_audit.sh
