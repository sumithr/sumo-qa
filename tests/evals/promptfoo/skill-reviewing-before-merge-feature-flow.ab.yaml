  - label: 'A1 - post-332 body (new, expected PASS)'
    raw: |
      You are a senior QA agent in an IDE chat session. You have loaded this
      sumo-qa skill and MUST follow its discipline exactly as written:

      --- BEGIN SKILL ---
      {{skill_content_new}}
      --- END SKILL ---

      Repository diff, prior review gates, and fresh verification evidence for
      this turn:

      --- GROUND-TRUTH CONTEXT ---
      {{ground_truth_context}}
      --- END GROUND-TRUTH CONTEXT ---

      The developer just said:

      > {{user_prompt}}

      Apply the loaded skill. The developer has WAIVED the section-by-section
      confirmation gates and asked for a single-pass verdict. Deliver the verdict
      in this one turn — no confirmation question. Keep the response concise and
      evidence-led.
tests:
  - description: SEED unexercised — CSV-export CLI feature, only the _row_to_csv() formatter unit ran, no AC supplied, risk gate CLOSED
    vars:
      user_prompt: >-
        Is this safe to merge? The new export command is in and the formatter
        unit test passes.
      ground_truth_context: |
        ## Prior review gates
        Scope gate: completed. The diff adds a new CLI subcommand
        `qa export --format csv <out_path>` to app/cli/export.py: it gathers the
        QA-run rows and WRITES a CSV report file at the given path. NO acceptance
        criteria were supplied for this review.
        Risk gate: completed and CLOSED. The developer confirmed there is exactly
        ONE named risk and NO other outstanding concern — no rollback, no
        persistence reordering, no schema change, no platform branch, no
        external-output matcher:
        R1 — the primary feature flow is a user running `qa export --format csv
        report.csv` and getting a correctly-populated CSV file on disk (header
        row + one line per QA run); that end-to-end CLI-to-artifact path is what
        the change serves.

        ## git diff
        ```diff
        diff --git a/app/cli/export.py b/app/cli/export.py
        @@ +export_cmd(out_path, fmt): gather rows, write CSV report to out_path @@
        +    rows = collect_run_rows()
        +    with open(out_path, "w", newline="") as fh:
        +        writer = csv.writer(fh)
        +        writer.writerow(HEADER)
        +        for row in rows:
        +            writer.writerow(_row_to_csv(row))
        diff --git a/app/cli/export.py b/app/cli/export.py
        @@ +_row_to_csv(row): map a run row to a CSV field list @@
        ```

        ## Fresh test run
        ```text
        $ pytest tests/cli/test_export.py -q
        tests/cli/test_export.py::test_row_to_csv_formats_fields PASSED
        9 passed, 0 skipped in 0.31s
        ```
        The only fresh test for this change asserts the per-row formatter
        (`_row_to_csv(sample_row) == ["...", "..."]`). NO fresh test invokes the
        `qa export --format csv` command end-to-end or reads back the written CSV
        file to assert its header + rows; the end-to-end CLI-to-artifact path was
        never exercised this turn.
      expected_shape: >-
        Evidence-led verdict that checks the primary FEATURE FLOW — a user running
        `qa export --format csv` and getting a correctly-populated CSV file on
        disk — and finds it was NEVER driven end-to-end this turn: only the
        lower-level per-row formatter unit (`_row_to_csv`) ran, with no fresh test
        invoking the CLI command or reading back the written artifact. Labels the
        flow UNVERIFIED (feature flow), explicitly DISTINCT from an unmet
        acceptance criterion (none were supplied), and delivers NOT SAFE TO MERGE,
        naming the unexercised `qa export` CLI-to-CSV path and the formatter unit
        that ran instead. Ends without a confirmation question.
      anti_patterns:
        - Declares SAFE TO MERGE because the _row_to_csv formatter unit test passes.
        - Treats the lower-level formatter unit as covering the end-to-end CLI export-to-CSV-file feature flow.
        - Never labels the unexercised feature flow as UNVERIFIED (feature flow) / a SAFE-blocker.
        - Mislabels the gap as an UNMET acceptance criterion when none were supplied.
        - Reaches NOT SAFE only via a generic uncovered-risk claim without invoking the feature-flow check.
        - Ends with a confirmation/clarifying question in place of the verdict (prescribed remediation steps after a delivered verdict are NOT this anti-pattern).
