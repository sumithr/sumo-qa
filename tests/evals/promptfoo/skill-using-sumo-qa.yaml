description: >
  Skill-isolation eval for using-sumo-qa. Valid sub-skills are embedded inline
  in the rubric; generated user_prompt scenarios live in
  skill-using-sumo-qa.generated-tests.yaml, produced by the .gen.yaml +
  extract_tests.py pipeline so the generator can never override the loaded
  skill.
  See tests/evals/promptfoo/README.md for the regen workflow.

providers:
  - file://providers/claude-candidate.yaml

defaultTest:
  vars:
    skill_content: file://../../../skills/using-sumo-qa/SKILL.md
    valid_sub_skills: |-
      sumo-qa-deciding-approach
      sumo-qa-preparing-for-work
      sumo-qa-creating-test-plan
      sumo-qa-implementing-with-tdd
      sumo-qa-reviewing-before-merge
      sumo-qa-strengthening-tests
      sumo-qa-answering-testing-question
      sumo-qa-finding-test-data
      sumo-qa-strategising
      sumo-qa-planning-qa-rollout
      sumo-qa-executing-qa-rollout
      sumo-qa-finishing-qa-work
      sumo-qa-suggesting-external-skill
    expected_shape: >-
      Router handoff only. Recognises the QA intent as change review before
      merge. Routes to the exact first-hop sub-skill name
      sumo-qa-deciding-approach. Explicitly states it is handing off or invoking
      that first-hop router. Does not route directly to a downstream sub-skill,
      execute the review inline, name risks, inspect imagined files, or give a
      merge verdict.
    anti_patterns:
      - Routes to a sub-skill not in the valid list.
      - Routes directly to a downstream sub-skill, skipping sumo-qa-deciding-approach.
      - Executes the review inline instead of routing.
      - Names a sub-skill vaguely or without exact kebab-case name.
      - Routes to a plausible-sounding but non-existent sub-skill.

  options:
    disableVarExpansion: true
    provider: file://providers/claude-judge.yaml
    rubricPrompt: |
      You are an adversarial reviewer grading whether the candidate response
      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.

      --- RUBRIC ---
      {{rubric}}
      --- END RUBRIC ---

      --- CANDIDATE RESPONSE ---
      {{output}}
      --- END CANDIDATE RESPONSE ---

      The complete valid sub-skill list is:

      {{valid_sub_skills}}

      Evaluate THREE axes:
      A. SHAPE - router handoff only, recognises the QA intent the Expected QA
         shape names (it differs per test), names sumo-qa-deciding-approach
         exactly as the first hop, and does not perform the downstream QA work
         inline or route directly to a downstream sub-skill.
      B. GROUNDING - the named sub-skill must appear in the exact valid
         sub-skill list above. B GROUNDING: any named sub-skill outside that
         list is GROUNDING FAIL.
      C. ANTI-PATTERNS - for each anti-pattern listed, mark ABSENT or PRESENT.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:
      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}

  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}

prompts:
  - |
    You are a senior QA agent in an IDE chat session. The developer is asking
    for QA-shaped work and this skill is the router. You have loaded the
    following sumo-qa skill and must follow its discipline:

    --- BEGIN SKILL ---
    {{skill_content}}
    --- END SKILL ---

    The valid sub-skills available for routing are:

    {{valid_sub_skills}}

    The developer just said:

    > {{user_prompt}}

    Route to the exact first-hop sub-skill required by the loaded router skill.
    State that handoff explicitly. Do NOT execute downstream QA work inline.

tests:
  # Seed scenario (inline).
  - description: "SEED - review changes before push"
    vars:
      user_prompt: >-
        Can you review my changes before I push?
  # Development-framed QA (#247): implementation framing hides a testing ask.
  # The router must still hand off to sumo-qa-deciding-approach instead of
  # answering the testing question inline.
  - description: "DEV-FRAMED - adding-analyze-diff-impact"
    vars:
      user_prompt: >-
        I'm adding sumo_qa_analyze_diff_impact. How should I test it?
      expected_shape: >-
        Router handoff only. Recognises the implementation-framed message as a
        QA-shaped testing request despite the development framing. Routes to
        the exact first-hop sub-skill name sumo-qa-deciding-approach and
        states that handoff explicitly. Does not list test cases, name
        techniques, write tests, or route directly to a downstream sub-skill.
  - description: "DEV-FRAMED - implementing-retry-worker"
    vars:
      user_prompt: >-
        I'm implementing a retry worker. What tests do I need for it?
      expected_shape: >-
        Router handoff only. Recognises the implementation-framed message as a
        QA-shaped testing request despite the development framing. Routes to
        the exact first-hop sub-skill name sumo-qa-deciding-approach and
        states that handoff explicitly. Does not list test cases, name
        techniques, write tests, or route directly to a downstream sub-skill.
  - description: "DEV-FRAMED - changing-parser-edge-cases"
    vars:
      user_prompt: >-
        I'm changing the parser. How do I cover the edge cases?
      expected_shape: >-
        Router handoff only. Recognises the implementation-framed message as a
        QA-shaped testing request despite the development framing. Routes to
        the exact first-hop sub-skill name sumo-qa-deciding-approach and
        states that handoff explicitly. Does not list test cases, name
        techniques, write tests, or route directly to a downstream sub-skill.
  - description: "DEV-FRAMED - building-endpoint-failing-tests"
    vars:
      user_prompt: >-
        I'm building this endpoint. Write the failing tests first.
      expected_shape: >-
        Router handoff only. Recognises the implementation-framed message as a
        QA-shaped testing request despite the development framing. Routes to
        the exact first-hop sub-skill name sumo-qa-deciding-approach and
        states that handoff explicitly. Does not list test cases, name
        techniques, write tests, or route directly to a downstream sub-skill.
  # Generated scenarios - bare TestCase array, produced by extract_tests.py
  # from .gen.yaml after `promptfoo generate dataset --write`.
  - file://skill-using-sumo-qa.generated-tests.yaml
