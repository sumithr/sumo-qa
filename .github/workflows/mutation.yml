name: mutation

# Nightly mutation-testing guard — strict 100% kill-rate gate.
#
# Two independent failure conditions (both must pass):
#   1. Regression catch: fails if any module's killed count drops below the
#      committed baseline in mutmut-baseline.json.
#   2. Strict-100% gate: fails if any module has surviving (non-killed,
#      non-skipped) mutants, i.e. survived > 0.
#
# "Skipped" mutants (mutmut's own exclusions for unreachable code, etc.) do NOT
# count against the gate — they are tooling-level non-tests, not weak assertions.
# Survivals of exit_code == 0 are the only values that trigger a SURVIVED verdict.

on:
  schedule:
    - cron: '0 5 * * *'  # 05:00 UTC nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # mutmut on this codebase ran in ~60s locally; generous CI budget.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev,vertex]"

      - name: Run mutmut
        id: mutate
        # Don't fail the step on non-zero exit; mutmut exits non-zero when
        # survivors exist.  We do our own comparison in the next step.
        #
        # MUST invoke via the `mutmut` console-script wrapper (not `python -m
        # mutmut`). The wrapper's shim does `from mutmut.__main__ import cli`,
        # putting `mutmut.__main__` into sys.modules under that key. `python -m
        # mutmut` loads it as `__main__` only — and mutmut's injected trampoline
        # later does `from mutmut.__main__ import record_trampoline_hit`, which
        # then re-imports mutmut.__main__ as a *fresh* module and re-runs its
        # top-level `set_start_method('fork')` call against an already-set
        # multiprocessing context → RuntimeError → "failed to collect stats".
        continue-on-error: true
        run: |
          set +e
          mutmut run 2>&1 | tee mutmut.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Compare against baseline
        # Reads per-module data directly from mutmut's .meta files —
        # each mutants/src/sumo_qa/<module>.py.meta contains a JSON object with
        # the key "exit_code_by_key": {mutant_name: exit_code, ...}.  Exit code
        # semantics (from mutmut source, __main__.py status_by_exit_code):
        #   1, 3, -24        -> killed
        #   0                -> survived
        #   5, 33            -> no tests
        #   34               -> skipped
        #   35               -> suspicious
        #   36, 24, 152, 255 -> timeout
        #   37               -> caught by type check
        #   -11, -9          -> segfault
        #   all others       -> suspicious
        #
        # NOTE: `mutmut export-cicd-stats` was intentionally NOT used here.
        # Despite the name, that command (mutmut 3.x) writes an aggregate-only
        # JSON to mutants/mutmut-cicd-stats.json (not stdout) and contains no
        # per-module breakdown.  Reading .meta files is the authoritative
        # per-module source and matches how mutmut's own browse/results commands
        # work internally.
        run: |
          python <<'EOF'
          import json
          import os
          import sys
          from collections import defaultdict
          from pathlib import Path

          # Killed exit codes — copied from mutmut/__main__.py status_by_exit_code.
          KILLED_EXIT_CODES = {1, 3, -24}

          # Load committed baseline (per-module killed counts captured at Phase 3).
          baseline = json.loads(Path("mutmut-baseline.json").read_text())
          baseline_per_module = baseline["per_module"]

          # Read per-module data from mutmut's .meta files.
          # Each .meta file path is mutants/src/sumo_qa/<module>.py.meta and
          # contains {"exit_code_by_key": {mutant_name: exit_code, ...}, ...}.
          current: dict[str, dict] = {}
          meta_root = Path("mutants/src/sumo_qa")

          for module in baseline_per_module:
              meta_path = meta_root / f"{module}.py.meta"
              if not meta_path.exists():
                  current[module] = {"killed": 0, "survived": 0, "total": 0, "missing": True}
                  continue
              meta = json.loads(meta_path.read_text())
              exit_codes = meta.get("exit_code_by_key", {})
              killed = sum(1 for ec in exit_codes.values() if ec in KILLED_EXIT_CODES)
              total = len(exit_codes)
              survived = sum(1 for ec in exit_codes.values() if ec == 0)
              survivor_names = sorted(k for k, ec in exit_codes.items() if ec == 0)
              current[module] = {
                  "killed": killed, "survived": survived, "total": total,
                  "missing": False, "survivor_names": survivor_names,
              }

          # Compare per-module.
          failed = []
          summary_lines = ["| Module | Baseline killed | Current killed | Survivors | Verdict |"]
          summary_lines.append("| --- | --- | --- | --- | --- |")
          for module, base in baseline_per_module.items():
              curr = current.get(module, {"killed": 0, "survived": 0, "total": 0, "missing": True})
              base_killed = base["killed"]
              curr_killed = curr["killed"]
              survived = curr["survived"]
              if curr.get("missing"):
                  verdict = "MISSING"
                  failed.append(f"{module}: .meta file not found — did mutmut run complete?")
              elif curr_killed < base_killed:
                  verdict = "DROPPED"
                  failed.append(f"{module}: killed dropped from {base_killed} -> {curr_killed}")
              elif survived > 0:
                  verdict = "SURVIVED"
                  failed.append(f"{module}: {survived} mutant(s) survived — 100% kill rate required")
              else:
                  verdict = "OK"
              summary_lines.append(f"| {module} | {base_killed} | {curr_killed} | {survived} | {verdict} |")

          summary = "\n".join(summary_lines)
          print(summary)
          # Surface to GitHub Actions step summary.
          gh_summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if gh_summary_path:
              Path(gh_summary_path).write_text(f"## Mutation gate\n\n{summary}\n")

          if failed:
              print("\nFAIL: mutation gate failed:")
              for f in failed:
                  print(f"  - {f}")
              # List the surviving mutant names so triage can start without re-running mutmut.
              print("\nSurviving mutant names (per module):")
              for module, curr in current.items():
                  names = curr.get("survivor_names", [])
                  if names:
                      print(f"\n  [{module}] {len(names)} survivors:")
                      for n in names:
                          print(f"    - {n}")
              sys.exit(1)
          print("\nAll modules: kill counts >= baseline and 0 survivors. Strict gate passed.")
          EOF

      - name: Upload mutmut log + meta files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mutmut-debug
          path: |
            mutmut.log
            mutants/src/sumo_qa/*.py.meta
          if-no-files-found: warn
          retention-days: 14
