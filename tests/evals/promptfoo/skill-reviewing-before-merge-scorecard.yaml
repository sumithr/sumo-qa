description: >
  QA-readiness-scorecard eval for sumo-qa-reviewing-before-merge (issue #151).
  Measures that the review, when asked for a readiness scorecard, appends it
  BELOW the prose verdict and that the DERIVED recommendation refuses a ready
  state whenever a named high-impact risk is an uncovered blocker (seed 1) or the
  only evidence is stale (seed 2). The scorecard summarises evidence; it must
  never read "ready" while the verdict is NOT SAFE TO MERGE.
providers:
  - id: openai:chat:gpt-5-mini
    label: candidate-gpt-5-mini
    config:
      temperature: 0.0
      seed: 42
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-reviewing-before-merge/SKILL.md
    expected_shape: >-
      Final-turn merge-review verdict that LEADS with the prose answer (named
      risks + fresh test evidence + a NOT SAFE TO MERGE call), then appends a QA
      readiness scorecard BELOW it. The scorecard's derived recommendation is one
      of blocked or insufficient_evidence — NEVER a ready state — because a named
      high-impact risk is either an uncovered blocker or backed only by stale
      evidence. Absent coverage/mutation signals are shown as "not measured",
      never assumed passing, and the scorecard is explicitly an evidence summary,
      not a predictive quality score. The scorecard is an appendix, never a
      replacement for the prose verdict.
    anti_patterns:
      - Scorecard recommendation is "ready" or "ready_with_accepted_residuals" while the verdict is NOT SAFE TO MERGE.
      - Replaces the prose verdict with only the scorecard (markdown-first verdict lost).
      - Treats an absent coverage/mutation signal as passing instead of "not measured".
      - Invents a numeric/percentage quality score not backed by supplied evidence.
      - Reads stale or unknown-freshness evidence as a basis for a ready verdict.
      - Surfacing literal taxonomy labels such as business_logic_change.
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0.0
        seed: 42
        response_format:
          type: json_object
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response
      demonstrates the QA shape AND avoids the named anti-patterns. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response LEAD with a prose verdict (named risks + fresh
         test evidence + a SAFE / NOT SAFE call) and THEN append a QA readiness
         scorecard below it? The verdict must be NOT SAFE TO MERGE, and the
         scorecard's recommendation must be a NON-ready state (blocked or
         insufficient_evidence). A scorecard reading ready / ready_with_accepted_
         residuals, or a prose verdict replaced by a bare scorecard -> SHAPE FAIL.

      B. GROUNDING - the scorecard must rest on the supplied prior named risks and
         fresh test output. The non-ready recommendation must trace to the
         specific uncovered/stale risk in the supplied evidence, and absent
         signals (coverage/mutation) must be shown as not measured, not assumed
         green.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.

      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - |
    You are a senior QA agent in an IDE chat session. You have loaded this
    sumo-qa skill and MUST follow its discipline exactly as written:

    --- BEGIN SKILL ---
    {{skill_content}}
    --- END SKILL ---

    Repository diff, prior review gates, and fresh verification evidence for
    this turn:

    --- GROUND-TRUTH CONTEXT ---
    {{ground_truth_context}}
    --- END GROUND-TRUTH CONTEXT ---

    The developer just said:

    > {{user_prompt}}

    Apply the loaded skill. This is the final verdict turn: deliver the prose
    verdict citing the named risks + fresh test evidence, THEN — because the
    developer asked for readiness — append the QA readiness scorecard below the
    verdict. No confirmation gate.
tests:
  - description: SEED - uncovered idempotency-on-retry risk, readiness scorecard requested
    vars:
      user_prompt: >-
        Is this ready to merge? Give me a readiness scorecard I can paste into
        the PR.
      ground_truth_context: |
        ## Prior review gates
        Prior turns (NOT shown above): you read the diff, named the risks, the
        user confirmed them, and you ran the suite. This is the FINAL TURN.

        Risk gate: completed. Confirmed risks are (R1) the new invalid-amount
        path returns 422 where it previously returned 500, and (R2) the
        idempotency key derivation moved into the domain object, so a retry of a
        partially-completed refund can derive a different key and double-refund.

        ## git diff
        ```diff
        diff --git a/services/billing/refund.py b/services/billing/refund.py
        @@ services/billing/refund.py:40-52 @@
        -47     raise RefundError("invalid amount")  # fell through to 500
        +47     raise RefundAmountInvalid(amount)     # returns 422
        diff --git a/domain/Refund.kt b/domain/Refund.kt
        @@ domain/Refund.kt:14-20 @@
        -18     val idempotencyKey = request.idempotencyKey
        +18     val idempotencyKey = deriveKey(this.lastModifiedAt, this.amount)
        diff --git a/tests/billing/test_refund_api.py b/tests/billing/test_refund_api.py
        @@ tests/billing/test_refund_api.py:30-40 @@
        +33 def test_invalid_amount_returns_422():
        +34     assert refund(amount=-1).status == 422
        ```

        ## Fresh test run
        ```text
        $ pytest tests/billing/test_refund_api.py -q
        tests/billing/test_refund_api.py::test_partial_refund_happy_path PASSED
        tests/billing/test_refund_api.py::test_invalid_amount_returns_422 PASSED
        2 passed in 0.41s
        ```
        Note: no fresh test re-invokes the refund path twice after a partial
        failure, so R2 (idempotency-on-retry double refund) has NO covering test.
        No coverage or mutation report was produced this turn.
  - description: SEED - fresh suite green but the named risk rests only on stale CI evidence
    vars:
      user_prompt: >-
        Is this ready to release? Give me the readiness scorecard.
      ground_truth_context: |
        ## Prior review gates
        Prior turns (NOT shown above): you read the diff, named the risks, the
        user confirmed them, and you ran the unit suite. This is the FINAL TURN.

        Risk gate: completed. Confirmed risk (R1): the auth-token refresh path
        was rewritten; the only evidence it still works end-to-end is the
        integration suite, which last ran against an OLDER commit.

        ## Context bundle (host-supplied)
        head_sha: f31ac09 (current)
        test_evidence: result=passing, freshness=fresh, source=local_git
          (unit suite, this turn)
        ci_status: result=passing, freshness=stale, source=ci_provider,
          captured_against_sha=9b2c1aa  (the integration/e2e suite — older commit)

        ## git diff
        ```diff
        diff --git a/auth/token_refresh.py b/auth/token_refresh.py
        @@ auth/token_refresh.py:20-44 @@
        -28     return self._legacy_refresh(tok)
        +28     return self._refresh_with_rotation(tok)
        ```

        ## Fresh test run
        ```text
        $ pytest tests/auth/test_token_refresh_unit.py -q
        3 passed in 0.22s
        ```
        Note: the rewritten refresh path's end-to-end behaviour is only covered
        by the integration suite in the context bundle, whose CI evidence is
        STALE (captured against 9b2c1aa, not the current head f31ac09). No fresh
        end-to-end run was produced this turn.
