        \ ``src`` the slice would drift and silently drop a\n+134       # real import (#458). For valid\
        \ UTF-8 the round-trip is identity, so this\n+135       # is a no-op there.\n+136       normalized\
        \ = src.decode(\"utf-8\", errors=\"replace\").encode(\"utf-8\")\n+137       tree = parser.parse(normalized)\n\
        +138       if (\n+139           tree is None\n+140       ):  # pragma: no cover -- defensive: parse()\
        \ of normalized bytes always yields a tree\n 141           raise TreesitterUnavailableError(f\"\
        tree-sitter returned no parse tree for {language}\")\n-139       return TSNode(tree.root_node(),\
        \ decoded.encode(\"utf-8\"))\n+142       return TSNode(tree.root_node, normalized)\n\ndiff --git\
        \ a/tests/test_repo_map_treesitter.py b/tests/test_repo_map_treesitter.py\n@@ tests/test_repo_map_treesitter.py:92-121\
        \ @@\n 92        assert \"block\" in kinds\n 93    \n 94    \n-93    def test_node_accessors_are_method_style():\n\
        -94        # The language-pack binding exposes node accessors as zero-arg METHODS,\n-95        #\
        \ not properties — the non-mainstream shape the adapter exists to absorb.\n-96        # If an upgrade\
        \ flips these to properties, the wrapper's int()/range() calls\n-97        # break; assert the raw\
        \ shape here so the failure is precise.\n+95    def test_node_accessors_are_property_style():\n\
