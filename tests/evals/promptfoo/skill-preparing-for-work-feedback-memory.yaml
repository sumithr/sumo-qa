description: >
  Issue #145 — proves the review-feedback-memory advisory-hints note drives the
  prep brief correctly. Two scenarios: (1) memory PRESENT and trigger-matched —
  the candidate must surface the saved lesson as a SEPARATE advisory hint that
  sharpens a named risk, never as an override of the canonical classification or
  change-rule; (2) memory ABSENT — the candidate must fall back to the normal
  risk-naming and must NOT invent a hint or auto-capture. The judge grades that a
  matched hint appears as advisory (not authority) and that nothing is captured.
providers:
  - id: openai:chat:gpt-5-mini
    label: candidate-gpt-5-mini
    config:
      temperature: 0.0
      seed: 42
defaultTest:
  vars:
    skill_content: file://../../../skills/sumo-qa-preparing-for-work/SKILL.md
    loaded_classifications: file://../../../knowledge/classifications.md
    loaded_rules: file://../../../standards/rules/change_rules.yaml
    expected_shape: >-
      Risk-shaped QA prep brief. When saved review feedback is supplied AND its
      trigger matches the change, the candidate consults it as an ADVISORY HINT
      that sharpens a named risk — surfaced SEPARATELY (e.g. labelled "advisory
      hint from saved review feedback" or clearly distinct from the loaded
      ISTQB/techniques/rules) and anchored to the change. The hint never
      overrides a canonical classification or change-rule. When NO saved feedback
      is supplied, the candidate names risks normally from the change and does
      NOT invent a saved lesson. In neither case does the candidate auto-capture
      or claim to save a new lesson.
    anti_patterns:
      - Treating the saved review lesson as a hard blocker, a canonical rule, or
        an override of the change classification rather than an advisory hint.
      - Inventing a saved review lesson when none was supplied (the memory-absent
        scenario), or claiming memory says something it does not.
      - Auto-capturing / claiming to save a new review lesson from this prep turn.
      - Surfacing literal taxonomy labels such as business_logic_change.
  assert:
    - type: llm-rubric
      value: |
        **Expected QA shape:** {{expected_shape}}

        **Anti-patterns (any PRESENT = FAIL - apply the decision table):**
        {% for ap in anti_patterns %}
        - {{ ap }}
        {% endfor %}
  options:
    disableVarExpansion: true
    provider:
      id: openai:chat:gpt-5.5
      config:
        temperature: 0.0
        seed: 42
        response_format:
          type: json_object
    rubricPrompt: >
      You are an adversarial reviewer grading whether the candidate response
      treats saved review feedback as an ADVISORY hint (never an authority) and
      handles the memory-absent case without fabrication. Be strict.


      --- RUBRIC ---

      {{rubric}}

      --- END RUBRIC ---


      --- CANDIDATE RESPONSE ---

      {{output}}

      --- END CANDIDATE RESPONSE ---


      Evaluate THREE axes independently:


      A. SHAPE - does the response name 3+ anchored risks for the change AND, in
         the memory-PRESENT scenario, surface the matched saved lesson as a
         SEPARATE advisory hint that sharpens a risk (not as a hard blocker /
         canonical rule / classification override)? In the memory-ABSENT
         scenario, does it name risks normally WITHOUT inventing a saved lesson?

      B. GROUNDING - the named risks must visibly use the supplied change
         snippet. In the memory-PRESENT scenario the advisory hint must trace to
         the supplied SAVED REVIEW FEEDBACK block (same trigger). Narrating
         without using the supplied context -> GROUNDING FAIL.

      C. ANTI-PATTERNS - for each anti-pattern listed in the rubric, mark
         ABSENT or PRESENT. PRESENT = the response actually exhibits it.


      Decision table:
         | A SHAPE | B GROUNDING | Any anti-pattern PRESENT? | Verdict |
         | PASS    | PASS        | No                        | PASS    |
         | PASS    | PASS        | Yes                       | FAIL    |
         | PASS    | FAIL        | *                         | FAIL    |
         | FAIL    | *           | *                         | FAIL    |

      Return ONLY JSON, no markdown:

      {"pass": <true|false>, "score": <0.0 to 1.0>, "reason": "<grade A/B/C then verdict>"}
prompts:
  - |
    You are a senior QA agent in an IDE chat session. You have loaded this
    sumo-qa skill and MUST follow its discipline exactly as written:

    --- BEGIN SKILL ---
    {{skill_content}}
    --- END SKILL ---

    You have also loaded the canonical change classifications:

    --- LOADED CLASSIFICATIONS ---
    {{loaded_classifications}}
    --- END LOADED CLASSIFICATIONS ---

    ...and the team's change rules (keyed by classification):

    --- LOADED RULES ---
    {{loaded_rules}}
    --- END LOADED RULES ---

    Repository state, change context, and (when present) the team's SAVED REVIEW
    FEEDBACK memory for this turn:

    --- GROUND-TRUTH CONTEXT ---
    {{ground_truth_context}}
    --- END GROUND-TRUTH CONTEXT ---

    The developer just said:

    > {{user_prompt}}

    This is the QA-prep turn. Produce EXACTLY this response format:

    Line 1: `Naming risks and the smallest test set.`

    ## Risks (each MUST cite a specific line number from the supplied snippet)

    1. **<risk name>** (line N: `<exact code fragment>`): one-sentence anchor in observable behaviour.
    2. ...

    ## Tests (each tied to a risk by NUMBER)

    1. Test for risk 1: one-sentence test idea.
    2. ...

    ## Techniques (each named verbatim from the loaded techniques vocabulary)

    - Risk 1 → <technique>
    - ...

    Consult any supplied team context (including a SAVED REVIEW FEEDBACK block, if
    present) to sharpen the named risks — the loaded skill governs HOW to use it.
    Describe behaviour in plain domain terms — NEVER surface internal taxonomy
    labels (e.g. write "behaviour change in billing-day logic", never
    "business_logic_change") and NEVER narrate which tools you loaded. NO test
    code. NO formal entry/exit criteria. NO confirmation question. NO closing
    pleasantry.
tests:
  - description: memory PRESENT and trigger-matched (billing timezone boundary)
    vars:
      user_prompt: >-
        I'm changing how we compute the invoice billing day for subscriptions in
        the billing service. Help me prep QA.
      ground_truth_context: |
        ## billing/invoice_day.py (after the change)
        ```
         1 def billing_day(subscription, now):
         2     local = now.astimezone(subscription.tz)
         3     return local.date()
        ```

        ## SAVED REVIEW FEEDBACK
        - scope: billing service
          trigger_signal: any change touching timezone or day-boundary logic in invoicing
          recommended_probe: boundary value analysis on the 23:59 -> 00:00 local day rollover across DST
          source_note: we shipped two off-by-one-day invoice bugs last quarter
          last_reviewed: 2026-03-01T09:00:00Z
  - description: memory ABSENT (no saved feedback supplied)
    vars:
      user_prompt: >-
        I'm changing how we compute the invoice billing day for subscriptions in
        the billing service. Help me prep QA.
      ground_truth_context: |
        ## billing/invoice_day.py (after the change)
        ```
         1 def billing_day(subscription, now):
         2     local = now.astimezone(subscription.tz)
         3     return local.date()
        ```

        (No saved review feedback memory exists for this repo yet.)
