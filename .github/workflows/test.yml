name: tests

# Avoid double-runs on every push to a PR branch:
#   - `push: branches: [main]` — only main pushes trigger the push event
#     (covers merges + direct main commits).
#   - `pull_request: branches: [main]` — PR opens/updates trigger here
#     (covers all feature-branch development).
# Push to a feature branch with an open PR → only pull_request fires, once.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push lands on the same ref.
# Saves CI minutes during rapid iteration; the latest commit always gets the
# definitive run. Uses `github.ref` (GitHub-computed, not attacker-supplied)
# so per-PR concurrency buckets stay distinct without exposing branch-name
# injection risk in the grouping key.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }} · py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest --cov=src/sumo_qa --cov-fail-under=100 -q
